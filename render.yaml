services:
  - type: web
    name: kscan-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install express cors dotenv
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is injected automatically by Render — do NOT add it here.
      - key: CORS_ORIGIN
        value: "*"
      - key: KSCAN_LOG_MATCH
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: KSCAN_EMAIL_INTERNAL_SECRET
        sync: false
      - key: KSCAN_EMAIL_FROM
        value: "K Scan <hello@info.kscan.app>"
      - key: KSCAN_EMAIL_REPLY_TO
        value: "kscanai.app@gmail.com"
