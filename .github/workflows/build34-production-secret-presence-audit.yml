name: Build 34 Production Secret Presence Audit

on:
  push:
    branches:
      - ops/build34-production-secret-presence-9c6576ec
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_BRANCH: rebuild/backend-authority-v2
  BACKEND_SHA: 9c6576ec26696bb067f1732984832d8be17d540a

jobs:
  audit:
    name: Production secret names only
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BACKEND_SHA }}
          fetch-depth: 0

      - name: Assert exact governed backend authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BACKEND_SHA}"
          git fetch origin "${BACKEND_BRANCH}" --quiet
          test "$(git rev-parse "origin/${BACKEND_BRANCH}")" = "${BACKEND_SHA}"
          test -z "$(git status --porcelain)"
          echo "backend authority: PASS ${BACKEND_SHA}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required production secret names without printing values
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          SECRET_LIST_JSON="${RUNNER_TEMP}/production-build34-secret-names.json"
          trap 'rm -f "${SECRET_LIST_JSON}"' EXIT
          supabase --output json secrets list --project-ref "${SUPABASE_PRODUCTION_PROJECT_REF}" > "${SECRET_LIST_JSON}"
          SECRET_LIST_JSON="${SECRET_LIST_JSON}" node <<'NODE'
          const fs = require('fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.SECRET_LIST_JSON, 'utf8'));
          const rows = Array.isArray(parsed)
            ? parsed
            : Array.isArray(parsed?.secrets)
              ? parsed.secrets
              : Array.isArray(parsed?.result)
                ? parsed.result
                : [];
          const names = new Set(rows
            .map((row) => row && typeof row === 'object'
              ? (row.name ?? row.key ?? row.secret_name)
              : null)
            .filter(Boolean));

          const required = [
            'RAPIDAPI_KEY',
            'GEMINI_API_KEY',
            'APIFY_API_TOKEN',
            'APIFY_VINTED_ACTOR_ID',
            'SECONDHAND_VINTED_ENABLED',
            'APPLE_TEAM_ID',
            'APPLE_KEY_ID',
            'APPLE_PRIVATE_KEY',
            'APPLE_CLIENT_ID',
            'APPLE_TOKEN_ENCRYPTION_KEY',
            'ELEVENLABS_API_KEY',
            'ELEVENLABS_MODEL_ID',
            'ELEVENLABS_OUTPUT_FORMAT',
            'ELEVENLABS_STYLIST_01_VOICE_ID',
            'ELEVENLABS_STYLIST_02_VOICE_ID',
            'ELEVENLABS_STYLIST_03_VOICE_ID',
            'ELEVENLABS_STYLIST_04_VOICE_ID',
            'ELEVENLABS_STYLIST_05_VOICE_ID',
            'ELEVENLABS_STYLIST_06_VOICE_ID',
            'ELEVENLABS_STYLIST_07_VOICE_ID',
            'ELEVENLABS_STYLIST_08_VOICE_ID',
            'ELEVENLABS_STYLIST_09_VOICE_ID',
            'ELEVENLABS_STYLIST_10_VOICE_ID',
            'REVENUECAT_SECRET_API_KEY',
            'REVENUECAT_PROJECT_ID',
          ];

          const optional = [
            'APIFY_VINTED_TIMEOUT_SECS',
            'APIFY_VINTED_INPUT_TEMPLATE',
            'REVENUECAT_KPLUS_ENTITLEMENT_ID',
            'STYLECHAT_GEMINI_MODEL',
            'STYLECHAT_AI_ENABLED',
            'REVENUECAT_SYNC_ENABLED',
          ];

          const missing = required.filter((name) => !names.has(name));
          for (const name of required) {
            console.log(`${names.has(name) ? 'PRESENT' : 'MISSING'} required secret/config name: ${name}`);
          }
          for (const name of optional) {
            console.log(`${names.has(name) ? 'PRESENT' : 'ABSENT'} optional config name: ${name}`);
          }
          if (missing.length) {
            console.error('Missing required production Build 34 secret/config names: ' + missing.join(', '));
            process.exit(1);
          }
          console.log('BUILD34_PRODUCTION_SECRET_PRESENCE=PASS');
          NODE
