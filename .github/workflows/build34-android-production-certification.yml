name: Build 34 Android Production Certification

on:
  push:
    branches:
      - release/build34-android-production-certification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build34-android-production-certification
  cancel-in-progress: false

jobs:
  prebuild-audit:
    name: Android pre-build audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production-certification profile
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const cert = eas.build?.['production-certification'];
          const prod = eas.build?.production;
          if (!cert || !prod) throw new Error('production-certification or production profile missing');
          if (cert.extends !== 'production') throw new Error('production-certification must extend production');
          if (cert.environment !== 'production') throw new Error('production-certification must pin EAS environment=production');

          const resolvedEnv = { ...(prod.env || {}), ...(cert.env || {}) };
          const requiredTrue = [
            'EXPO_PUBLIC_KPLUS_EARLY_ACCESS_ENABLED',
            'EXPO_PUBLIC_SMART_WATCHLIST_V1',
            'EXPO_PUBLIC_VTO_UI_ENABLED',
            'EXPO_PUBLIC_PACKING_INTELLIGENCE_V1',
            'EXPO_PUBLIC_ELISE_CONCIERGE_V1',
            'EXPO_PUBLIC_VOICESCAN_ENABLED',
            'EXPO_PUBLIC_MULTI_IMAGE_SCANNER_ENABLED',
            'EXPO_PUBLIC_CLOSET_CLOUD_SYNC_V1',
            'EXPO_PUBLIC_CLOSET_CROSS_DEVICE_RESTORE_V1',
            'EXPO_PUBLIC_CLOSET_LEGACY_MIGRATION_V1',
          ];
          for (const key of requiredTrue) {
            if (resolvedEnv[key] !== 'true') throw new Error(key + ' must resolve true');
          }
          if (cert.env?.KSCAN_VOICE_NATIVE_CAPABILITY !== 'true') {
            throw new Error('KSCAN_VOICE_NATIVE_CAPABILITY must be true');
          }
          const url = resolvedEnv.EXPO_PUBLIC_SUPABASE_URL || '';
          if (!url.includes('wyyuqfdxucjksghsmhry')) throw new Error('production Supabase ref missing');
          if (url.includes('yzqjvdfgefveprobvvyw')) throw new Error('staging Supabase ref leaked into certification profile');

          const native = JSON.parse(fs.readFileSync('config/native-config-authority.json', 'utf8'));
          const exceptions = native.platforms.android.buildProfileManifestExceptions.exceptions;
          const byId = Object.fromEntries(exceptions.map((x) => [x.id, x]));
          for (const id of [
            'VOICE_SCAN_PRODUCTION_READINESS_CAPABILITY',
            'REMOTE_PUSH_NOTIFICATION_CAPABILITY',
            'VOICE_AND_REMOTE_PUSH_COMBINED_CAPABILITY',
          ]) {
            if (!byId[id]?.selectorSetByEasProfiles?.includes('production-certification')) {
              throw new Error(id + ' does not authorize production-certification');
            }
          }
          console.log('production-certification matrix: PASS');
          NODE

      - name: Native config parity
        run: npm run verify:native-config-parity

      - name: Dependency reachability
        run: npm run verify:dependency-reachability

      - name: Full regression suite
        run: npm run test:all

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Release JS export
        env:
          CI: '1'
        run: npx expo export --platform android --output-dir dist-prebuild-android

      - name: Confirm Expo authentication prerequisite
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::GitHub secret EXPO_TOKEN is missing. A full EAS cloud build cannot be launched non-interactively."
            exit 1
          fi
          npx eas-cli@latest whoami

  eas-build:
    name: Android full EAS build
    needs: prebuild-audit
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Launch and wait for Android EAS build
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build \
            --platform android \
            --profile production-certification \
            --non-interactive \
            --wait \
            --json > eas-android-build.json
          cat eas-android-build.json

      - name: Publish build evidence
        uses: actions/upload-artifact@v4
        with:
          name: build34-android-eas-result-${{ github.run_number }}
          path: eas-android-build.json
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          node <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('eas-android-build.json', 'utf8'));
          const b = Array.isArray(raw) ? raw[0] : raw;
          console.log('## Build 34 Android EAS');
          console.log('');
          console.log('- SHA: `' + process.env.GITHUB_SHA + '`');
          console.log('- Build ID: `' + (b?.id || 'unknown') + '`');
          console.log('- Status: `' + (b?.status || 'unknown') + '`');
          if (b?.buildUrl) console.log('- Build: ' + b.buildUrl);
          if (b?.artifacts?.applicationArchiveUrl) console.log('- Artifact: ' + b.artifacts.applicationArchiveUrl);
          NODE
