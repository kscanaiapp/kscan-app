# E4.1 Room Intelligence live probe (staging only).
#
# Proves the DEPLOYED stylechat-generate produces grounded, authorized room
# reasoning against a real Dressing Room. Source tests cannot establish this:
# they supply their own evidence, so they certify the manifest builder, not the
# interaction between authorization, the manifest and the model.
#
# Staging (yzqjvdfgefveprobvvyw) only. Production is never targeted, and the
# probe itself refuses a production ref or URL before any network call.
#
# Artifacts carry PASS/FAIL, reason codes and safe metadata only. Raw prompts
# and raw model responses are never uploaded.

name: K Scan E4.1 Room Intelligence Live Probe

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: 'Branch or SHA whose probe source should run'
        required: true
        default: integration/build29-dressing-room-e41
        type: string

permissions:
  contents: read

# Shares the staging serialization group: the probe creates and deletes fixture
# rows, so it must not interleave with a staging deployment.
concurrency:
  group: kscan-staging-deployment
  cancel-in-progress: false

env:
  EXPECTED_STAGING_REF: yzqjvdfgefveprobvvyw
  PRODUCTION_REF: wyyuqfdxucjksghsmhry

jobs:
  e41-live-probe:
    name: E4.1 room intelligence live probe (staging only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Confirm environment authority
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ "${SUPABASE_STAGING_PROJECT_REF}" != "${EXPECTED_STAGING_REF}" ]; then
            echo "::error::Staging project ref does not match the expected authority."
            exit 1
          fi
          if [ "${SUPABASE_STAGING_PROJECT_REF}" = "${PRODUCTION_REF}" ]; then
            echo "::error::Refusing to target production."
            exit 1
          fi

      - name: Verify the probe harness before trusting its verdict
        run: |
          set -euo pipefail
          node --test __tests__/release/e41BehaviorAssertions.test.js
          node --test __tests__/release/e41ProbeHarness.test.js

      - name: Run E4.1 live probe
        id: probe
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          STAGING_SYNTHETIC_ACTIVE_EMAIL: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_EMAIL }}
          STAGING_SYNTHETIC_ACTIVE_PASSWORD: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_PASSWORD }}
        run: |
          set -euo pipefail
          node -e "
            const probe = require('./security/release/run-e41-room-intelligence-live-probe.js');
            probe.run().then((report) => {
              require('node:fs').writeFileSync('e41-probe-report.json', JSON.stringify(report, null, 2));
              console.log(JSON.stringify(report.summary, null, 2));
              process.exit(report.summary.verdict === 'PASS' ? 0 : 1);
            }).catch((error) => {
              // Classification, never the message body: a thrown error can
              // carry response text.
              console.error('E4.1 probe failed:', error.code || 'UNKNOWN', error.status ? `http=${error.status}` : '');
              process.exit(1);
            });
          "

      - name: Publish certification summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f e41-probe-report.json ]; then
            {
              echo '### E4.1 runtime certification'
              echo ''
              echo '```json'
              python3 -c "import json;d=json.load(open('e41-probe-report.json'));print(json.dumps({'summary':d['summary'],'latency':d['latency']},indent=2))"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report produced; see the probe step for the failure classification.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e41-room-intelligence-probe-${{ github.run_id }}
          path: e41-probe-report.json
          retention-days: 30
          if-no-files-found: warn
