name: Native iOS Release Tests

# Branch-neutral native iOS release runner.
#
# Maestro drives the same .maestro/flows/release set as the Android runner, so
# both platforms prove the same required inventory with one flow definition and
# platform-specific setup only. That is the lowest-complexity mechanism that
# covers current app behavior; an XCUITest harness would duplicate the flows
# without adding coverage.
#
# It builds a Simulator app, so it needs no signing identity, no provisioning
# profile, and no App Store credentials. It never runs an EAS production build
# and never submits.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit to build and test. Defaults to the dispatched ref.
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        required: false
        type: string
    secrets:
      QA_EMAIL:
        required: false
      QA_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: native-ios-release-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  MAESTRO_VERSION: 1.39.0
  APP_ID: com.kscanai.app
  SIMULATOR_NAME: iPhone 15
  SIMULATOR_OS: latest

jobs:
  ios:
    name: iOS release flows
    # Expo SDK 54 / React Native 0.81 generate a Podfile that rejects Xcode 15
    # ("Please upgrade XCode"), which is the macos-14 default. macos-15 ships
    # Xcode 16, and the version is pinned below so the toolchain is recorded in
    # the evidence rather than inherited from whatever the image defaults to.
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      result: ${{ steps.evidence.outputs.result }}
      tested_sha: ${{ steps.candidate.outputs.sha }}

    steps:
      - name: Resolve candidate SHA
        id: candidate
        env:
          REQUESTED: ${{ inputs.candidate_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHA="${REQUESTED:-$DEFAULT_SHA}"
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "candidate_sha must be a full 40-character commit SHA, got: $SHA" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Testing candidate $SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1

      - name: Verify checked-out commit matches the candidate
        env:
          EXPECTED: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "checkout drift: expected $EXPECTED, got $ACTUAL" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Select Xcode
        id: xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Record toolchain
        id: toolchain
        run: |
          set -euo pipefail
          XCODE="$(xcodebuild -version | head -n1 | awk '{print $2}')"
          echo "xcode=$XCODE" >> "$GITHUB_OUTPUT"
          echo "Xcode $XCODE"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve staging build environment
        run: |
          set -euo pipefail
          node -e "
            const eas = require('./eas.json');
            const env = eas.build.preview.env || {};
            const url = env.EXPO_PUBLIC_SUPABASE_URL || '';
            if (!url.includes('yzqjvdfgefveprobvvyw')) {
              console.error('refusing to run: preview profile does not target the staging Supabase project');
              process.exit(1);
            }
            const fs = require('fs');
            for (const [k, v] of Object.entries(env)) fs.appendFileSync(process.env.GITHUB_ENV, k + '=' + v + '\n');
          "

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          cd ios
          pod install --repo-update

      - name: Boot simulator
        id: sim
        run: |
          set -euo pipefail
          RUNTIME="$(xcrun simctl list runtimes --json | node -e "
            let raw=''; process.stdin.on('data', d => raw += d).on('end', () => {
              const runtimes = JSON.parse(raw).runtimes.filter(r => r.isAvailable && /iOS/.test(r.name));
              if (!runtimes.length) { console.error('no iOS runtime available'); process.exit(1); }
              const latest = runtimes[runtimes.length - 1];
              console.log(latest.identifier + '|' + latest.version);
            });
          ")"
          RUNTIME_ID="${RUNTIME%%|*}"
          RUNTIME_VERSION="${RUNTIME##*|}"
          UDID="$(xcrun simctl create 'kscan-release' 'iPhone 15' "$RUNTIME_ID")"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "device=iPhone-15_iOS-${RUNTIME_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Booted $UDID on iOS $RUNTIME_VERSION"

      - name: Build simulator app
        id: build
        run: |
          set -euo pipefail
          cd ios
          WORKSPACE="$(ls -d *.xcworkspace | head -n1)"
          # The app scheme is the one matching the generated project, NOT the
          # first scheme in the list -- a Pods workspace lists dependency
          # schemes (EXConstants, hermes-engine, ...) that build a static
          # library and produce no .app, which reads as a green build with a
          # missing artifact.
          APP_SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          if ! xcodebuild -workspace "$WORKSPACE" -list -json \
              | APP_SCHEME="$APP_SCHEME" node -e "
                  let raw=''; process.stdin.on('data', d => raw += d).on('end', () => {
                    const schemes = JSON.parse(raw).workspace.schemes || [];
                    if (!schemes.includes(process.env.APP_SCHEME)) {
                      console.error('scheme ' + process.env.APP_SCHEME + ' not found. Available: ' + schemes.join(', '));
                      process.exit(1);
                    }
                  });
                "; then
            echo "could not resolve the application scheme" >&2
            exit 1
          fi
          echo "Building scheme $APP_SCHEME from $WORKSPACE"
          # Release, not Debug. React Native's "Bundle React Native code and
          # images" phase self-skips for a Debug simulator build:
          #
          #   [[ Debug = *Debug* ]] && [[ ! iphonesimulator == *simulator ]] ...
          #   SKIP_BUNDLING enabled; skipping.
          #
          # so a Debug simulator app ships with no main.jsbundle and can only
          # render against a Metro dev server. A release certification runner
          # must test a self-contained build of the exact candidate, so Release
          # is used here. Simulator builds need no signing identity.
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$APP_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../xcodebuild.log | xcpretty || {
              echo "xcodebuild failed; tail of raw log:" >&2
              tail -80 ../xcodebuild.log >&2
              exit 1
            }
          cd ..
          APP="$(find ios/build/Build/Products -maxdepth 3 -name '*.app' -type d \
            -not -path '*/XCFrameworkIntermediates/*' | head -n1)"
          if [ -z "$APP" ]; then
            echo "build reported success but produced no .app under ios/build/Build/Products" >&2
            find ios/build/Build/Products -maxdepth 3 -type d >&2 || true
            exit 1
          fi
          echo "Built $APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "build_identifier=ios-sim-${{ steps.candidate.outputs.sha }}-$(find "$APP" -type f -exec shasum {} + | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Verify the app carries a self-contained JS bundle
        id: bundle
        # Guards the exact defect that produced 25/25 identical failures in run
        # 31317967934: a native shell with no JS. An app in that state was never
        # runnable, so this is an OPERATIONAL_FAILURE of the harness, never a
        # BLOCKED verdict against the product.
        run: |
          set -euo pipefail
          APP='${{ steps.build.outputs.app }}'
          BUNDLE="$(find "$APP" -type f \( -name 'main.jsbundle' -o -name '*.jsbundle' \) -print -quit)"
          if [ -z "$BUNDLE" ]; then
            echo "::error::no .jsbundle inside $APP - the app cannot render without a dev server"
            echo 'Top-level app contents:' >&2
            ls -la "$APP" >&2 || true
            grep -n 'SKIP_BUNDLING' xcodebuild.log >&2 || true
            echo 'bundle_present=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          BYTES="$(wc -c < "$BUNDLE" | tr -d ' ')"
          if [ "$BYTES" -lt 10000 ]; then
            echo "::error::$BUNDLE is implausibly small (${BYTES} bytes)"
            echo 'bundle_present=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "JS bundle: $BUNDLE (${BYTES} bytes)"
          echo 'bundle_present=true' >> "$GITHUB_OUTPUT"
          echo "bundle_path=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Install app on simulator
        run: xcrun simctl install "${{ steps.sim.outputs.udid }}" "${{ steps.build.outputs.app }}"

      - name: Probe app launch
        id: launch
        # Proves the app reaches a rendering state before 25 flows are blamed for
        # a harness fault. A failure here is OPERATIONAL_FAILURE, not BLOCKED.
        run: |
          set -euo pipefail
          mkdir -p artifacts
          UDID='${{ steps.sim.outputs.udid }}'
          xcrun simctl launch "$UDID" "$APP_ID" > artifacts/app-launch.txt 2>&1 || {
            echo "::error::simctl launch failed"
            cat artifacts/app-launch.txt >&2
            echo 'launched=false' >> "$GITHUB_OUTPUT"
            exit 1
          }
          cat artifacts/app-launch.txt
          sleep 15
          xcrun simctl io "$UDID" screenshot artifacts/app-launch.png || true
          # Capture only this app's recent log, and only the fields needed to see
          # a JS load failure. No environment or secret values are emitted.
          xcrun simctl spawn "$UDID" log show --last 60s --style compact \
            --predicate "processImagePath CONTAINS[c] 'KScan'" \
            > artifacts/app-launch-log.txt 2>/dev/null || true
          if grep -qiE 'No bundle URL present|Could not connect to development server|RCTFatal' artifacts/app-launch-log.txt 2>/dev/null; then
            echo "::error::app started but could not load its JS bundle"
            grep -iE 'No bundle URL present|Could not connect to development server|RCTFatal' artifacts/app-launch-log.txt | head -5 >&2
            echo 'launched=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          xcrun simctl terminate "$UDID" "$APP_ID" || true
          echo 'launched=true' >> "$GITHUB_OUTPUT"

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL https://get.maestro.mobile.dev | bash -s "$MAESTRO_VERSION"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # No Metro server. The Release build above embeds the candidate's JS
      # bundle, so the app under test is self-contained and is the artifact a
      # release certification should actually exercise.

      - name: Run release flows
        continue-on-error: true
        env:
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
        run: |
          set -o pipefail
          mkdir -p artifacts
          maestro --device "${{ steps.sim.outputs.udid }}" test .maestro/flows/release \
            --include-tags release \
            -e APP_ID="$APP_ID" \
            -e QA_EMAIL="$QA_EMAIL" \
            -e QA_PASSWORD="$QA_PASSWORD" \
            --format junit \
            --output artifacts/report.xml \
            --debug-output artifacts/maestro-debug \
            2>&1 | tee artifacts/maestro.log

      - name: Build native evidence
        id: evidence
        if: always() && steps.candidate.outputs.sha != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # A build, bundle, launch or simulator fault must still emit evidence,
          # and must name the specific reason, so certification sees an explicit
          # OPERATIONAL_FAILURE rather than a missing artifact or a BLOCKED
          # verdict against an app that was never runnable.
          INFRA=''
          REASON=''
          if [ '${{ steps.bundle.outputs.bundle_present }}' = 'false' ]; then
            INFRA='--infrastructure-failure'; REASON='NATIVE_JS_BUNDLE_MISSING'
          elif [ '${{ steps.launch.outputs.launched }}' = 'false' ]; then
            INFRA='--infrastructure-failure'; REASON='NATIVE_APP_LAUNCH_FAILED'
          elif [ '${{ steps.build.outcome }}' != 'success' ]; then
            INFRA='--infrastructure-failure'; REASON='NATIVE_BUILD_FAILED'
          elif [ ! -f artifacts/report.xml ]; then
            INFRA='--infrastructure-failure'; REASON='NATIVE_REPORT_MISSING'
          fi
          REASON_ARG=''
          if [ -n "$REASON" ]; then REASON_ARG="--reason $REASON"; fi
          node security/scripts/build-native-mobile-evidence.js \
            --platform ios \
            --candidate-sha "${{ steps.candidate.outputs.sha }}" \
            --run-id "${{ github.run_id }}" \
            --build-identifier "${{ steps.build.outputs.build_identifier || 'unavailable-build-failed' }}" \
            --device "${{ steps.sim.outputs.device || 'unavailable' }}_Xcode-${{ steps.toolchain.outputs.xcode || 'unknown' }}" \
            --runner "Maestro ${MAESTRO_VERSION}" \
            --report artifacts/report.xml \
            --artifact-links "$RUN_URL" \
            --output artifacts/native-ios-evidence.json \
            $INFRA $REASON_ARG
          RESULT="$(node -p "require('./artifacts/native-ios-evidence.json').result")"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          cat artifacts/native-ios-evidence.json

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-evidence
          path: artifacts/native-ios-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-run-artifacts
          path: |
            artifacts/report.xml
            artifacts/maestro.log
            artifacts/maestro-debug/**
            artifacts/app-launch.txt
            artifacts/app-launch.png
            artifacts/app-launch-log.txt
            xcodebuild.log
          if-no-files-found: warn
          retention-days: 30

      - name: Shut down simulator
        if: always()
        run: |
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true

      - name: Enforce result
        run: |
          set -euo pipefail
          RESULT='${{ steps.evidence.outputs.result }}'
          echo "Native iOS result: $RESULT"
          [ "$RESULT" = 'PASS' ]
