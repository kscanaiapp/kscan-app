name: Master Required Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  project:
    name: Project checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '20', cache: npm}
      - run: npm ci
      - run: |
          npm run test:privacy
          npm run test:auth-privacy
          npm run test:verify-supabase
          npm run test:analyze-contract
      - run: node --test __tests__/security/masterPromotionBootstrap.test.js

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - env: {GITLEAKS_VERSION: '8.30.1'}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          if [ "${{ github.event_name }}" = pull_request ]; then
            gitleaks git --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --redact=100 --report-format json --report-path gitleaks-results.json
          else
            gitleaks git --log-opts="${{ github.event.before }}..${{ github.sha }}" --redact=100 --report-format json --report-path gitleaks-results.json
          fi

  semgrep:
    name: Semgrep Community Edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail
          docker run --rm -v "${PWD}:/src" -w /src semgrep/semgrep:1.171.0 semgrep scan --config auto --json --output semgrep-results.json --exclude node_modules --exclude .git .
          python3 -c "import json; json.load(open('semgrep-results.json', encoding='utf-8'))"

  osv:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          OSV_VERSION: '2.4.0'
          OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          printf '%s  %s\n' "$OSV_SHA256" /tmp/osv-scanner | sha256sum --check --strict -
          chmod +x /tmp/osv-scanner
          set +e
          /tmp/osv-scanner scan source --lockfile=./package-lock.json --format json --output-file osv-results.json
          CODE=$?
          set -e
          python3 -c "import json; json.load(open('osv-results.json', encoding='utf-8'))"
          test "$CODE" = 0 -o "$CODE" = 1

  trivy:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          exit-code: '0'
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,.git,coverage,dist,build,.expo,ios/Pods,android/.gradle,android/app/build
      - run: python3 -c "import json; json.load(open('trivy-results.json', encoding='utf-8'))"

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '20', cache: npm}
      - run: npm ci
      - run: |
          set +e
          npm audit --json > npm-audit.json
          CODE=$?
          set -e
          node -e "const r=require('./npm-audit.json'); if(r.error) process.exit(2)"
          test "$CODE" = 0 -o "$CODE" = 1

  migration:
    name: Migration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- supabase/migrations > changed-migrations.txt
          while IFS= read -r file; do
            [ -z "$file" ] || node security/scripts/validate-master-migration.js "$file"
          done < changed-migrations.txt

  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '20', cache: npm}
      - run: npm ci
      - run: |
          npm run test:auth-privacy
          npm run test:verify-supabase
          npm run test:analyze-contract
