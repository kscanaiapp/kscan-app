# Bounded STAGING proof for B35-F-025 (receipt kill switch + settlement grants).
# Follows the existing live-probe pattern. It does not deploy and does not change
# flags, secrets or rows; it signs in the existing synthetic ACTIVE account and
# sends one empty-body request that must stop at the kill switch.

name: K Scan Staging F025 Receipt Kill Switch Probe

on:
  workflow_dispatch:
  # Scoped to this exact probe branch so the file self-registers.
  push:
    branches:
      - test/f025-receipt-kill-switch-probe-v1

permissions:
  contents: read

concurrency:
  group: kscan-f025-receipt-kill-switch-probe
  cancel-in-progress: false

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run the bounded kill-switch proof
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SYNTHETIC_ACTIVE_EMAIL: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_EMAIL }}
          STAGING_SYNTHETIC_ACTIVE_PASSWORD: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_PASSWORD }}
        run: node security/release/run-f025-receipt-kill-switch-probe.js

      - name: Print sanitized evidence
        if: always()
        run: test -s f025-receipt-kill-switch-probe-report.json && cat f025-receipt-kill-switch-probe-report.json
