# OWASP ZAP API safe scan against staging OpenAPI definition.
# Safe mode (-S) performs passive baseline scanning without active API attacks.
# Active scanning runs only when ZAP_ACTIVE_ENABLED=true.
#
# zap-api-scan.py flags:
#   -t <file|url>   OpenAPI/SOAP target definition
#   -f openapi      definition format
#   -O <hostname>   hostname override for the OpenAPI servers (NOT a file path)
#   -S              safe mode (no active attack phase)
#
# 2026-08-06 SHA-binding repair (first pass): this workflow previously
# triggered on `push: branches: ["**"]` and any `pull_request` regardless of
# base branch — a `protected_pr` output was computed from
# PROTECTED_BASE_BRANCHES but never actually used to gate execution, so
# every push to every branch ran a live ZAP scan against the shared staging
# target. Triggers were restricted to staging/production-parity to fix that.
#
# 2026-08-06 branch-caused-failure repair (second pass): the trigger-level
# branch filter above broke evaluate-promotion-gate.js's required-check
# evaluation for any PR NOT targeting staging/production-parity (e.g. one
# targeting master) — it looks up this check-run by name for the candidate
# SHA regardless of what branch the PR targets, and a trigger-level filter
# means the check-run does not exist at all in that case (OPERATIONAL
# FAILURE ["missing check"], not the "skipped" it already knows how to
# accept — permanently blocking such PRs). Reverted to an unconditional
# trigger with a job-level branch-authority skip instead, matching
# security-staging-gate.yml's own always-fires/jobs-skip pattern. Dynamic
# scanning still only actually runs for staging/production-parity —
# enforced in "Resolve scan context" below, not by the trigger. Candidate
# vs. actually-deployed staging SHA is resolved and recorded so a scan
# can't be misread as exact-SHA evidence for a candidate that isn't live.

name: Security - ZAP API Staging

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Candidate SHA to record in evidence (defaults to the triggering SHA)
        required: false
        default: ''

permissions:
  contents: read
  deployments: read

# Keep API scans off the staging deploy queue so scan jobs do not block each other.
concurrency:
  group: kscan-zap-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-api:
    name: ZAP API staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ZAP_VERSION: "2.17.0"
      ZAP_IMAGE_DIGEST: "sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2"
      ZAP_IMAGE: "ghcr.io/zaproxy/zaproxy:stable@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Check branch authority and target configuration
        id: gate
        env:
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          ZAP_ALLOWED_HOST: ${{ vars.ZAP_ALLOWED_HOST }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          set -euo pipefail
          # Dynamic scanning only ever actually runs for the canonical staging
          # branch — workflow_dispatch is always an explicit, authorized manual
          # invocation regardless of ref. See the file header for why this is a
          # job-level skip rather than a trigger-level branch filter.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "${TARGET_BRANCH}" != "staging/production-parity" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## OWASP ZAP API Safe Scan"
              echo
              echo "ZAP API was not executed because the target branch"
              echo "(${TARGET_BRANCH}) is not the canonical staging branch"
              echo "(staging/production-parity)."
              echo
              echo "| Field | Value |"
              echo "| --- | --- |"
              echo "| Repository | ${GITHUB_REPOSITORY} |"
              echo "| Target branch | ${TARGET_BRANCH} |"
              echo "| Commit SHA | ${GITHUB_SHA} |"
              echo "| Event type | ${GITHUB_EVENT_NAME} |"
              echo "| Scanner name | OWASP ZAP API Safe Scan |"
              echo "| Report-only verdict | SKIPPED_UNAUTHORIZED_BRANCH |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${SUPABASE_STAGING_URL}" ] && [ -z "${ZAP_ALLOWED_HOST}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## OWASP ZAP API Safe Scan"
              echo
              echo "ZAP API was not executed because neither SUPABASE_STAGING_URL"
              echo "nor ZAP_ALLOWED_HOST is configured."
              echo "| Report-only verdict | SKIPPED_MISSING_VARS |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Create mandatory diagnostics directory
        if: steps.gate.outputs.configured == 'true'
        run: install -d -m 0777 zap-api-out/diagnostics

      - name: Resolve candidate and deployed staging SHA
        id: shas
        if: steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          CANDIDATE_SHA="${INPUT_CANDIDATE_SHA:-${{ github.event.pull_request.head.sha || github.sha }}}"
          echo "candidate_sha=${CANDIDATE_SHA}" >> "$GITHUB_OUTPUT"

          DEPLOYED_JSON="$(node security/scripts/resolve-deployed-staging-sha.js --repo "${{ github.repository }}" --token "${GH_TOKEN}" --environment staging)"
          echo "${DEPLOYED_JSON}"
          DEPLOYED_SHA="$(printf '%s' "${DEPLOYED_JSON}" | python3 -c 'import json,sys; v=json.load(sys.stdin).get("deployedSha"); print(v or "")')"
          echo "deployed_sha=${DEPLOYED_SHA}" >> "$GITHUB_OUTPUT"

          if [ -n "${DEPLOYED_SHA}" ] && [ "${DEPLOYED_SHA}" = "${CANDIDATE_SHA}" ]; then
            SHA_MATCH="true"
          else
            SHA_MATCH="false"
          fi
          echo "sha_match=${SHA_MATCH}" >> "$GITHUB_OUTPUT"

          python3 - <<PY
          import json
          run_context = {
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "repository": "${{ github.repository }}",
              "event_name": "${{ github.event_name }}",
              "ref": "${{ github.ref }}",
              "candidate_sha": "${CANDIDATE_SHA}",
              "deployed_staging_sha": "${DEPLOYED_SHA}" or None,
              "sha_match": "${SHA_MATCH}" == "true",
              "staging_project_ref": "yzqjvdfgefveprobvvyw",
              "zap_version": "${{ env.ZAP_VERSION }}",
              "zap_image_digest": "${{ env.ZAP_IMAGE_DIGEST }}",
          }
          with open("zap-api-out/diagnostics/run-context.json", "w", encoding="utf-8") as f:
              json.dump(run_context, f, indent=2)
              f.write("\n")
          PY

          if [ "${SHA_MATCH}" != "true" ]; then
            echo "::warning title=SHA not exact-match::candidate_sha=${CANDIDATE_SHA} deployed_staging_sha=${DEPLOYED_SHA:-<none>} — this run cannot serve as exact-SHA staging evidence for the candidate."
          fi

      - name: Resolve scan context
        id: context
        if: steps.gate.outputs.configured == 'true'
        env:
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          ZAP_ALLOWED_HOST: ${{ vars.ZAP_ALLOWED_HOST }}
        run: |
          set -euo pipefail
          STAGING_BASE="${SUPABASE_STAGING_URL:-https://yzqjvdfgefveprobvvyw.supabase.co}"
          STAGING_BASE="${STAGING_BASE%/}"
          ALLOWED_HOST="${ZAP_ALLOWED_HOST:-yzqjvdfgefveprobvvyw.supabase.co}"
          echo "staging_base=${STAGING_BASE}" >> "$GITHUB_OUTPUT"
          echo "allowed_host=${ALLOWED_HOST}" >> "$GITHUB_OUTPUT"

          if [ ! -f security/openapi/staging-api.yaml ]; then
            echo "::error title=Missing OpenAPI definition::security/openapi/staging-api.yaml is required"
            exit 3
          fi

          if grep -Eiq 'https?://wyyuqfdxucjksghsmhry\.supabase\.co' security/openapi/staging-api.yaml; then
            echo "::error title=Production URL in OpenAPI::OpenAPI servers must not target the production project host"
            exit 3
          fi
          if ! grep -Eiq 'https://yzqjvdfgefveprobvvyw\.supabase\.co' security/openapi/staging-api.yaml; then
            echo "::error title=Missing staging server::OpenAPI must reference the staging project host"
            exit 3
          fi

      - name: Validate staging target host
        if: steps.gate.outputs.configured == 'true'
        run: |
          set -euo pipefail
          node security/scripts/validate-zap-target.js "${{ steps.context.outputs.staging_base }}" "${{ steps.context.outputs.allowed_host }}" | tee zap-api-out/diagnostics/target-validation.txt

      - name: Pre-pull ZAP image
        if: steps.gate.outputs.configured == 'true'
        run: |
          set -euo pipefail
          docker version > zap-api-out/diagnostics/docker-version.txt 2>&1 || true
          {
            echo "image=${ZAP_IMAGE}"
            echo "version=${ZAP_VERSION}"
            echo "digest=${ZAP_IMAGE_DIGEST}"
          } > zap-api-out/diagnostics/zap-image.txt
          docker pull "${ZAP_IMAGE}" >> zap-api-out/diagnostics/zap-image.txt 2>&1
          echo "pull_result=$?" >> zap-api-out/diagnostics/zap-image.txt

      - name: Run ZAP API safe scan
        id: zap_api
        if: steps.gate.outputs.configured == 'true'
        env:
          PR_HEAD_SHA: ${{ steps.shas.outputs.candidate_sha }}
          ZAP_ACTIVE_ENABLED: ${{ vars.ZAP_ACTIVE_ENABLED }}
          STAGING_BASE: ${{ steps.context.outputs.staging_base }}
          ALLOWED_HOST: ${{ steps.context.outputs.allowed_host }}
        run: |
          set -euo pipefail
          echo "PR candidate SHA: ${PR_HEAD_SHA}" >> "$GITHUB_STEP_SUMMARY"
          install -d -m 0777 zap-api-out
          # Mount the repository root as /zap/wrk so OpenAPI + output paths resolve under ZAP's workdir.
          # -t expects the OpenAPI file; -O expects a hostname override (not a file path).
          set +e
          docker run --rm \
            --user root \
            --mount "type=bind,source=${PWD},target=/zap/wrk" \
            --workdir /zap/wrk \
            "${ZAP_IMAGE}" \
            zap-api-scan.py \
            -S \
            -t security/openapi/staging-api.yaml \
            -f openapi \
            -O "${ALLOWED_HOST}" \
            -c .zap/api-rules.tsv \
            -J zap-api-out/zap-api-report.json \
            -w zap-api-out/zap-api-report.md \
            -r zap-api-out/zap-api-report.html \
            > >(tee zap-api-out/zap-api-console.log zap-api-out/diagnostics/zap-stdout.log) \
            2> zap-api-out/diagnostics/zap-stderr.log
          CODE=${PIPESTATUS[0]}
          set -e
          echo "${CODE}" > zap-api-out/diagnostics/zap-exit-code.txt

          if [ ! -f zap-api-out/zap-api-report.json ]; then
            echo "Operational failure: zap-api-report.json missing after safe scan (exit ${CODE})"
            ls -la zap-api-out || true
            if [ -f zap-api-out/zap-api-console.log ]; then
              tail -n 80 zap-api-out/zap-api-console.log || true
            fi
            exit 3
          fi
          python3 -c "import json; json.load(open('zap-api-out/zap-api-report.json', encoding='utf-8'))"
          echo "safe_scan_exit=${CODE}" >> "$GITHUB_OUTPUT"

          if [ "${ZAP_ACTIVE_ENABLED}" = "true" ]; then
            echo "Running ZAP API active scan (ZAP_ACTIVE_ENABLED=true)"
            set +e
            docker run --rm \
              --user root \
              --mount "type=bind,source=${PWD},target=/zap/wrk" \
              --workdir /zap/wrk \
              "${ZAP_IMAGE}" \
              zap-api-scan.py \
              -t security/openapi/staging-api.yaml \
              -f openapi \
              -O "${ALLOWED_HOST}" \
              -c .zap/api-rules.tsv \
              -J zap-api-out/zap-api-active-report.json \
              -w zap-api-out/zap-api-active-report.md \
              -r zap-api-out/zap-api-active-report.html \
              | tee zap-api-out/zap-api-active-console.log
            ACTIVE_CODE=${PIPESTATUS[0]}
            set -e
            echo "active_scan_exit=${ACTIVE_CODE}" >> "$GITHUB_OUTPUT"
            CODE="${ACTIVE_CODE}"
          fi

          case "$CODE" in
            0|1|2) exit 0 ;;
            3)
              echo "Operational failure: ZAP API returned exit code 3"
              exit 3
              ;;
            *)
              echo "Operational failure: unexpected ZAP API exit code ${CODE}"
              exit 1
              ;;
          esac

      - name: Validate mandatory reports
        if: always() && steps.gate.outputs.configured == 'true'
        run: |
          set -euo pipefail
          REQUIRED="zap-api-out/zap-api-report.html zap-api-out/zap-api-report.json zap-api-out/zap-api-report.md zap-api-out/zap-api-console.log"
          {
            echo "ZAP API report validation — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } > zap-api-out/diagnostics/report-validation.txt
          FAILED=0
          for f in $REQUIRED; do
            if [ -f "$f" ]; then
              echo "present: $f" >> zap-api-out/diagnostics/report-validation.txt
            else
              echo "MISSING: $f" >> zap-api-out/diagnostics/report-validation.txt
              FAILED=1
            fi
          done
          if [ -f zap-api-out/zap-api-report.json ]; then
            if python3 -c "import json; json.load(open('zap-api-out/zap-api-report.json', encoding='utf-8'))" 2>>zap-api-out/diagnostics/report-validation.txt; then
              echo "parseable: zap-api-out/zap-api-report.json" >> zap-api-out/diagnostics/report-validation.txt
            else
              echo "UNPARSEABLE: zap-api-out/zap-api-report.json" >> zap-api-out/diagnostics/report-validation.txt
              FAILED=1
            fi
          fi
          cat zap-api-out/diagnostics/report-validation.txt
          if [ "$FAILED" -ne 0 ]; then
            echo "Operational failure: one or more mandatory ZAP API reports are missing or unparseable"
            exit 2
          fi

      - name: Summarize ZAP API results
        if: always() && steps.gate.outputs.configured == 'true' && hashFiles('zap-api-out/zap-api-report.json') != ''
        env:
          SCANNER_NAME: OWASP ZAP API Safe Scan
          SCANNER_VERSION: ${{ env.ZAP_VERSION }}
          SUMMARY_FILE: zap-api-out/zap-api-summary.md
          EXTRA_NOTES: |
            Safe mode (-S) passive API scan.
            Active scan report: zap-api-active-report.* when ZAP_ACTIVE_ENABLED=true.
            Candidate SHA=${{ steps.shas.outputs.candidate_sha }}
            Deployed staging SHA=${{ steps.shas.outputs.deployed_sha }}
            Exact-SHA match=${{ steps.shas.outputs.sha_match }}
            Staging host=${{ steps.context.outputs.allowed_host }}
        run: |
          set -euo pipefail
          COUNTS="$(python3 - <<'PY'
          import json,collections
          data=json.load(open("zap-api-out/zap-api-report.json", encoding="utf-8"))
          c=collections.Counter()
          for site in data.get("site") or []:
              for alert in site.get("alerts") or []:
                  c[str(alert.get("riskdesc") or alert.get("riskcode") or "UNKNOWN")] += 1
          print(json.dumps(dict(c)))
          PY
          )"
          TOTAL="$(python3 - <<'PY'
          import json
          data=json.load(open("zap-api-out/zap-api-report.json", encoding="utf-8"))
          total=0
          for site in data.get("site") or []:
              total += len(site.get("alerts") or [])
          print(total)
          PY
          )"
          if [ "$TOTAL" -gt 0 ]; then VERDICT="FINDINGS_REPORTED"; else VERDICT="NO_FINDINGS"; fi
          export FINDING_COUNTS="${COUNTS}"
          export REPORT_ONLY_VERDICT="${VERDICT}"
          node security/scripts/write-security-summary.js
          {
            echo
            echo "| Candidate SHA | ${{ steps.shas.outputs.candidate_sha }} |"
            echo "| Deployed staging SHA | ${{ steps.shas.outputs.deployed_sha }} |"
            echo "| Exact-SHA match | ${{ steps.shas.outputs.sha_match }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZAP API report artifact
        if: always() && hashFiles('zap-api-out/zap-api-report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-api-report-${{ github.run_number }}
          path: |
            zap-api-out/zap-api-report.html
            zap-api-out/zap-api-report.json
            zap-api-out/zap-api-report.md
            zap-api-out/zap-api-summary.md
            zap-api-out/zap-api-console.log
            zap-api-out/zap-api-active-report.html
            zap-api-out/zap-api-active-report.json
            zap-api-out/zap-api-active-report.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload ZAP API diagnostics artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-api-diagnostics-${{ github.run_number }}
          path: zap-api-out/diagnostics/
          if-no-files-found: warn
          retention-days: 30
