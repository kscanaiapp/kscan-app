name: Live VTO iOS Native Catch-Up

# Narrowly scoped to this catch-up lane (mission section 9, Tier 3): "ONE
# dedicated workflow supporting this iOS catch-up pass." No deployment or
# submission step exists here or is authorized -- EAS build/submit are
# explicitly out of scope for this lane (see docs/vto-live-bridge-contract.md).
#
# Two jobs, cheapest-first (mission section 38 -- do not do expensive Apple
# compilation on every commit; this workflow itself IS the logical milestone
# checkpoint for this lane's single combined pass):
#   swift-test    -- SwiftPM host tests for the pure-logic Core package. No
#                    CocoaPods, no MediaPipe download, no Xcode project --
#                    proves the geometry/deformation/replay/backpressure/
#                    adapter math independent of the rest of the toolchain.
#   ios-app-build -- compiles the FULL module (Core + Module + View +
#                    Drivers + Perception, including the real
#                    MediaPipeTasksVision dependency) as part of the REAL
#                    app via `expo prebuild` + `pod install` + `xcodebuild`.
#                    `pod lib lint` was tried first and is NOT viable for an
#                    Expo autolinked module: ExpoModulesCore has no published
#                    CocoaPods-trunk spec at all (it is resolved from the
#                    LOCAL expo-modules-core npm package via Expo's own
#                    autolinking, which only exists inside a real app
#                    Podfile) -- `pod lib lint` fails at dependency
#                    resolution before it ever reaches this module's own
#                    code, on every Expo local module in this repo, not
#                    just this one. Building through the real app's own
#                    generated Podfile is the correct equivalent.
on:
  push:
    branches:
      - 'feature/live-vto-ios-native-catchup'
    paths:
      - 'modules/kscan-live-vto-native/**'
      - '.github/workflows/live-vto-ios-native-catchup.yml'
  pull_request:
    paths:
      - 'modules/kscan-live-vto-native/**'
      - '.github/workflows/live-vto-ios-native-catchup.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live-contracts:
    name: Live source, commerce and release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test __tests__/vto*.test.js __tests__/build35ReleaseProfile.test.js __tests__/nativeConfigParityGate.test.js
      - run: node scripts/check-build35-release-profile.js

  android-native:
    name: Android native compilation and pixel tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - name: Compile and test native runtime (no app release artifact)
        working-directory: android
        run: bash gradlew :kscan-live-vto-native:testDebugUnitTest :kscan-live-vto-native:compileDebugKotlin --max-workers=2 --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-vto-android-native-evidence
          path: |
            modules/kscan-live-vto-native/android/build/test-results/
            modules/kscan-live-vto-native/build/render-evidence/

  swift-test:
    name: SwiftPM host tests (LiveVtoCore)
    runs-on: macos-14
    defaults:
      run:
        working-directory: modules/kscan-live-vto-native
    steps:
      - uses: actions/checkout@v4

      - name: Swift toolchain version
        run: swift --version

      - name: swift test
        run: swift test --enable-code-coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-vto-ios-render-evidence
          path: modules/kscan-live-vto-native/build/render-evidence-ios/

      - name: Summarize LiveVtoCore coverage
        if: always()
        run: |
          BUILD_DIR=$(swift build --show-bin-path)
          xcrun llvm-cov report \
            "$BUILD_DIR/LiveVtoCorePackageTests.xctest/Contents/MacOS/LiveVtoCorePackageTests" \
            -instr-profile "$BUILD_DIR/codecov/default.profdata" \
            --ignore-filename-regex="Tests/" || echo "coverage summary unavailable (non-fatal)"

  ios-app-build:
    name: iOS app build (expo prebuild + pod install + xcodebuild)
    # macos-14's default Xcode is 15.4; this repo's React Native version
    # requires Xcode >= 16.1 (confirmed by a real `pod install` failure:
    # "React Native requires XCode >= 16.1. Found 15.4."). macos-15 defaults
    # to a current Xcode that satisfies this. swift-test stays on macos-14
    # since SwiftPM alone never hit this requirement.
    runs-on: macos-15
    timeout-minutes: 75
    needs: swift-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm ci
        run: npm ci

      - name: CocoaPods / Xcode versions
        run: |
          pod --version
          xcodebuild -version

      # --no-install: this repo's Podfile needs the real ExpoModulesCore
      # autolinking resolution, which the next step's `pod install` performs
      # with full network access to CocoaPods trunk (for MediaPipeTasksVision)
      # AND the local npm packages (for ExpoModulesCore, kscan-live-vto-native,
      # kscan-voice-native, kscan-pii-native) in one pass.
      - name: expo prebuild --platform ios
        run: npx expo prebuild --platform ios --no-install

      - name: pod install
        working-directory: ios
        run: pod install --repo-update

      - name: Confirm the new module and its dependency are actually linked
        working-directory: ios
        run: |
          grep -q "KScanLiveVtoNative" Podfile.lock || (echo "::error::KScanLiveVtoNative did not autolink into Podfile.lock" && exit 1)
          grep -q "MediaPipeTasksVision" Podfile.lock || (echo "::error::MediaPipeTasksVision was not resolved into Podfile.lock" && exit 1)
          echo "Confirmed both dependencies resolved:"
          grep -E "KScanLiveVtoNative|MediaPipeTasksVision" Podfile.lock

      - name: Discover workspace and scheme
        id: discover
        working-directory: ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          # The APP scheme is named after the workspace. `schemes[0]` was
          # previously used and resolved to a pod scheme (EXApplication), so
          # this job never compiled the app or KScanLiveVtoNative at all.
          SCHEME="${WORKSPACE%.xcworkspace}"
          xcodebuild -workspace "$WORKSPACE" -list -json | python3 -c 'import json,sys; s=sys.argv[1]; sys.exit(0 if s in json.load(sys.stdin)["workspace"]["schemes"] else f"app scheme {s} not found")' "$SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"

      # Device SDK, Release archive, unsigned: the same configuration EAS
      # archives for the store, so CocoaPods resource-bundle collisions
      # ("Multiple commands produce", EAS build 45dafd1d) and Release-only
      # compile failures surface here, not on a paid EAS build.
      - name: xcodebuild archive (device, Release, no codesign)
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace "${{ steps.discover.outputs.workspace }}" \
            -scheme "${{ steps.discover.outputs.scheme }}" \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/KScanAI.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Confirm Live VTO resource bundle keeps its subdirectories
        run: |
          BUNDLE=$(find "$RUNNER_TEMP/KScanAI.xcarchive/Products/Applications" -type d -name KScanLiveVtoNativeAssets.bundle | head -1)
          test -n "$BUNDLE" || (echo "::error::KScanLiveVtoNativeAssets.bundle missing from the archived app" && exit 1)
          find "$BUNDLE" -type f | sed "s|$BUNDLE/||" | sort
          for f in models/pose_landmarker_lite.task perception/synthetic-test-frame.png \
                   n1b-fixture/manifest.json n1b-fixture/texture.png n1b-fixture/alpha.png \
                   n1c-asym-fixture/manifest.json n1c-asym-fixture/texture.png n1c-asym-fixture/alpha.png \
                   ascolour-5001-black-v1/manifest.json ascolour-5001-black-v1/texture.png ascolour-5001-black-v1/alpha.png; do
            cmp "$BUNDLE/$f" "modules/kscan-live-vto-native/ios/Assets/$f" || (echo "::error::$f missing or altered in archived bundle" && exit 1)
          done
