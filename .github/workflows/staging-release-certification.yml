name: Staging Release Certification

on:
  push:
    branches: [staging/production-parity]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current staging commit to certify
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: staging-release-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Resolve exact staging candidate
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tree: ${{ steps.identity.outputs.tree }}
      staging_head: ${{ steps.identity.outputs.staging_head }}
      release_class: ${{ steps.classify.outputs.release_class }}
      zap_configured: ${{ steps.config.outputs.zap_configured }}
      full_certification_required: ${{ steps.scope.outputs.full_certification_required }}
      skip_reason: ${{ steps.scope.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: identity
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch origin staging/production-parity --quiet
          git cat-file -e "${REQUESTED_SHA}^{commit}"
          echo "sha=${REQUESTED_SHA}" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse "${REQUESTED_SHA}^{tree}")" >> "$GITHUB_OUTPUT"
          echo "staging_head=$(git rev-parse origin/staging/production-parity)" >> "$GITHUB_OUTPUT"
      - id: classify
        env:
          CANDIDATE_SHA: ${{ steps.identity.outputs.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE_SHA="${EVENT_BEFORE:-}"
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then BASE_SHA="${CANDIDATE_SHA}^"; fi
          node security/scripts/classify-changed-surfaces.js "$BASE_SHA" "$CANDIDATE_SHA" > classification.json
          echo "release_class=$(node -p "require('./classification.json').releaseClass")" >> "$GITHUB_OUTPUT"
          echo "backend_deployment_required=$(node -p "require('./classification.json').backendDeploymentRequired")" >> "$GITHUB_OUTPUT"
          cat classification.json >> "$GITHUB_STEP_SUMMARY"
      # This workflow previously ran its full job graph -- including a live
      # HIBP Management-API probe against api.supabase.com and both ZAP scans
      # -- on every push to staging/production-parity regardless of content.
      # A release-freeze / manual-candidate dispatch (workflow_dispatch with
      # an explicit candidate_sha) always certifies in full: that path exists
      # specifically to re-run a real certification of a named candidate on
      # demand, so it must never be short-circuited by the change classifier.
      # An automatic push that touches nothing backend/edge/migration-relevant
      # (per classify-changed-surfaces.js's backendDeploymentRequired --
      # staging-validation's own deploy-staging/staging-health/synthetic-tests
      # jobs already skip themselves on that same field) skips the other
      # heavyweight, staging-impacting checks this workflow runs directly:
      # the live HIBP probe and both ZAP scans. final-verdict still produces a
      # real, honest verdict either way -- never a bare PASS for a run that
      # didn't actually certify anything.
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA_INPUT: ${{ inputs.candidate_sha }}
          BACKEND_DEPLOYMENT_REQUIRED: ${{ steps.classify.outputs.backend_deployment_required }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${CANDIDATE_SHA_INPUT:-}" ]; then
            FULL=true
            REASON="workflow_dispatch with an explicit candidate_sha (release-freeze / manual-candidate path) always certifies in full"
          elif [ "$BACKEND_DEPLOYMENT_REQUIRED" = "true" ]; then
            FULL=true
            REASON="candidate touches supabase/functions or supabase/migrations (backendDeploymentRequired=true)"
          else
            FULL=false
            REASON="candidate has no backend/edge/migration impact (backendDeploymentRequired=false) -- skipping the live HIBP probe, ZAP baseline, and ZAP API scans"
          fi
          echo "full_certification_required=${FULL}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "Full certification required: ${FULL} (${REASON})" >> "$GITHUB_STEP_SUMMARY"
      - id: config
        env:
          ZAP_STAGING_URL: ${{ vars.ZAP_STAGING_URL }}
          ZAP_ALLOWED_HOST: ${{ vars.ZAP_ALLOWED_HOST }}
        run: |
          set -euo pipefail
          [ -n "$ZAP_STAGING_URL" ] && [ -n "$ZAP_ALLOWED_HOST" ] && echo 'zap_configured=true' >> "$GITHUB_OUTPUT" || echo 'zap_configured=false' >> "$GITHUB_OUTPUT"

  staging-validation:
    name: Controlled staging validation
    needs: candidate
    uses: ./.github/workflows/security-staging-gate.yml
    secrets: inherit

  static-and-authorization:
    name: Static parity and authorization
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - run: |
          set -euo pipefail
          npm ci
          npm run test:security
          npm run test:staging-parity
          npm run test:rpc-policy
          npm run test:provenance-quarantine
          npm run test:staging-certification
          node --test __tests__/security/nativeUiAutomationPolicy.test.js
          node --test __tests__/security/releaseTreeEquivalence.test.js __tests__/security/provenanceMap.test.js

  artifact-exposure:
    name: Candidate artifact exposure
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - id: scan
        run: |
          set +e
          node security/scripts/scan-candidate-artifacts.js app.json app.config.js eas.json supabase .github --candidate-sha "${{ needs.candidate.outputs.sha }}" --output security/reports/artifact-exposure.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-artifact-exposure-${{ github.run_id }}
          path: security/reports/artifact-exposure.json
          if-no-files-found: error
          retention-days: 90
      - run: test "${{ steps.scan.outputs.exit_code }}" = 0

  leaked-password-protection:
    name: Verify staging leaked-password protection
    needs: candidate
    # This job makes a live Management-API call to api.supabase.com on every
    # run. Skip it on an automatic push with no backend/edge/migration impact
    # -- see the `scope` step in the candidate job above.
    if: needs.candidate.outputs.full_certification_required == 'true'
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.verify.outputs.result }}
    steps:
      # Checked out solely to run the classifier, which owns the decision table
      # (security/scripts/classify-leaked-password-protection.js). This step
      # gathers observations; it never decides.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - id: verify
        env:
          RELEASE_CLASS: ${{ needs.candidate.outputs.release_class }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_REF: yzqjvdfgefveprobvvyw
          PRODUCTION_REF: wyyuqfdxucjksghsmhry
        run: |
          set -uo pipefail
          test "$STAGING_REF" != "$PRODUCTION_REF"
          API="https://api.supabase.com/v1/projects/${STAGING_REF}/config/auth"

          READ_STATUS=null; READ_ERROR=null; HIBP=null
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            TOKEN_PRESENT=false
          else
            TOKEN_PRESENT=true
            if READ_CODE="$(curl --silent --show-error --max-time 30 --output auth-config.json --write-out '%{http_code}' --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "$API")"; then
              READ_STATUS="$READ_CODE"
              if [ "$READ_CODE" = 200 ]; then
                HIBP="$(node -e "try{const c=require('./auth-config.json');process.stdout.write(typeof c.password_hibp_enabled==='boolean'?String(c.password_hibp_enabled):'null')}catch{process.stdout.write('null')}")"
              fi
            else
              READ_ERROR='"NETWORK"'
            fi
            rm -f auth-config.json
          fi

          # Entitlement probe. Runs ONLY when the control reads as disabled -
          # that is the one case where "why" matters. A 402 is the single
          # observation that proves the plan does not sell the feature; on a
          # plan that does, this same request enables it and the gate returns to
          # PASS on its own. Every other outcome stays UNKNOWN and blocks.
          PROBE_JSON=null
          if [ "$TOKEN_PRESENT" = true ] && [ "${READ_STATUS}" = 200 ] && [ "$HIBP" = false ]; then
            PROBE_STATUS=null; PROBE_ERROR=null; CONFIRMED=null
            if PROBE_CODE="$(curl --silent --show-error --max-time 30 --output probe.json --write-out '%{http_code}' --request PATCH --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" --header 'Content-Type: application/json' --data '{"password_hibp_enabled":true}' "$API")"; then
              PROBE_STATUS="$PROBE_CODE"
              if [ "$PROBE_CODE" = 200 ]; then
                if curl --silent --show-error --max-time 30 --output confirm.json --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" "$API"; then
                  CONFIRMED="$(node -e "try{const c=require('./confirm.json');process.stdout.write(String(c.password_hibp_enabled===true))}catch{process.stdout.write('null')}")"
                fi
              fi
            else
              PROBE_ERROR='"NETWORK"'
            fi
            rm -f probe.json confirm.json
            PROBE_JSON="{\"status\":${PROBE_STATUS},\"transportError\":${PROBE_ERROR},\"confirmedEnabled\":${CONFIRMED}}"
          fi

          EVIDENCE="{\"releaseClass\":\"${RELEASE_CLASS}\",\"accessTokenPresent\":${TOKEN_PRESENT},\"read\":{\"status\":${READ_STATUS},\"hibpEnabled\":${HIBP},\"transportError\":${READ_ERROR}},\"entitlementProbe\":${PROBE_JSON}}"
          CLASSIFICATION="$(node security/scripts/classify-leaked-password-protection.js "$EVIDENCE")"
          echo "$CLASSIFICATION"
          RESULT="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).verdict)" "$CLASSIFICATION")"
          REASON="$(node -e "process.stdout.write(JSON.parse(process.argv[1]).reason)" "$CLASSIFICATION")"
          echo "result=${RESULT}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "leaked-password protection: ${RESULT} (${REASON})" >> "$GITHUB_STEP_SUMMARY"

  zap-baseline:
    name: Candidate ZAP baseline
    needs: candidate
    # Same rationale as leaked-password-protection above: a full ZAP run is
    # not needed to certify a push with no backend/edge/migration impact.
    if: needs.candidate.outputs.full_certification_required == 'true' && needs.candidate.outputs.zap_configured == 'true'
    uses: ./.github/workflows/zap-baseline-staging.yml
    secrets: inherit

  zap-api:
    name: Candidate ZAP API
    needs: candidate
    if: needs.candidate.outputs.full_certification_required == 'true' && needs.candidate.outputs.zap_configured == 'true'
    uses: ./.github/workflows/zap-api-staging.yml
    secrets: inherit

  final-verdict:
    name: Final staging certification verdict
    needs: [candidate, staging-validation, static-and-authorization, artifact-exposure, leaked-password-protection, zap-baseline, zap-api]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      promotion_eligible: ${{ steps.verdict.outputs.promotion_eligible }}
      candidate_sha: ${{ needs.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
      - id: verdict
        env:
          FULL_CERTIFICATION_REQUIRED: ${{ needs.candidate.outputs.full_certification_required }}
          SKIP_REASON: ${{ needs.candidate.outputs.skip_reason }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          CANDIDATE_TREE: ${{ needs.candidate.outputs.tree }}
          RELEASE_CLASS: ${{ needs.candidate.outputs.release_class }}
          DEPLOYMENT_REQUIRED: ${{ needs.staging-validation.outputs.deployment_required }}
          DEPLOYED_SHA: ${{ needs.staging-validation.outputs.deployed_staging_sha }}
          MIGRATION: ${{ needs.staging-validation.outputs.migration_result }}
          CONTRACT: ${{ needs.staging-validation.outputs.contract_result }}
          HEALTH: ${{ needs.staging-validation.outputs.health_result }}
          SYNTHETIC: ${{ needs.staging-validation.outputs.synthetic_result }}
          STATIC_RESULT: ${{ needs.static-and-authorization.result }}
          ARTIFACT_RESULT: ${{ needs.artifact-exposure.result }}
          LEAKED_PASSWORD: ${{ needs.leaked-password-protection.outputs.result }}
          ZAP_CONFIGURED: ${{ needs.candidate.outputs.zap_configured }}
          ZAP_BASELINE_RESULT: ${{ needs.zap-baseline.result }}
          ZAP_API_RESULT: ${{ needs.zap-api.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          mkdir -p security/reports
          # Change-aware short circuit: an automatic push with no backend/edge/
          # migration impact never ran a real certification above (see the
          # candidate job's `scope` step) -- report that plainly instead of
          # deriving a verdict from a mix of skipped/no-op job results, which
          # could misrepresent an unrun check as PASS. The manual release-freeze
          # path (workflow_dispatch + explicit candidate_sha) always sets
          # FULL_CERTIFICATION_REQUIRED=true and falls through to the real path
          # below unconditionally.
          if [ "${FULL_CERTIFICATION_REQUIRED:-}" != "true" ]; then
            node <<'NODE'
          const fs = require('fs');
          const report = {
            candidate_commit_sha: process.env.CANDIDATE_SHA,
            candidate_tree_sha: process.env.CANDIDATE_TREE,
            release_class: process.env.RELEASE_CLASS,
            certification_run_id: process.env.RUN_ID,
            certification_performed: false,
            final_verdict: 'SKIPPED_NO_BACKEND_IMPACT',
            promotion_eligible: false,
            blocking_findings: [],
            operational_failures: [],
            report_only_findings: [],
            skip_reason: process.env.SKIP_REASON || null,
          };
          fs.writeFileSync('security/reports/staging-certification.json', JSON.stringify(report, null, 2));
          NODE
            echo "verdict=SKIPPED_NO_BACKEND_IMPACT" >> "$GITHUB_OUTPUT"
            echo "promotion_eligible=false" >> "$GITHUB_OUTPUT"
            cat security/reports/staging-certification.json >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch origin staging/production-parity --quiet
          node <<'NODE'
          const fs = require('fs');
          const status = (v) => v === 'success' ? 'PASS' : 'OPERATIONAL_FAILURE';
          const child = (v) => v === 'success' ? 'PASS' : v === 'skipped' ? 'NOT_APPLICABLE' : v === 'failure' ? 'BLOCKED' : 'OPERATIONAL_FAILURE';
          const zap = (v) => process.env.ZAP_CONFIGURED === 'true' ? status(v) : 'NOT_APPLICABLE';
          const input = {
            candidate_commit_sha: process.env.CANDIDATE_SHA,
            candidate_tree_sha: process.env.CANDIDATE_TREE,
            staging_branch_head_sha: require('child_process').execFileSync('git', ['rev-parse', 'origin/staging/production-parity'], {encoding:'utf8'}).trim(),
            deployed_staging_sha: process.env.DEPLOYED_SHA,
            deployment_required: process.env.DEPLOYMENT_REQUIRED,
            release_class: process.env.RELEASE_CLASS,
            certification_run_id: process.env.RUN_ID,
            static_security: status(process.env.STATIC_RESULT),
            migration_validation: child(process.env.MIGRATION),
            contract_tests: child(process.env.CONTRACT),
            staging_parity: status(process.env.STATIC_RESULT),
            staging_health: child(process.env.HEALTH),
            synthetic_auth: child(process.env.SYNTHETIC),
            rpc_rls_authorization: status(process.env.STATIC_RESULT),
            artifact_exposure: status(process.env.ARTIFACT_RESULT),
            quarantine_policy: status(process.env.STATIC_RESULT),
            leaked_password_protection: process.env.LEAKED_PASSWORD || 'OPERATIONAL_FAILURE',
            zap_baseline: zap(process.env.ZAP_BASELINE_RESULT),
            zap_api: zap(process.env.ZAP_API_RESULT),
            // Native UI automation is suspended by owner policy
            // (security/release/native-ui-automation-policy.json). No native
            // evidence is collected, and the certification builder records the
            // policy state rather than a verdict. See docs for reinstatement.
          };
          fs.writeFileSync('certification-input.json', JSON.stringify(input, null, 2));
          NODE
          set +e
          node security/scripts/build-staging-certification.js --input certification-input.json --output security/reports/staging-certification.json
          CODE=$?
          set -e
          echo "verdict=$(node -p "require('./security/reports/staging-certification.json').final_verdict")" >> "$GITHUB_OUTPUT"
          echo "promotion_eligible=$(node -p "require('./security/reports/staging-certification.json').promotion_eligible")" >> "$GITHUB_OUTPUT"
          cat security/reports/staging-certification.json >> "$GITHUB_STEP_SUMMARY"
          exit "$CODE"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-certification-${{ github.run_id }}
          path: security/reports/staging-certification.json
          if-no-files-found: error
          retention-days: 90
