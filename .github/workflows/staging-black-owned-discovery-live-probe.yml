# Bounded live probe for the deployed staging `black-owned-discovery` function
# and migration 20261029125521. Dispatch-only against staging; follows the
# existing live-probe pattern (staging-build33-closeout-live-probe.yml). It does
# not deploy, does not change flags or secrets, and creates no account. The
# operator sets the organic flags between dispatches and names the PHASE.
# `full` creates clearly synthetic fixture rows and two temporary reviewer
# grants for existing synthetic accounts, all removed before the job ends.

name: K Scan Staging Black-Owned Discovery Live Probe

on:
  workflow_dispatch:
    inputs:
      phase:
        description: readback | disabled | discovery | full
        required: true
        default: readback
        type: choice
        options:
          - readback
          - disabled
          - discovery
          - full
  # Scoped to this exact probe branch so the file self-registers; a push runs
  # the read-only `readback` phase only.
  push:
    branches:
      - test/black-owned-discovery-live-probe-v1

permissions:
  contents: read

concurrency:
  group: kscan-black-owned-discovery-live-probe
  cancel-in-progress: false

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run the bounded discovery proof
        env:
          PROBE_PHASE: ${{ inputs.phase || 'readback' }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SYNTHETIC_ACTIVE_EMAIL: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_EMAIL }}
          STAGING_SYNTHETIC_ACTIVE_PASSWORD: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_PASSWORD }}
          STAGING_SYNTHETIC_PENDING_EMAIL: ${{ secrets.STAGING_SYNTHETIC_PENDING_EMAIL }}
          STAGING_SYNTHETIC_LOCKED_EMAIL: ${{ secrets.STAGING_SYNTHETIC_LOCKED_EMAIL }}
        run: node security/release/run-black-owned-discovery-live-probe.js

      - name: Print sanitized evidence
        if: always()
        run: test -s black-owned-discovery-live-probe-report.json && cat black-owned-discovery-live-probe-report.json

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: black-owned-discovery-live-probe-${{ github.run_id }}
          path: black-owned-discovery-live-probe-report.json
          if-no-files-found: warn
          retention-days: 30
