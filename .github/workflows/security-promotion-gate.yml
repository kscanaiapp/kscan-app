# Aggregate Security promotion gate — evaluates all required security checks for a candidate SHA.

name: Security - Promotion Gate

# Triggered ONLY by the completion of each upstream security workflow, never
# directly by push/pull_request. Direct triggers used to start this job racing
# in parallel with the workflows whose results it reads — on a push, all five
# workflows fired within the same three seconds, so a fixed wait/poll here was
# the only thing standing between it and evaluating an empty check-run list.
# workflow_run guarantees at least one required check has just finished before
# this ever runs; a single non-blocking pass then either reaches a final
# verdict or reports PENDING for the next upstream completion to pick up. See
# security/scripts/evaluate-promotion-gate.js for the non-blocking evaluation.
on:
  workflow_run:
    workflows:
      - Security - Code and Dependencies
      - K Scan Staging Security Gate
      - Security - ZAP Baseline Staging
      - Security - ZAP API Staging
    types:
      - completed

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  security-promotion-gate:
    name: Security promotion gate
    runs-on: ubuntu-latest
    # A single non-blocking pass completes in seconds; 30 minutes was sized for
    # the old 20-minute internal poll, which no longer exists.
    timeout-minutes: 5
    if: github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upstream workflow's head_sha, not whatever ref this workflow
          # file itself lives on — evaluation must read the candidate's own
          # security/scripts/evaluate-promotion-gate.js, not the default branch's.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Resolve candidate SHA
        id: sha
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha }}"
          PR="${{ github.event.workflow_run.pull_requests[0].number }}"
          echo "head_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "merge_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "pull_request=${PR:-n/a}" >> "$GITHUB_OUTPUT"

      - name: Evaluate required security checks
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node security/scripts/evaluate-promotion-gate.js \
            --repo "${{ github.repository }}" \
            --sha "${{ steps.sha.outputs.head_sha }}" \
            --token "${{ github.token }}" \
            --wait-seconds 30 || EC=$?
          if [ -f security/reports/promotion-verdict.json ]; then
            VERDICT="$(python3 -c "import json; print(json.load(open('security/reports/promotion-verdict.json', encoding='utf-8'))['finalVerdict'])")"
            echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"
          fi
          # PASS and PENDING both exit 0 from the evaluator itself — PENDING
          # means another required workflow hasn't finished yet, and this job
          # runs again on its completion, so it is not a job failure here.
          exit ${EC:-0}

      - name: Publish promotion gate summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f security/reports/promotion-verdict.md ]; then
            cat security/reports/promotion-verdict.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Promotion verdict artifact missing" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | ${{ github.repository }} |"
            echo "| Pull request | ${{ steps.sha.outputs.pull_request }} |"
            echo "| Head SHA | ${{ steps.sha.outputs.head_sha }} |"
            echo "| Merge SHA | ${{ steps.sha.outputs.merge_sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload promotion verdict artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-verdict-${{ github.run_number }}
          path: |
            security/reports/promotion-verdict.json
            security/reports/promotion-verdict.md
          if-no-files-found: warn
          retention-days: 30
