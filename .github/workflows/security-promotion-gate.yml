# Aggregate Security promotion gate — evaluates all required security checks for a candidate SHA.

name: Security - Promotion Gate

# TRIGGER CORRECTION (2026-08-06, same day as the rename fix below): a first
# version of this fix moved to `workflow_run`-only triggering to avoid racing
# the four upstream workflows. That was wrong for THIS repo specifically:
# GitHub only evaluates `workflow_run` (and `workflow_dispatch`) trigger
# definitions from the copy of the workflow file on the DEFAULT branch, and
# master carries no .github/workflows at all. Every historical run of this
# workflow was push/pull_request-triggered — workflow_run has never once fired
# it, before or after that change — so removing push/pull_request made the
# gate never run at all, silently, which is worse than the 20-minute timeout
# it replaced. `workflow_run` is kept below for forward compatibility (it
# starts working for free if the workflow files are ever published to
# master) but push/pull_request is restored as the trigger that actually works.
#
# The race this created (all five workflows starting within ~3 seconds of a
# push) is handled differently now: evaluate-promotion-gate.js's required-check
# names are corrected (see below) so the bounded wait below actually converges
# — observed upstream completion times top out around 2 minutes, so a 5-minute
# ceiling is generous headroom, not a blind 20-minute wait for names that could
# never match.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - "**"
  workflow_run:
    workflows:
      - Security - Code and Dependencies
      - K Scan Staging Security Gate
      - Security - ZAP Baseline Staging
      - Security - ZAP API Staging
    types:
      - completed

permissions:
  contents: read
  checks: read
  actions: read

env:
  # CI-CONVERGENCE-001. The convergence CEILING, not an expected wait.
  #
  # Sized from the workflows themselves: the longest `timeout-minutes` any
  # applicable required job carries (Project checks, 60m in security-code.yml)
  # plus a 5-minute margin for queueing and runner startup. A required check
  # that is still inside its own governed timeout is still legitimately
  # RUNNING, and must read as WAIT — never as a converged verdict.
  #
  # The previous value was 300s, which the duplicate-aware reduction
  # (CI-APPLICABILITY-002) exposed as a guaranteed premature OPERATIONAL
  # FAILURE: on PR #290 itself Project checks, npm audit and Contract tests
  # were all still running when it expired.
  #
  # evaluate-promotion-gate.js returns the moment the applicable set settles,
  # or the moment a conclusive failure exists, so an ordinary run is unchanged
  # — this only bounds the pathological case. Kept in agreement with the
  # evaluator's own DEFAULT_CONVERGENCE_WAIT_SECONDS, and with the required
  # jobs' real timeouts, by __tests__/security/promotionGateCheckRuns.test.js.
  CONVERGENCE_WAIT_SECONDS: 3900

jobs:
  security-promotion-gate:
    name: Security promotion gate
    runs-on: ubuntu-latest
    # Must exceed CONVERGENCE_WAIT_SECONDS (65m) so the evaluator's own
    # bounded wait is what expires first, producing a named OPERATIONAL
    # FAILURE verdict artifact rather than an opaque job timeout.
    timeout-minutes: 70
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On workflow_run this is the upstream workflow's head_sha rather
          # than whatever ref this file itself lives on; on push/pull_request
          # it defaults to the triggering ref, which is already correct.
          ref: ${{ github.event.workflow_run.head_sha || '' }}
          # CI-APPLICABILITY-001: the classifier diffs this branch against its
          # merge base, so the full history is required. A shallow clone cannot
          # resolve the base, and classify-changed-surfaces.js now fails closed
          # rather than silently classifying the wrong range.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Resolve candidate SHA
        id: sha
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
            PR="${{ github.event.workflow_run.pull_requests[0].number }}"
          elif [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
            PR="${{ github.event.pull_request.number }}"
          else
            SHA="${{ github.sha }}"
            PR=""
          fi
          # CI-CONVERGENCE-001: one budget for every trigger path.
          #
          # workflow_run previously used a 30-second settle-wait on the theory
          # that "one required workflow just finished, so only the rest need a
          # moment". That is the same stale assumption as the old 300s value:
          # the OTHER required workflows may still be legitimately running for
          # up to their own timeouts. Giving every path the same governed
          # ceiling removes the branch and the landmine at once — and costs
          # nothing, because the evaluator returns as soon as the set settles.
          echo "wait_seconds=${CONVERGENCE_WAIT_SECONDS}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "merge_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "pull_request=${PR:-n/a}" >> "$GITHUB_OUTPUT"

      # Staging Gate V2 Section 5: best-effort only - a NORMAL_PR-level
      # "Project checks" run uploads this artifact from the Security - Code
      # and Dependencies workflow (see security-code.yml); an
      # INTEGRATION/RELEASE_PROMOTION-level run (or one that failed before
      # the regression script ran at all) legitimately has none. Either way
      # this step never fails the job - classifyProjectCheckFailure already
      # fails closed to PROJECT_CI_OPERATIONAL_FAILURE when no report is
      # found, exactly today's classification for an unexplained failure.
      - name: Download Project checks regression report
        id: project_check_report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          SHA="${{ steps.sha.outputs.head_sha }}"
          RUN_ID="$(gh run list --repo "${{ github.repository }}" --workflow=security-code.yml --json databaseId,headSha --jq ".[] | select(.headSha==\"${SHA}\") | .databaseId" | head -1)"
          if [ -z "$RUN_ID" ]; then
            echo "No Security - Code and Dependencies run found for ${SHA}."
            exit 0
          fi
          mkdir -p /tmp/project-check-report
          if gh run download "$RUN_ID" --repo "${{ github.repository }}" --dir /tmp/project-check-report --pattern 'project-checks-regression-*'; then
            REPORT_PATH="$(find /tmp/project-check-report -name project-checks-regression.json | head -1)"
            if [ -n "$REPORT_PATH" ]; then
              echo "path=${REPORT_PATH}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No project-checks-regression artifact on run ${RUN_ID} (expected for INTEGRATION/RELEASE_PROMOTION-level runs, which use the flat suite instead)."
          fi

      # ── CI-APPLICABILITY-001 ─────────────────────────────────────────────
      # Resolve which required checks actually APPLY to this diff, using the
      # same classifier the staging workflow's job-level `if:` conditions are
      # derived from. Without this the gate cannot distinguish
      #   "Migration validation legitimately did not run (no migrations)"
      # from
      #   "Migration validation should have run and is missing".
      #
      # Never fails the job: if this step produces nothing, the evaluator treats
      # EVERY required check as applicable, which is strictly stricter.
      - name: Resolve check applicability
        id: applicability
        continue-on-error: true
        env:
          # STAGING-DEPLOY-AUTH-001: the same context deploy-staging's own
          # `if:` in security-staging-gate.yml checks, so classify-changed-
          # surfaces.js can tell "this diff needs a backend deploy eventually"
          # apart from "this event is authorized to deploy it now". Dedicated
          # names, not the automatic GITHUB_EVENT_NAME/GITHUB_REF/GITHUB_BASE_REF,
          # so the classifier's own test suite (which invokes it as a child
          # process without these set) is unaffected -- see that function's
          # doc comment.
          STAGING_DEPLOY_AUTH_EVENT_NAME: ${{ github.event_name }}
          STAGING_DEPLOY_AUTH_REF: ${{ github.ref }}
          STAGING_DEPLOY_AUTH_BASE_REF: ${{ github.base_ref }}
          STAGING_DEPLOY_AUTH_DISPATCH_CONFIRM: ${{ github.event.inputs.confirm_staging_deploy }}
          STAGING_DEPLOY_AUTH_DISPATCH_PROJECT_REF: ${{ github.event.inputs.staging_project_ref }}
        run: |
          set -uo pipefail
          BASE="${{ github.base_ref }}"
          if [ -z "$BASE" ]; then
            # NO PULL-REQUEST BASE (a push event). There is no trustworthy base
            # to classify against here, and guessing one is worse than declining:
            # the previous `HEAD~1` fallback is the OTHER SIDE OF THE MERGE on a
            # merge commit, so on a branch that had just merged its integration
            # target it reported that target's migrations and Edge functions as
            # this branch's own changes -- a WRONG applicability contract, which
            # then failed a check the staging gate had correctly skipped.
            #
            # Emitting no contract is the safe outcome: the evaluator then falls
            # back to its documented handling for the conditionally-emitted jobs
            # and keeps every unconditional scanner strictly required.
            echo "No pull-request base ref; not asserting an applicability contract."
            echo "The evaluator will fall back to its no-contract handling."
            exit 0
          fi
          # Plain fetch: the checkout above is already fetch-depth 0, and
          # `--depth=0` is not a valid git argument (it logs a fatal and is a
          # no-op). A `fatal:` line in a security-critical step is exactly the
          # noise that hides a real failure later.
          git fetch --no-tags origin "$BASE" || true
          BASE_REF="origin/${BASE}"
          echo "Classifying against ${BASE_REF}"
          if node security/scripts/classify-changed-surfaces.js "$BASE_REF" > /tmp/classification.json; then
            echo "path=/tmp/classification.json" >> "$GITHUB_OUTPUT"
            python3 -c "import json;d=json.load(open('/tmp/classification.json'));print('classifications:',d['classifications']);print('applicability:',json.dumps(d.get('checkApplicability'),indent=1))"
          else
            echo "Classification FAILED - the evaluator will treat every required check as applicable (fail closed)."
          fi

      - name: Evaluate required security checks
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node security/scripts/evaluate-promotion-gate.js \
            --repo "${{ github.repository }}" \
            --sha "${{ steps.sha.outputs.head_sha }}" \
            --token "${{ github.token }}" \
            --wait-seconds "${{ steps.sha.outputs.wait_seconds }}" \
            --project-check-report "${{ steps.project_check_report.outputs.path }}"             --applicability "${{ steps.applicability.outputs.path }}" || EC=$?
          if [ -f security/reports/promotion-verdict.json ]; then
            VERDICT="$(python3 -c "import json; print(json.load(open('security/reports/promotion-verdict.json', encoding='utf-8'))['finalVerdict'])")"
            echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"
          fi
          # PASS and PENDING both exit 0 from the evaluator itself. PENDING on
          # the workflow_run path means another required workflow hasn't
          # finished yet and this job runs again on its completion; on the
          # push/pull_request path (the one that actually fires here) the
          # 5-minute wait above should already have resolved everything, so a
          # PENDING result there is itself worth surfacing, not silently OK.
          exit ${EC:-0}

      - name: Publish promotion gate summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f security/reports/promotion-verdict.md ]; then
            cat security/reports/promotion-verdict.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Promotion verdict artifact missing" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | ${{ github.repository }} |"
            echo "| Pull request | ${{ steps.sha.outputs.pull_request }} |"
            echo "| Head SHA | ${{ steps.sha.outputs.head_sha }} |"
            echo "| Merge SHA | ${{ steps.sha.outputs.merge_sha }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload promotion verdict artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-verdict-${{ github.run_number }}
          path: |
            security/reports/promotion-verdict.json
            security/reports/promotion-verdict.md
          if-no-files-found: warn
          retention-days: 30
