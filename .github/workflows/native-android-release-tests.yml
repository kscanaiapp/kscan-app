name: Native Android Release Tests

# Branch-neutral native Android release runner.
#
# It always builds and tests one exact commit: the candidate SHA passed in, or
# the SHA this workflow was dispatched against. Nothing here is pinned to a
# release branch, and nothing depends on Build 2.5 launchers or flows.
#
# Certification (.github/workflows/staging-release-certification.yml) consumes
# the `native-android-evidence` artifact and re-validates it with
# security/scripts/parse-native-mobile-evidence.js, so this workflow cannot
# certify itself.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit to build and test. Defaults to the dispatched ref.
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        required: false
        type: string
    secrets:
      QA_EMAIL:
        required: false
      QA_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: native-android-release-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

env:
  MAESTRO_VERSION: 1.39.0
  APP_ID: com.kscanai.app
  ANDROID_API_LEVEL: '34'
  ANDROID_TARGET: google_apis
  ANDROID_ARCH: x86_64
  ANDROID_PROFILE: pixel_6

jobs:
  android:
    name: Android release flows
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      result: ${{ steps.evidence.outputs.result }}
      tested_sha: ${{ steps.candidate.outputs.sha }}

    steps:
      - name: Resolve candidate SHA
        id: candidate
        env:
          REQUESTED: ${{ inputs.candidate_sha }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHA="${REQUESTED:-$DEFAULT_SHA}"
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "candidate_sha must be a full 40-character commit SHA, got: $SHA" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Testing candidate $SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 1

      - name: Verify checked-out commit matches the candidate
        env:
          EXPECTED: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "checkout drift: expected $EXPECTED, got $ACTUAL" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve staging build environment
        id: buildenv
        # Read the reconciled `preview` profile so the runner uses exactly the
        # environment the release configuration declares. eas.json regression
        # tests guarantee this profile never points at production.
        run: |
          set -euo pipefail
          node -e "
            const eas = require('./eas.json');
            const env = eas.build.preview.env || {};
            const url = env.EXPO_PUBLIC_SUPABASE_URL || '';
            if (!url.includes('yzqjvdfgefveprobvvyw')) {
              console.error('refusing to run: preview profile does not target the staging Supabase project');
              process.exit(1);
            }
            const fs = require('fs');
            for (const [k, v] of Object.entries(env)) fs.appendFileSync(process.env.GITHUB_ENV, k + '=' + v + '\n');
          "

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build debug APK
        id: build
        # A debug build is deliberate: it needs no release signing material, so
        # the runner never handles store credentials.
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then echo 'no APK produced' >&2; exit 1; fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "build_identifier=android-debug-${{ steps.candidate.outputs.sha }}-$(sha256sum "$APK" | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -fsSL https://get.maestro.mobile.dev | bash -s "$MAESTRO_VERSION"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run release flows on emulator
        id: maestro
        continue-on-error: true
        env:
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          profile: ${{ env.ANDROID_PROFILE }}
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          script: |
            set -o pipefail
            adb install -r "${{ steps.build.outputs.apk }}"
            mkdir -p artifacts
            maestro test .maestro/flows/release \
              --include-tags release \
              -e APP_ID="$APP_ID" \
              -e QA_EMAIL="$QA_EMAIL" \
              -e QA_PASSWORD="$QA_PASSWORD" \
              --format junit \
              --output artifacts/report.xml \
              --debug-output artifacts/maestro-debug \
              2>&1 | tee artifacts/maestro.log

      - name: Record device identity
        id: device
        run: echo "id=${ANDROID_PROFILE}_API_${ANDROID_API_LEVEL}_${ANDROID_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Build native evidence
        id: evidence
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          INFRA=''
          if [ ! -f artifacts/report.xml ]; then INFRA='--infrastructure-failure'; fi
          node security/scripts/build-native-mobile-evidence.js \
            --platform android \
            --candidate-sha "${{ steps.candidate.outputs.sha }}" \
            --run-id "${{ github.run_id }}" \
            --build-identifier "${{ steps.build.outputs.build_identifier }}" \
            --device "${{ steps.device.outputs.id }}" \
            --runner "Maestro ${MAESTRO_VERSION}" \
            --report artifacts/report.xml \
            --artifact-links "$RUN_URL" \
            --output artifacts/native-android-evidence.json \
            $INFRA
          RESULT="$(node -p "require('./artifacts/native-android-evidence.json').result")"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          cat artifacts/native-android-evidence.json

      - name: Upload native evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-android-evidence
          path: artifacts/native-android-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-run-artifacts
          path: |
            artifacts/report.xml
            artifacts/maestro.log
            artifacts/maestro-debug/**
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce result
        # PASS is the only green outcome. OPERATIONAL_FAILURE and BLOCKED both
        # fail the job, but the evidence artifact preserves which one it was so
        # certification does not confuse an emulator fault with a flow failure.
        run: |
          set -euo pipefail
          RESULT='${{ steps.evidence.outputs.result }}'
          echo "Native Android result: $RESULT"
          [ "$RESULT" = 'PASS' ]
