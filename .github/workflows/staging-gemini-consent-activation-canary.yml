# Bounded Staging canary for issues #701 + #639 (Gemini v2 consent lifecycle,
# then Elise brand voice + Scanner image mission execution). Follows the
# existing live-probe pattern (staging-instruction-activation-live-probe.yml):
# staging environment, one narrow script, sanitized JSON artifact. The push
# trigger is scoped to this canary's own branch so the workflow self-registers.
#
# Side effects (owner-approved 2026-11-03): the governed synthetic ACTIVE
# account records its own v2 ai_processing acknowledgment and permission
# revisions; exactly one Elise turn and one image-mode scan reach Gemini; one
# owned Elise session row is created and deleted. Deploys nothing.

name: K Scan Staging Gemini Consent Activation Canary

on:
  workflow_dispatch:
    inputs:
      mode:
        description: gates (zero-spend consent gate check), commerce (one MODE B request, no Gemini) or activation (paid, owner-approved)
        required: true
        default: gates
        type: choice
        options:
          - gates
          - commerce
          - activation
  push:
    branches:
      - test/gemini-consent-activation-canary-v1

permissions:
  contents: read

concurrency:
  group: kscan-gemini-consent-activation-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run the bounded consent + activation canary
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SYNTHETIC_ACTIVE_EMAIL: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_EMAIL }}
          STAGING_SYNTHETIC_ACTIVE_PASSWORD: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_PASSWORD }}
          CANARY_MODE: ${{ inputs.mode || 'gates' }}
        run: node security/release/run-gemini-consent-activation-canary.js

      - name: Print sanitized evidence
        if: always()
        run: test -s gemini-consent-activation-canary-report.json && cat gemini-consent-activation-canary-report.json

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gemini-consent-activation-canary-${{ github.run_id }}
          path: gemini-consent-activation-canary-report.json
          if-no-files-found: warn
          retention-days: 30
