name: Staging Auth Hardening

# Enables Supabase Auth leaked-password protection (HaveIBeenPwned) on STAGING.
#
# WHY A WORKFLOW AND NOT A ONE-OFF. `Staging Release Certification` fails on
# `leaked_password_protection: BLOCKED` and will keep failing every merge until
# `password_hibp_enabled` is true. The only mechanisms available were:
#
#   * `supabase config push` — REFUSED. The repository's local `[auth]` block is
#     empty, so pushing it would reset unrelated live Auth settings (redirect
#     URLs, providers, autoconfirm) to CLI defaults. Far too blunt.
#   * the Management API — needs SUPABASE_ACCESS_TOKEN, which exists only as a
#     protected secret. That is this workflow.
#
# DELIBERATELY NARROW, mirroring security/release/set-staging-runtime-flag.mjs:
# one allowlisted setting, one allowed value, staging only, manual dispatch
# only, production an explicit deny. Widening it requires a reviewed change to
# this file. It is intentionally NOT a generic auth-config writer — an
# arbitrary PATCH primitive aimed at a live Auth configuration is a much larger
# capability than this problem needs.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type HARDEN-STAGING-AUTH to proceed.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-auth-hardening
  cancel-in-progress: false

jobs:
  enable-leaked-password-protection:
    name: Enable leaked password protection (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      STAGING_REF: yzqjvdfgefveprobvvyw
      PRODUCTION_REF: wyyuqfdxucjksghsmhry
      CONFIRMATION: HARDEN-STAGING-AUTH
    steps:
      - name: Verify confirmation and environment authority
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "${CONFIRMATION}" ]; then
            echo "::error::Confirmation string did not match. Refusing."
            exit 1
          fi
          if [ "${STAGING_REF}" = "${PRODUCTION_REF}" ]; then
            echo "::error::Target ref equals the production ref. Refusing."
            exit 1
          fi
          case "${STAGING_REF}" in
            yzqjvdfgefveprobvvyw) : ;;
            *) echo "::error::Unrecognised target project ref. Refusing."; exit 1 ;;
          esac
          echo "Target project: ${STAGING_REF} (staging)"

      - name: Enable password_hibp_enabled
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not available to this environment. Refusing."
            exit 1
          fi

          umask 077
          HDR="$(mktemp)"
          trap 'rm -f "${HDR}" before.json after.json' EXIT
          printf 'Authorization: Bearer %s\n' "${SUPABASE_ACCESS_TOKEN}" > "${HDR}"

          API="https://api.supabase.com/v1/projects/${STAGING_REF}/config/auth"

          BEFORE_CODE="$(curl --silent --show-error --output before.json --write-out '%{http_code}' \
            --max-time 60 --header @"${HDR}" "${API}")"
          if [ "${BEFORE_CODE}" != "200" ]; then
            echo "::error::Could not read staging auth config (HTTP ${BEFORE_CODE})."
            exit 1
          fi
          BEFORE="$(node -e 'process.stdout.write(String(require("./before.json").password_hibp_enabled))')"
          echo "before: password_hibp_enabled=${BEFORE}"

          # The ONLY field this workflow is permitted to write.
          PATCH_CODE="$(curl --silent --show-error --output after.json --write-out '%{http_code}' \
            --max-time 60 --request PATCH \
            --header @"${HDR}" \
            --header 'Content-Type: application/json' \
            --data '{"password_hibp_enabled":true}' \
            "${API}")"
          if [ "${PATCH_CODE}" != "200" ]; then
            echo "::error::Auth config update failed (HTTP ${PATCH_CODE})."
            exit 1
          fi

          # Re-read rather than trusting the PATCH echo.
          VERIFY_CODE="$(curl --silent --show-error --output after.json --write-out '%{http_code}' \
            --max-time 60 --header @"${HDR}" "${API}")"
          if [ "${VERIFY_CODE}" != "200" ]; then
            echo "::error::Could not verify staging auth config (HTTP ${VERIFY_CODE})."
            exit 1
          fi
          AFTER="$(node -e 'process.stdout.write(String(require("./after.json").password_hibp_enabled))')"
          echo "after:  password_hibp_enabled=${AFTER}"

          if [ "${AFTER}" != "true" ]; then
            echo "::error::password_hibp_enabled is still ${AFTER} after the update."
            exit 1
          fi

          {
            echo "### Staging auth hardening"
            echo ""
            echo "- Project: \`${STAGING_REF}\` (staging)"
            echo "- \`password_hibp_enabled\`: \`${BEFORE}\` → \`${AFTER}\`"
          } >> "$GITHUB_STEP_SUMMARY"
