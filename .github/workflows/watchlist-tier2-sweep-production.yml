# K+ Smart Watchlist — Tier 2 refresh sweep (PRODUCTION).
#
# The sweep runs only through commerce-watch-refresh's bounded worker-secret
# path. A scheduled job needs a dedicated unattended environment; using the
# human-reviewed production DEPLOYMENT environment left every scheduled run
# pending and then cancelled by the next invocation (no worker job started).
#
# Schedule: 'watchlist-production-automation' Environment, WITHOUT required
# reviewers, provisioned only with WATCHLIST_WORKER_SECRET and the exact
# SUPABASE_PRODUCTION_FUNCTIONS_URL variable. Do not copy deployment, database,
# service-role or broad project credentials into this environment. Missing
# credentials fail CLOSED in preflight, before any request.
#
# Manual dispatch: the existing reviewer-protected 'production' Environment,
# and the RUN-SWEEP confirmation remain mandatory. Deployment and migration
# workflows remain unchanged and protected. Neither path can bypass the server's
# app_config.watchlist_worker_enabled kill switch or the worker-secret guard.

name: Watchlist Tier 2 Sweep (production)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Must be RUN-SWEEP to proceed
        required: true
        default: ''
        type: string
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

# Separate concurrency groups per trigger path. A run waiting on the reviewer-
# protected 'production' Environment keeps its concurrency group occupied for
# up to 30 days; while the scheduled and manual paths shared one group, a single
# unapproved run (38269743575, queued 2026-10-12 before the automation split)
# held it, and every later scheduled run sat "pending" with zero jobs until the
# next schedule tick cancelled it. Scheduled runs can never wait for approval
# (the automation Environment has no reviewers), so the schedule group is only
# held by a live job bounded by timeout-minutes. Overlap between a manual and a
# scheduled sweep is safe: claim_watchable_commerce_watches stamps
# last_checked_at under FOR UPDATE SKIP LOCKED, so a Watch is claimed once.
concurrency:
  group: watchlist-tier2-sweep-production-${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Watchlist Tier 2 sweep
    runs-on: ubuntu-latest
    # Human approval is mandatory for manual dispatch, not for the six-hour
    # scheduled narrow worker operation. Credentials are environment-scoped.
    environment:
      name: ${{ github.event_name == 'schedule' && 'watchlist-production-automation' || 'production' }}
    timeout-minutes: 10
    if: github.event_name != 'workflow_dispatch' || inputs.confirm == 'RUN-SWEEP'
    steps:
      - name: Preflight — refuse to run unconfigured
        id: preflight
        env:
          WORKER_SECRET: ${{ secrets.WATCHLIST_WORKER_SECRET }}
          FUNCTIONS_URL: ${{ vars.SUPABASE_PRODUCTION_FUNCTIONS_URL }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "${WORKER_SECRET:-}" ] || MISSING="${MISSING} WATCHLIST_WORKER_SECRET(secret)"
          [ -n "${FUNCTIONS_URL:-}" ] || MISSING="${MISSING} SUPABASE_PRODUCTION_FUNCTIONS_URL(variable)"
          if [ -n "${MISSING}" ]; then
            echo "Watchlist Tier 2 production sweep is NOT provisioned. Missing:${MISSING}"
            exit 1
          fi
          case "${FUNCTIONS_URL%/}" in
            https://wyyuqfdxucjksghsmhry.functions.supabase.co) ;;
            *) echo "SUPABASE_PRODUCTION_FUNCTIONS_URL must be the production Functions origin"; exit 1 ;;
          esac
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Invoke the governed sweep
        if: steps.preflight.outputs.configured == 'true'
        env:
          WORKER_SECRET: ${{ secrets.WATCHLIST_WORKER_SECRET }}
          FUNCTIONS_URL: ${{ vars.SUPABASE_PRODUCTION_FUNCTIONS_URL }}
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          STATUS="$(curl --silent --show-error --fail-with-body \
            --max-time 120 \
            --request POST \
            --header "content-type: application/json" \
            --header "x-watchlist-worker-secret: ${WORKER_SECRET}" \
            --data '{}' \
            --output "${BODY_FILE}" \
            --write-out '%{http_code}' \
            "${FUNCTIONS_URL%/}/commerce-watch-refresh")" || CURL_FAILED=1

          echo "HTTP ${STATUS}"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({k: d.get(k) for k in ('mode','enabled','claimed')}))" "${BODY_FILE}" \
            || echo "(unparseable response body withheld)"

          if [ "${CURL_FAILED:-0}" = "1" ] || [ "${STATUS}" != "200" ]; then
            echo "Sweep request did not succeed."
            exit 1
          fi

          if python3 -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get('enabled') is False else 1)" "${BODY_FILE}"; then
            echo "app_config.watchlist_worker_enabled is FALSE — nothing was claimed."
          fi
