name: Build 34 iOS Production Certification — Release Authority

on:
  push:
    branches:
      - ops/build34-ios-certification-dc1f59f4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build34-ios-production-certification-release-authority
  cancel-in-progress: false

env:
  RELEASE_BRANCH: release/kscan-pre-freeze-v1
  SOURCE_SHA: dc1f59f4a3250b78cab8b6f76d0e92a47aac4949

jobs:
  prebuild-audit:
    name: iOS pre-build audit (exact release SHA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Assert exact release authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git fetch origin "${RELEASE_BRANCH}" --quiet
          test "$(git rev-parse "origin/${RELEASE_BRANCH}")" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain)"
          echo "release authority: PASS ${SOURCE_SHA}"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production-certification profile
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const cert = eas.build?.['production-certification'];
          const prod = eas.build?.production;
          if (!cert || !prod) throw new Error('production-certification or production profile missing');
          if (cert.extends !== 'production') throw new Error('production-certification must extend production');
          if (cert.environment !== 'production') throw new Error('production-certification must pin EAS environment=production');

          const resolvedEnv = { ...(prod.env || {}), ...(cert.env || {}) };
          const requiredTrue = [
            'EXPO_PUBLIC_KPLUS_EARLY_ACCESS_ENABLED',
            'EXPO_PUBLIC_SMART_WATCHLIST_V1',
            'EXPO_PUBLIC_VTO_UI_ENABLED',
            'EXPO_PUBLIC_PACKING_INTELLIGENCE_V1',
            'EXPO_PUBLIC_ELISE_CONCIERGE_V1',
            'EXPO_PUBLIC_VOICESCAN_ENABLED',
            'EXPO_PUBLIC_MULTI_IMAGE_SCANNER_ENABLED',
            'EXPO_PUBLIC_CLOSET_CLOUD_SYNC_V1',
            'EXPO_PUBLIC_CLOSET_CROSS_DEVICE_RESTORE_V1',
            'EXPO_PUBLIC_CLOSET_LEGACY_MIGRATION_V1',
          ];
          for (const key of requiredTrue) {
            if (resolvedEnv[key] !== 'true') throw new Error(key + ' must resolve true');
          }
          const url = resolvedEnv.EXPO_PUBLIC_SUPABASE_URL || '';
          if (!url.includes('wyyuqfdxucjksghsmhry')) throw new Error('production Supabase ref missing');
          if (url.includes('yzqjvdfgefveprobvvyw')) throw new Error('staging Supabase ref leaked into certification profile');
          console.log('production-certification matrix: PASS');
          NODE

      - name: Native config parity
        run: npm run verify:native-config-parity

      - name: Dependency reachability
        run: npm run verify:dependency-reachability

      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json

      - name: Full regression suite
        run: npm run test:all

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Apple readiness source checks
        run: npm run verify:apple-readiness

      - name: Release JS export
        env:
          CI: '1'
        run: npx expo export --platform ios --output-dir dist-prebuild-ios

  eas-build:
    name: iOS full EAS build (exact release SHA)
    needs: prebuild-audit
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Reassert exact release authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git fetch origin "${RELEASE_BRANCH}" --quiet
          test "$(git rev-parse "origin/${RELEASE_BRANCH}")" = "${SOURCE_SHA}"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Confirm Expo authentication prerequisite
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::GitHub production Environment secret EXPO_TOKEN is missing."
            exit 1
          fi
          npx eas-cli@latest whoami

      - name: Launch and wait for iOS EAS build
        shell: bash
        run: |
          set -euo pipefail
          npx eas-cli@latest build \
            --platform ios \
            --profile production-certification \
            --non-interactive \
            --wait \
            --json > eas-ios-build.json
          cat eas-ios-build.json

      - name: Publish build evidence
        uses: actions/upload-artifact@v4
        with:
          name: build34-ios-eas-result-${{ github.run_number }}
          path: eas-ios-build.json
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          node <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('eas-ios-build.json', 'utf8'));
          const b = Array.isArray(raw) ? raw[0] : raw;
          console.log('## Build 34 iOS EAS');
          console.log('');
          console.log('- Release branch: `release/kscan-pre-freeze-v1`');
          console.log('- Source SHA: `dc1f59f4a3250b78cab8b6f76d0e92a47aac4949`');
          console.log('- Profile: `production-certification`');
          console.log('- Build ID: `' + (b?.id || 'unknown') + '`');
          console.log('- Status: `' + (b?.status || 'unknown') + '`');
          if (b?.appVersion) console.log('- App version: `' + b.appVersion + '`');
          if (b?.appBuildVersion) console.log('- Build number: `' + b.appBuildVersion + '`');
          if (b?.buildUrl) console.log('- Build: ' + b.buildUrl);
          if (b?.artifacts?.applicationArchiveUrl) console.log('- Artifact: ' + b.artifacts.applicationArchiveUrl);
          NODE
