# Controlled production deployment pipeline.
#
# Deploys exactly one allow-listed Edge Function (and optionally one approved
# migration) to KScan App Production (wyyuqfdxucjksghsmhry). Staging is never
# targeted — every script this workflow calls refuses any argument naming the
# staging project (scripts/lib/production-helpers.mjs).
#
# MIGRATION-ONLY MODE: dispatch with `function_name: none` to apply the approved
# migration and deploy no function. The mode exists because a migration cannot
# always ride a function deploy — see the comment on the "Record deployment
# scope" step. It skips source validation and the deploy/health/synthetic/
# rollback chain, and NOTHING else: every governance control listed below still
# applies, and the run is judged on the migration alone.
#
# GOVERNANCE (repo-settings prerequisites, not expressible in this file):
#   - A GitHub "production" Environment must exist with required reviewers
#     configured. The `environment: production` gate below then pauses this
#     workflow for human approval before any job that can mutate production
#     runs — this is what satisfies Phase 4's "show the production migration
#     plan before applying it" and "require reviewers" requirements. Approve
#     after reading the preflight job's summary (posted before the gate), not
#     blind.
#   - Production credentials (SUPABASE_ACCESS_TOKEN,
#     SUPABASE_PRODUCTION_PUBLISHABLE_KEY, SUPABASE_PRODUCTION_PROJECT_REF,
#     SUPABASE_PRODUCTION_URL) belong on that Environment, NOT at repository
#     scope. Repository scope would hand them to every job in every workflow,
#     including the ones that run before the gate, which defeats the gate.
#   - Branch protection on rebuild/backend-authority-v2 should require the
#     usual checks before merge. This workflow additionally refuses to run
#     against anything that is not the CURRENT tip of that branch (see
#     scripts/production-deploy-preflight.mjs assertGovernedCommit) — a
#     stale or unmerged checkout cannot deploy no matter who approves it.
#
# WHERE VALIDATION RUNS (and why it is split):
#   The `preflight` job runs BEFORE the environment gate — that is what lets
#   it show a reviewer the plan they are approving. Because it runs before the
#   gate it cannot hold environment-scoped credentials, so it is credential-
#   free: confirmation phrase, governed-branch tip, migration version syntax
#   and selection, migration-only scope, and the local/static authority checks
#   (canonical file, exactly one match, not reconciled, not HOLD, not EXCLUDE,
#   prohibited-SQL scan). It makes no remote call.
#
#   Every check that needs live production — target identity, the staging
#   refusal, the remote ledger, already-applied, unexplained drift in either
#   direction — runs INSIDE `approved-single-migration`, which carries
#   `environment: production`, immediately before the write, and again inside
#   apply-production-migration.mjs itself. Nothing was dropped; it moved to the
#   only place it can legitimately run.
#
# This workflow is manual-dispatch only. It is never triggered by push, PR,
# or schedule — production is deployed to on purpose, by a named human, or
# not at all.

name: K Scan Production Controlled Deploy

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: >-
          Exactly one Edge Function to deploy, or "none" for a migration-only run
          (applies the approved migration and deploys no function).
        required: true
        type: string
      verify_jwt:
        description: Whether the function expects JWT verification
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      approved_migration_version:
        description: Optional single migration version to apply before deploy (12-14 digits)
        required: false
        default: ''
        type: string
      approve_migration:
        description: Must be YES to apply the approved migration
        required: false
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'
      confirm_production:
        description: Must be exactly "DEPLOY TO PRODUCTION" to proceed past preflight
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kscan-production-deployment
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOVERNED_BRANCH: rebuild/backend-authority-v2
  EXPECTED_PRODUCTION_REF: wyyuqfdxucjksghsmhry
  STAGING_REF: yzqjvdfgefveprobvvyw

jobs:
  confirm:
    name: Confirm intent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exact confirmation phrase
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_production }}" != "DEPLOY TO PRODUCTION" ]; then
            echo "confirm_production must be exactly: DEPLOY TO PRODUCTION"
            exit 1
          fi

  preflight:
    name: Preflight (no production environment gate — read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: confirm
    outputs:
      function_name: ${{ steps.scope.outputs.function_name }}
      verify_jwt: ${{ steps.scope.outputs.verify_jwt }}
      migration_version: ${{ steps.scope.outputs.migration_version }}
      migration_only: ${{ steps.scope.outputs.migration_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Refuse anything but the governed branch tip
        run: |
          set -euo pipefail
          git fetch origin "${GOVERNED_BRANCH}" --quiet
          HEAD_SHA="$(git rev-parse HEAD)"
          GOVERNED_SHA="$(git rev-parse "origin/${GOVERNED_BRANCH}")"
          if [ "$HEAD_SHA" != "$GOVERNED_SHA" ]; then
            echo "HEAD ($HEAD_SHA) is not the current tip of ${GOVERNED_BRANCH} ($GOVERNED_SHA)."
            echo "Production deploys only from a merged commit on the governed backend authority branch."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # CREDENTIAL-FREE BY DESIGN.
      #
      # This job runs BEFORE the `production` Environment gate, so it must not
      # hold production credentials — keeping them behind that gate is the
      # whole point of the gate. It therefore installs no Supabase CLI, reads
      # no secret or variable, and makes no remote call.
      #
      # The project-ref validation that used to live here needs
      # SUPABASE_PRODUCTION_PROJECT_REF, so it moved into
      # `approved-single-migration`, where the environment supplies it and
      # where it runs immediately before the write rather than long before it.

      # MIGRATION-ONLY MODE
      #
      # `function_name: none` runs the approved migration and deploys nothing.
      # It exists because the account-deletion campaign's first migration cannot
      # ride any function deploy: every existing production function is blocked
      # until exact-bundle rollback lands, and the two new functions
      # (deletion-status, reconcile-orphan-media) each depend on a LATER
      # migration in the same sequence. Without this mode there is no governed
      # path for the first migration at all.
      #
      # It removes ONE thing: the function deployment. Every governance control
      # -- manual dispatch, the DEPLOY TO PRODUCTION phrase, the production
      # Environment gate, the production ref check, the governed-commit check,
      # the reconciliation preflight, APPROVED_MIGRATION_VERSION enforcement and
      # the prohibited-SQL scan -- still applies, because they all live in jobs
      # and scripts this mode does not touch.
      #
      # A migration-only run with no approved migration would be a no-op wearing
      # a production deployment's clothes, so it is refused here rather than
      # allowed to look like a successful deploy.
      - name: Record deployment scope
        id: scope
        run: |
          set -euo pipefail
          FN="${{ inputs.function_name }}"
          if [ -z "$FN" ] || [ "$FN" = "all" ]; then
            echo "Invalid function_name"
            exit 1
          fi

          MIGRATION_ONLY=false
          if [ "$(printf '%s' "$FN" | tr '[:upper:]' '[:lower:]')" = "none" ]; then
            MIGRATION_ONLY=true
            if [ -z "${{ inputs.approved_migration_version }}" ]; then
              echo "function_name=none is migration-only: approved_migration_version is required"
              exit 1
            fi
            if [ "${{ inputs.approve_migration }}" != "YES" ]; then
              echo "function_name=none is migration-only: approve_migration must be YES"
              exit 1
            fi
            echo "MIGRATION-ONLY RUN: no Edge Function will be deployed."
          fi

          echo "function_name=${FN}" >> "$GITHUB_OUTPUT"
          echo "verify_jwt=${{ inputs.verify_jwt }}" >> "$GITHUB_OUTPUT"
          echo "migration_version=${{ inputs.approved_migration_version }}" >> "$GITHUB_OUTPUT"
          echo "migration_only=${MIGRATION_ONLY}" >> "$GITHUB_OUTPUT"

      - name: Static precheck and migration plan (no production credentials)
        env:
          # Empty in migration-only mode: parseDeployFunctionsAllowList() reads
          # that as "deploy nothing", which the preflight already supports.
          DEPLOY_FUNCTIONS: ${{ steps.scope.outputs.migration_only == 'true' && '' || inputs.function_name }}
          APPROVED_MIGRATION_VERSION: ${{ inputs.approved_migration_version }}
        run: |
          set -euo pipefail
          node scripts/production-deploy-preflight.mjs --static --json | tee preflight.json
          {
            echo "## Production deployment plan"
            echo
            echo "**This is what the required-reviewer approval below is approving.**"
            echo
            node -e "
              const r = require('./preflight.json');
              console.log('| Field | Value |');
              console.log('| --- | --- |');
              console.log(\`| Target (expected) | \${r.environment.expectedProductionRef} |\`);
              console.log(\`| Governed branch | \${r.governance.governedBranch} @ \${r.governance.sha} |\`);
              console.log(\`| Function to deploy | \${r.deployFunctions.join(', ') || '(none)'} |\`);
              console.log(\`| verify_jwt | ${{ inputs.verify_jwt }} |\`);
              console.log(\`| Migration to apply | \${r.approvedMigration ? r.approvedMigration.version + ' ' + r.approvedMigration.name : '(none)'} |\`);
              console.log(\`| Local migrations | \${r.localCount} |\`);
              console.log(\`| Precheck | \${r.mode} (credential-free: \${r.credentialFree}) |\`);
              console.log(\`| Remote verified here | \${r.remoteVerified} |\`);
            "
            echo
            echo "**Remote verification is deferred to \`environment: production\`.** Target identity,"
            echo "the staging refusal, the live ledger, already-applied and unexplained drift in"
            echo "either direction are checked by the \"Live remote preflight\" step and again by"
            echo "apply-production-migration.mjs, both immediately before the write and both"
            echo "after this approval. Approving means approving the plan above, not skipping them."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preflight artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-preflight-${{ github.run_number }}
          path: preflight.json
          retention-days: 90

  migration-plan:
    name: Migration plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - confirm
      - preflight
    outputs:
      apply: ${{ steps.plan.outputs.apply }}
    steps:
      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          VER="${{ needs.preflight.outputs.migration_version }}"
          APPROVE="${{ inputs.approve_migration }}"
          if [ -n "$VER" ] && [ "$APPROVE" = "YES" ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

  # Everything from here on can mutate production, so everything from here on
  # carries `environment: production` — this is the required-reviewer gate.
  # GitHub pauses the run here until an approver acts, with the preflight
  # job's summary (the plan above) already visible on the run.
  approved-single-migration:
    name: Approved single migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - confirm
      - preflight
      - migration-plan
    if: needs.migration-plan.outputs.apply == 'true'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse anything but the governed branch tip
        run: |
          set -euo pipefail
          git fetch origin "${GOVERNED_BRANCH}" --quiet
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${GOVERNED_BRANCH}")"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      # ---------------------------------------------------------------------
      # LIVE PRODUCTION GATE
      #
      # Everything below runs INSIDE `environment: production`: after the
      # required reviewer approved, with credentials the environment supplies,
      # and immediately before the write. This is where the remote validation
      # lives now. The pre-approval preflight job was made credential-free
      # because it runs OUTSIDE this gate — that moved WHERE these checks run,
      # not WHETHER they run. Nothing reaches "Apply one approved migration"
      # without passing every one of them against the live ledger.
      # ---------------------------------------------------------------------
      - name: Validate required production variables (values never printed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PRODUCTION_PROJECT_REF SUPABASE_PRODUCTION_URL SUPABASE_PRODUCTION_ANON_KEY; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required production variables:"
            printf -- '- %s\n' "${missing[@]}"
            echo "They must be defined on the production GitHub Environment."
            exit 1
          fi
          if [ "${SUPABASE_PRODUCTION_PROJECT_REF}" = "${STAGING_REF}" ]; then
            echo "Staging project ref is forbidden here"
            exit 1
          fi
          if [ "${SUPABASE_PRODUCTION_PROJECT_REF}" != "${EXPECTED_PRODUCTION_REF}" ]; then
            echo "SUPABASE_PRODUCTION_PROJECT_REF must be ${EXPECTED_PRODUCTION_REF}"
            exit 1
          fi

      # The full remote preflight, run against live production. Its own exit
      # code gates the write; the assertions afterwards additionally PROVE on
      # the run log that this report is a live remote one and that it selected
      # exactly the approved migration with zero unexplained drift, so a
      # --skip-remote or --static report can never be mistaken for this.
      - name: Live remote preflight against production (post-approval, pre-write)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
          DEPLOY_FUNCTIONS: ${{ needs.preflight.outputs.migration_only == 'true' && '' || needs.preflight.outputs.function_name }}
          APPROVED_MIGRATION_VERSION: ${{ needs.preflight.outputs.migration_version }}
        run: |
          set -euo pipefail
          node scripts/production-deploy-preflight.mjs --json | tee live-preflight.json
          EXPECTED_VERSION="${APPROVED_MIGRATION_VERSION}" \
          EXPECTED_REF="${EXPECTED_PRODUCTION_REF}" \
          FORBIDDEN_REF="${STAGING_REF}" \
          node -e "
            const r = require('./live-preflight.json');
            const m = r.migrations || {};
            const fail = (msg) => { console.error('LIVE GATE FAILED: ' + msg); process.exitCode = 1; };

            if (r.remoteVerified !== true || r.mode !== 'live-remote-gate') {
              fail('this report did not verify production remotely (mode=' + r.mode + ')');
            }
            if (r.environment.projectRef !== process.env.EXPECTED_REF) {
              fail('target is ' + r.environment.projectRef + ', not ' + process.env.EXPECTED_REF);
            }
            if (r.environment.projectRef === process.env.FORBIDDEN_REF) {
              fail('target is the staging project');
            }
            if (m.skipped === true) fail('the remote ledger was not read');
            if (typeof m.remoteCount !== 'number') fail('no live remote ledger count was reported');
            if ((m.unexplainedLocal || []).length !== 0) {
              fail('unexplained local drift: ' + m.unexplainedLocal.map(x => x.version).join(', '));
            }
            if ((m.unexplainedRemote || []).length !== 0) {
              fail('unexplained remote drift: ' + m.unexplainedRemote.join(', '));
            }
            if (!m.approvedPending || m.approvedPending.version !== process.env.EXPECTED_VERSION) {
              fail('selected migration is ' + (m.approvedPending ? m.approvedPending.version : '(none)') +
                   ', not the approved ' + process.env.EXPECTED_VERSION);
            }
            if (m.approvedSelectedForExecution !== 1) {
              fail('selected ' + m.approvedSelectedForExecution + ' migrations for execution, not exactly 1');
            }
            if (r.ok !== true) fail('preflight blockers: ' + (m.blockers || []).join('; '));

            if (!process.exitCode) {
              console.log('LIVE GATE PASSED against ' + r.environment.projectRef +
                ': remote ledger ' + m.remoteCount + ' rows, 0 unexplained local drift, ' +
                '0 unexplained remote drift, exactly 1 migration selected (' +
                m.approvedPending.version + ' ' + m.approvedPending.name + ').');
            }
          "

      - name: Apply one approved migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
          MIGRATION_VERSION: ${{ needs.preflight.outputs.migration_version }}
          APPROVE_PRODUCTION_MIGRATION: YES
        run: |
          set -euo pipefail
          node scripts/apply-production-migration.mjs | tee migration-result.json

      - name: Upload migration artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-migration-${{ github.run_number }}
          path: |
            live-preflight.json
            migration-result.json
            artifacts/production-migrations/
          if-no-files-found: warn
          retention-days: 90

  source-validation:
    name: Source validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - confirm
      - preflight
      - migration-plan
      - approved-single-migration
    if: |
      always() &&
      needs.preflight.outputs.migration_only != 'true' &&
      needs.preflight.result == 'success' &&
      (needs.approved-single-migration.result == 'success' || needs.approved-single-migration.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate function source exists
        run: |
          set -euo pipefail
          FN="${{ needs.preflight.outputs.function_name }}"
          test -f "supabase/functions/${FN}/index.ts"
          echo "source ok: ${FN}"

      - name: Deno check
        run: |
          set -euo pipefail
          FN="${{ needs.preflight.outputs.function_name }}"
          if command -v deno >/dev/null 2>&1; then
            deno check --node-modules-dir=none "supabase/functions/${FN}/index.ts"
          else
            curl -fsSL https://deno.land/install.sh | sh
            export DENO_INSTALL="$HOME/.deno"
            export PATH="$DENO_INSTALL/bin:$PATH"
            deno check --node-modules-dir=none "supabase/functions/${FN}/index.ts"
          fi

      - name: Edge-function source parity gate
        run: |
          set -euo pipefail
          if [ -f __tests__/edgeFunctionSourceParity.test.js ]; then
            node --test __tests__/edgeFunctionSourceParity.test.js
          else
            echo "no edge-function source parity gate present; skipping"
          fi

  deploy-one-function:
    name: Deploy one function
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - confirm
      - preflight
      - source-validation
    if: |
      always() &&
      needs.preflight.outputs.migration_only != 'true' &&
      needs.preflight.result == 'success' &&
      needs.source-validation.result == 'success'
    environment: production
    outputs:
      manifest_path: ${{ steps.deploy.outputs.manifest_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse anything but the governed branch tip
        run: |
          set -euo pipefail
          git fetch origin "${GOVERNED_BRANCH}" --quiet
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${GOVERNED_BRANCH}")"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Deploy function
        id: deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
          DEPLOY_FUNCTIONS: ${{ needs.preflight.outputs.function_name }}
          FUNCTION_NAME: ${{ needs.preflight.outputs.function_name }}
          EXPECTED_VERIFY_JWT: ${{ needs.preflight.outputs.verify_jwt }}
          APPROVED_MIGRATION_VERSION: ${{ needs.preflight.outputs.migration_version }}
          SKIP_PREFLIGHT_REMOTE: 'false'
        run: |
          set -euo pipefail
          node scripts/deploy-production-function.mjs | tee deploy-result.json
          MANIFEST="$(python3 -c "import json; print(json.load(open('deploy-result.json')).get('manifestPath',''))")"
          echo "manifest_path=${MANIFEST}" >> "$GITHUB_OUTPUT"

      - name: Upload deploy artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-deploy-${{ github.run_number }}
          path: |
            deploy-result.json
            artifacts/production-deployments/
          if-no-files-found: warn
          retention-days: 90

  health-check:
    name: Health check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - confirm
      - preflight
      - deploy-one-function
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.deploy-one-function.result == 'success'
    environment: production
    steps:
      - name: Probe deployed function
        env:
          SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
          FUNCTION_NAME: ${{ needs.preflight.outputs.function_name }}
        run: |
          set -euo pipefail
          BASE="${SUPABASE_PRODUCTION_URL%/}"
          FN="${FUNCTION_NAME}"
          CODE=$(curl -sS -o /tmp/opt.txt -w "%{http_code}" -X OPTIONS \
            -H "apikey: ${SUPABASE_PRODUCTION_ANON_KEY}" \
            "${BASE}/functions/v1/${FN}")
          test "$CODE" != "503"
          if grep -Eqi "service_role|eyJ|password|sbp_" /tmp/opt.txt; then
            echo "Response appears to leak sensitive material"
            exit 1
          fi

  synthetic-tests:
    name: Synthetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - confirm
      - preflight
      - health-check
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.health-check.result == 'success'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Run production deployment smoke tests
        run: |
          set -euo pipefail
          if [ -f __tests__/production/productionDeployPipeline.test.js ]; then
            node --test __tests__/production/productionDeployPipeline.test.js
          else
            echo "no production smoke-test suite present yet; skipping (does not block this run)"
          fi

  rollback-on-failure:
    name: Rollback on failure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - confirm
      - preflight
      - deploy-one-function
      - health-check
      - synthetic-tests
    if: |
      always() &&
      needs.deploy-one-function.result == 'success' &&
      (needs.health-check.result == 'failure' || needs.synthetic-tests.result == 'failure')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Download deployment manifest
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: production-deploy-${{ github.run_number }}
          path: .

      - name: Resolve manifest path
        id: manifest
        run: |
          set -euo pipefail
          MANIFEST="${{ needs.deploy-one-function.outputs.manifest_path }}"
          if [ -z "$MANIFEST" ] || [ ! -f "$MANIFEST" ]; then
            MANIFEST="$(find artifacts/production-deployments -name '*.json' -type f 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$MANIFEST" ] || [ ! -f "$MANIFEST" ]; then
            echo "No deployment manifest available for rollback"
            exit 1
          fi
          echo "path=${MANIFEST}" >> "$GITHUB_OUTPUT"
          echo "Using manifest: ${MANIFEST}"

      - name: Roll back / contain deployed function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/rollback-production-function.mjs --manifest "${{ steps.manifest.outputs.path }}" | tee rollback-result.json

      - name: Upload rollback artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-rollback-${{ github.run_number }}
          path: |
            rollback-result.json
            artifacts/production-rollbacks/
          if-no-files-found: warn
          retention-days: 90

      - name: Fail workflow after rollback/containment attempt
        run: |
          set -euo pipefail
          echo "Post-deployment validation failed; rollback/containment attempted. A human must review before retrying."
          exit 1

  publish-deployment-artifact:
    name: Publish deployment artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - confirm
      - preflight
      - approved-single-migration
      - deploy-one-function
      - health-check
      - synthetic-tests
      - rollback-on-failure
    if: always()
    steps:
      - name: Summary
        run: |
          set -euo pipefail
          MIGRATION_ONLY="${{ needs.preflight.outputs.migration_only }}"
          if [ "$MIGRATION_ONLY" = "true" ]; then
            MODE=migration-only
            FUNCTION_DEPLOYMENT=SKIPPED_MIGRATION_ONLY
          else
            MODE=function+migration
            FUNCTION_DEPLOYMENT="${{ needs.deploy-one-function.result }}"
          fi
          {
            echo "## Controlled production deployment"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Mode | ${MODE} |"
            echo "| Function | ${{ needs.preflight.outputs.function_name }} |"
            echo "| Migration applied | ${{ needs.preflight.outputs.migration_version || '(none)' }} |"
            echo "| Migration job | ${{ needs.approved-single-migration.result }} |"
            echo "| FUNCTION_DEPLOYMENT | ${FUNCTION_DEPLOYMENT} |"
            echo "| Health | ${{ needs.health-check.result }} |"
            echo "| Synthetic | ${{ needs.synthetic-tests.result }} |"
            echo "| Rollback/containment | ${{ needs.rollback-on-failure.result }} |"
            echo "| Manifest | ${{ needs.deploy-one-function.outputs.manifest_path }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # A migration-only run is judged on the migration alone. The function
          # jobs are SKIPPED by design, so treating "not success" as failure
          # would fail every migration-only run.
          if [ "$MIGRATION_ONLY" = "true" ]; then
            if [ "${{ needs.approved-single-migration.result }}" != "success" ]; then
              echo "Migration-only run: the approved migration did not succeed"
              exit 1
            fi
            echo "Migration-only run complete: FUNCTION_DEPLOYMENT=SKIPPED_MIGRATION_ONLY"
            exit 0
          fi

          if [ "${{ needs.deploy-one-function.result }}" != "success" ]; then
            echo "Deploy failed"
            exit 1
          fi
          if [ "${{ needs.health-check.result }}" != "success" ] || [ "${{ needs.synthetic-tests.result }}" != "success" ]; then
            echo "Post-deployment validation failed"
            if [ "${{ needs.rollback-on-failure.result }}" != "success" ]; then
              echo "Rollback/containment did not succeed — workflow failed"
            fi
            exit 1
          fi
