# Bounded paid live probe for Build 35 OC-01 + Corporate Intelligence v2 +
# Scanner VRI-03 (owner-approved: <= 12 billable calls, <= $5 in total).
#
# Staging only. Follows the existing live-probe pattern: one narrow script,
# staging environment, sanitized JSON artifact (Elise reply text sealed).
# The push trigger exists only to register the workflow on this branch: the
# paid job runs ONLY on an explicit workflow_dispatch.

name: K Scan Staging Build 35 Feature Live Probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: paid = bounded paid probe; serper_history = zero-spend log summary
        required: true
        default: serper_history
        type: choice
        options:
          - serper_history
          - paid
  push:
    branches:
      - test/build35-feature-live-probe-v1

permissions:
  contents: read

concurrency:
  group: kscan-build35-feature-live-probe
  cancel-in-progress: false

jobs:
  live-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run the bounded Build 35 feature probe
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SYNTHETIC_ACTIVE_EMAIL: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_EMAIL }}
          STAGING_SYNTHETIC_ACTIVE_PASSWORD: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_PASSWORD }}
          PROBE_MODE: ${{ inputs.mode }}
        run: node security/release/run-build35-feature-live-probe.js

      - name: Print sanitized evidence
        if: always()
        run: test -s build35-feature-live-probe-report.json && cat build35-feature-live-probe-report.json

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build35-feature-live-probe-${{ github.run_id }}
          path: build35-feature-live-probe-report.json
          if-no-files-found: warn
          retention-days: 30
