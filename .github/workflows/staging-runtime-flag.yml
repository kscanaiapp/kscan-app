name: K Scan Staging Runtime Flag

# Governed staging runtime-flag configuration (DEF-B29-SVV-004).
#
# Phase 7 ships dark: its source is in Build 29, but the running staging
# scanner only enables it when SCAN_IDENTIFICATION_RECHECK_ENABLED is true in
# the Edge Function environment. This workflow is the ONLY governed way to set
# it, and it is deliberately not a general secret setter: the key and the value
# are both closed choice lists here, and the writer enforces its own allowlist
# independently, so widening either requires a reviewed code change.
#
# ENVIRONMENT AUTHORITY: the staging project ref comes from
# security/scripts/lib/environment-authority.js and is NOT an input, so a
# caller cannot aim this at a project. Production is an explicit deny inside
# the writer, checked before any command is built.
#
# This never touches KSCAN release-identity metadata, and never mobile/EAS
# configuration: the flag is server-side Edge Function state.

on:
  workflow_dispatch:
    inputs:
      flag:
        description: 'Staging runtime flag to set'
        required: true
        default: SCAN_IDENTIFICATION_RECHECK_ENABLED
        type: choice
        options:
          - SCAN_IDENTIFICATION_RECHECK_ENABLED
          - ELISE_ROOM_INTELLIGENCE_V1_ENABLED
      value:
        description: 'Value to set'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          # 'false' exists so E4.1 can be rolled back through this same governed
          # path if certification fails. The writer still refuses 'false' for
          # any flag whose allowlist does not include it.
          - 'false'
      confirm:
        description: 'Type SET-STAGING-RUNTIME-FLAG to permit the write.'
        required: true
        default: ''
      mode:
        description: 'PLAN_ONLY (writes nothing) or EXECUTE'
        required: true
        default: PLAN_ONLY
        type: choice
        options:
          - PLAN_ONLY
          - EXECUTE

permissions:
  contents: read

concurrency:
  group: kscan-staging-runtime-flag
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  set-flag:
    name: Set staging runtime flag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: staging
    steps:
      - name: Checkout canonical staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: staging/production-parity

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '20'

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Confirm environment authority
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          set -euo pipefail
          node -e "
            const a = require('./security/scripts/lib/environment-authority.js');
            a.assertExpectedEnvironment('staging', process.env.SUPABASE_STAGING_PROJECT_REF);
            console.log('environment authority: staging confirmed');
          "

      - name: Apply staging runtime flag
        env:
          # The token is available to the writer through the environment only;
          # it is never an argv element and is never echoed.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FLAG: ${{ inputs.flag }}
          VALUE: ${{ inputs.value }}
          CONFIRM: ${{ inputs.confirm }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          PLAN=""
          if [ "$MODE" != "EXECUTE" ]; then PLAN="--plan-only"; fi
          node security/release/set-staging-runtime-flag.mjs \
            --key "$FLAG" \
            --value "$VALUE" \
            --confirm "$CONFIRM" \
            $PLAN
