# Bounded live probe for SEC-B35-KPLUS-001 (K+ Early Access server hold).
#
# Follows the existing live-probe pattern (staging-build33-closeout-live-
# probe.yml): staging environment, one narrow script, sanitized JSON artifact.
# It tests whatever kplus-activate is currently deployed on staging over HTTP.
# It does not deploy, does not touch a migration, creates no account, writes no
# row, calls no AI/commerce provider and never reads a secret VALUE (only the
# NAMES of the two campaign controls, to prove they are not set).
#
# At most 5 HTTP calls to staging kplus-activate (anonymous, invalid token,
# non-POST, and two authenticated POSTs) plus read-only Management API reads.

name: K Scan Staging K+ Activate Hold Live Probe

on:
  workflow_dispatch: {}
  # Scoped to this exact probe branch only, so the file can self-register and
  # run without first landing on the default branch (a workflow_dispatch-only
  # file cannot be dispatched until GitHub has observed it via a push or
  # pull_request event). This is the only branch that can ever satisfy this
  # condition; it has no effect on any other branch, PR, or the deploy
  # authority itself. Same precedent as staging-build33-closeout-live-probe.yml.
  push:
    branches:
      - test/build35-kplus-activate-hold-live-probe-v1

permissions:
  contents: read

concurrency:
  group: kscan-kplus-activate-hold-live-probe
  cancel-in-progress: false

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run the bounded K+ Early Access hold proof
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SYNTHETIC_ACTIVE_EMAIL: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_EMAIL }}
          STAGING_SYNTHETIC_ACTIVE_PASSWORD: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_PASSWORD }}
        run: node security/release/run-kplus-activate-hold-live-probe.js

      - name: Print sanitized evidence
        if: always()
        run: test -s kplus-activate-hold-live-probe-report.json && cat kplus-activate-hold-live-probe-report.json

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kplus-activate-hold-live-probe-${{ github.run_id }}
          path: kplus-activate-hold-live-probe-report.json
          if-no-files-found: warn
          retention-days: 30
