# Phase 1 report-only security pipeline for code, secrets, dependencies, and project checks.
# Findings do not fail jobs. Install/config/report operational failures do fail.
# SHA pinning note: actions below use reviewed release tags resolved to full commit SHAs
# from official GitHub release refs on 2026-07-26. Re-verify before Phase 2 enforcement.

name: Security - Code and Dependencies

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  project-checks:
    name: Project checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # __tests__/mirrorIosVisionParity.test.js does `git show <old-sha>:app.json`
          # against a fixed historical commit to diff permission/entitlement drift.
          # actions/checkout's default fetch-depth: 1 doesn't have that commit, so
          # the test throws `fatal: path 'app.json' exists on disk, but not in
          # <sha>` on every run here. Full history makes that lookup possible.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Deno
        uses: denoland/setup-deno@4606d5cc6fb3f673efd4f594850e3f4b3e9d29cd # v2.0.0

      # Track B integration gates. These are deliberately direct commands so
      # failures cannot be hidden behind a narrow npm-script selection.
      - name: Run full regression suite
        run: node scripts/run-all-tests.js

      - name: Run governed backend Deno suite
        run: node scripts/run-backend-tests.js

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck StyleChat Edge Function
        run: deno check supabase/functions/stylechat-generate/index.ts

      - name: Verify Edge Function parity
        run: node scripts/check-edge-function-parity.js

      - name: Verify Edge Function manifest currency
        run: node scripts/generate-edge-function-manifest.js --check

      - name: Run existing privacy unit tests
        run: npm run test:privacy

      - name: Run existing auth privacy unit tests
        run: npm run test:auth-privacy

      - name: Run existing verify-supabase helper unit tests
        run: npm run test:verify-supabase

      - name: Run existing analyze-contract unit tests
        run: npm run test:analyze-contract

      # security/scripts/evaluate-promotion-gate.js previously required a
      # check named 'Security baseline comparison' that no job anywhere
      # produced — __tests__/security/baselineComparison.test.js existed and
      # `npm run test:security` ran it, but no workflow step ever called that
      # script, so the promotion gate could never find it. Running it here
      # closes the coverage gap rather than dropping the requirement.
      - name: Run existing security baseline comparison tests
        run: npm run test:security

      - name: Write project-checks summary
        if: always()
        env:
          SCANNER_NAME: project-checks
          SCANNER_VERSION: node-24 / npm-ci / existing package.json scripts
          START_TIME: ${{ github.event.repository.updated_at }}
          END_TIME: ${{ github.event.head_commit.timestamp }}
          FINDING_COUNTS: '{"job":"see-logs"}'
          REPORT_ONLY_VERDICT: EXISTING_TESTS_ENFORCED
          EXTRA_NOTES: |
            Existing package.json scripts executed (no invented scripts):
            - test:privacy
            - test:auth-privacy
            - test:verify-supabase
            - test:analyze-contract
            - test:security
            Absent scripts were skipped (typecheck, lint, test, test:unit, test:integration,
            test:inventory, verify:test-inventory, verify:security).
            Existing test failures fail this job (not report-only).
        run: node security/scripts/write-security-summary.js

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install official Gitleaks binary
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (report-only findings)
        id: gitleaks
        run: |
          set -euo pipefail
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "start_time=${START_TIME}" >> "$GITHUB_OUTPUT"
          set +e
          gitleaks detect \
            --source . \
            --report-path gitleaks-results.json \
            --report-format json \
            --redact=100 \
            --exit-code 1
          CODE=$?
          set -e
          END_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "end_time=${END_TIME}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"
          if [ ! -f gitleaks-results.json ]; then
            echo "Operational failure: gitleaks-results.json missing"
            exit 2
          fi
          python3 - <<'PY'
          import json,sys
          json.load(open("gitleaks-results.json", encoding="utf-8"))
          print("gitleaks-results.json: valid JSON")
          PY
          if [ "$CODE" -eq 0 ] || [ "$CODE" -eq 1 ]; then
            echo "Gitleaks completed (findings report-only)."
            exit 0
          fi
          echo "Operational failure: Gitleaks exited with code ${CODE}"
          exit "$CODE"

      - name: Summarize Gitleaks findings
        if: always() && hashFiles('gitleaks-results.json') != ''
        env:
          SCANNER_NAME: Gitleaks
          SCANNER_VERSION: 8.30.1
          START_TIME: ${{ steps.gitleaks.outputs.start_time }}
          END_TIME: ${{ steps.gitleaks.outputs.end_time }}
          SUMMARY_FILE: gitleaks-summary.md
        run: |
          set -euo pipefail
          COUNT="$(python3 - <<'PY'
          import json
          data=json.load(open("gitleaks-results.json", encoding="utf-8"))
          print(len(data) if isinstance(data, list) else 0)
          PY
          )"
          if [ "$COUNT" -gt 0 ]; then
            VERDICT="FINDINGS_REPORTED"
          else
            VERDICT="NO_FINDINGS"
          fi
          export FINDING_COUNTS="{\"findings\":${COUNT}}"
          export REPORT_ONLY_VERDICT="${VERDICT}"
          node security/scripts/write-security-summary.js
          {
            echo "# Gitleaks summary"
            echo
            echo "Findings (redacted report): ${COUNT}"
            echo
            echo "Secret values are redacted in the JSON report. Do not print recovered secrets."
          } > gitleaks-summary.md

      - name: Upload Gitleaks artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report-${{ github.run_number }}
          path: |
            gitleaks-results.json
            gitleaks-summary.md
          if-no-files-found: error
          retention-days: 30

  semgrep:
    name: Semgrep Community Edition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Validate custom Semgrep rules
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}:/src" -w /src semgrep/semgrep:1.171.0 \
            semgrep --validate --config=.semgrep/kscan-security.yml

      - name: Run Semgrep (report-only findings)
        id: semgrep
        run: |
          set -euo pipefail
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "start_time=${START_TIME}" >> "$GITHUB_OUTPUT"
          VERSION="$(docker run --rm semgrep/semgrep:1.171.0 semgrep --version | head -n 1)"
          echo "scanner_version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Standalone CE via official container; no paid Semgrep Cloud upload.
          # Use --json-output/--text-output for dual reports. Do NOT combine
          # --json/--output with --text/--text-output: --output then receives text
          # and JSON validation fails (GitHub run 30217644558).
          # --no-error keeps findings report-only; engine/config failures still fail.
          set +e
          docker run --rm -v "${PWD}:/src" -w /src semgrep/semgrep:1.171.0 \
            semgrep scan \
              --config=p/default \
              --config=p/javascript \
              --config=p/typescript \
              --config=p/react \
              --config=p/nodejs \
              --config=p/github-actions \
              --config=p/secrets \
              --config=.semgrep/kscan-security.yml \
              --exclude=node_modules \
              --exclude=.git \
              --exclude=coverage \
              --exclude=dist \
              --exclude=build \
              --exclude=.expo \
              --exclude=ios/Pods \
              --exclude=android/.gradle \
              --exclude=android/app/build \
              --exclude=_audit_snapshots \
              --exclude=security/reports \
              --no-error \
              --json-output=semgrep-results.json \
              --text-output=semgrep-results.txt
          CODE=$?
          set -e
          END_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "end_time=${END_TIME}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"
          if [ ! -f semgrep-results.json ]; then
            echo "Operational failure: semgrep-results.json missing"
            exit 2
          fi
          if [ ! -f semgrep-results.txt ]; then
            echo "Operational failure: semgrep-results.txt missing"
            exit 2
          fi
          python3 - <<'PY'
          import json
          data=json.load(open("semgrep-results.json", encoding="utf-8"))
          assert isinstance(data, dict), "semgrep JSON must be an object"
          assert "results" in data, "semgrep JSON missing results"
          print("semgrep-results.json: valid")
          print(f"findings={len(data.get('results', []))}")
          PY
          if [ "$CODE" -ne 0 ]; then
            echo "Operational failure: Semgrep exited with code ${CODE}"
            exit "$CODE"
          fi

      - name: Summarize Semgrep findings
        if: always() && hashFiles('semgrep-results.json') != ''
        env:
          SCANNER_NAME: Semgrep Community Edition
          START_TIME: ${{ steps.semgrep.outputs.start_time }}
          END_TIME: ${{ steps.semgrep.outputs.end_time }}
          SCANNER_VERSION: ${{ steps.semgrep.outputs.scanner_version }}
          SUMMARY_FILE: semgrep-summary.md
        run: |
          set -euo pipefail
          COUNTS="$(python3 - <<'PY'
          import json,collections
          data=json.load(open("semgrep-results.json", encoding="utf-8"))
          c=collections.Counter()
          for r in data.get("results", []):
              sev=(r.get("extra",{}) or {}).get("severity") or r.get("severity") or "UNKNOWN"
              c[str(sev).upper()] += 1
          print(json.dumps(dict(c)))
          PY
          )"
          TOTAL="$(python3 - <<'PY'
          import json
          data=json.load(open("semgrep-results.json", encoding="utf-8"))
          print(len(data.get("results", [])))
          PY
          )"
          if [ "$TOTAL" -gt 0 ]; then VERDICT="FINDINGS_REPORTED"; else VERDICT="NO_FINDINGS"; fi
          export FINDING_COUNTS="${COUNTS}"
          export REPORT_ONLY_VERDICT="${VERDICT}"
          node security/scripts/write-security-summary.js

      - name: Upload Semgrep artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report-${{ github.run_number }}
          path: |
            semgrep-results.json
            semgrep-results.txt
            semgrep-summary.md
          if-no-files-found: error
          retention-days: 30

  osv:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install official OSV-Scanner CLI
        env:
          OSV_VERSION: "2.4.0"
          # Published in osv-scanner_SHA256SUMS on the official v2.4.0 release.
          OSV_LINUX_AMD64_SHA256: "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o /tmp/osv-scanner
          printf '%s  %s\n' "${OSV_LINUX_AMD64_SHA256}" /tmp/osv-scanner | sha256sum --check --strict -
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Run OSV-Scanner (report-only findings)
        id: osv
        run: |
          set -euo pipefail
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "start_time=${START_TIME}" >> "$GITHUB_OUTPUT"
          VERSION="$(osv-scanner --version | head -n 1)"
          echo "scanner_version=${VERSION}" >> "$GITHUB_OUTPUT"

          # OSV-Scanner v2.x: `scan source` + --lockfile + --output-file
          # PR-oriented mode when practical: still produce a full machine-readable lockfile report.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "Pull request event: scanning package-lock.json (full lockfile report)."
          else
            echo "Push/manual event: full lockfile report."
          fi

          set +e
          osv-scanner scan source --lockfile=./package-lock.json --format json --output-file osv-results.json
          CODE=$?
          set -e
          set +e
          osv-scanner scan source --lockfile=./package-lock.json --format table --output-file osv-results.txt
          TXT_CODE=$?
          set -e

          END_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "end_time=${END_TIME}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"

          if [ ! -f osv-results.json ]; then
            echo "Operational failure: osv-results.json missing"
            exit 2
          fi
          python3 - <<'PY'
          import json
          data=json.load(open("osv-results.json", encoding="utf-8"))
          assert isinstance(data, dict), "osv JSON must be an object"
          print("osv-results.json: valid JSON")
          PY

          # OSV: 0 = no vulns, 1 = vulns found (report-only), other = operational failure.
          if [ "$CODE" -eq 0 ] || [ "$CODE" -eq 1 ]; then
            if [ ! -f osv-results.txt ]; then
              echo "OSV table output missing; writing placeholder from JSON."
              python3 -c 'import json; data=json.load(open("osv-results.json", encoding="utf-8")); results=data.get("results") or []; open("osv-results.txt", "w", encoding="utf-8").write(f"OSV results entries: {len(results)}\n")'
            fi
            exit 0
          fi
          echo "Operational failure: OSV-Scanner exited with code ${CODE} (table exit ${TXT_CODE})"
          exit "$CODE"

      - name: Summarize OSV findings
        if: always() && hashFiles('osv-results.json') != ''
        env:
          SCANNER_NAME: OSV-Scanner
          SCANNER_VERSION: ${{ steps.osv.outputs.scanner_version }}
          START_TIME: ${{ steps.osv.outputs.start_time }}
          END_TIME: ${{ steps.osv.outputs.end_time }}
          SUMMARY_FILE: osv-summary.md
        run: |
          set -euo pipefail
          COUNTS="$(python3 - <<'PY'
          import json
          data=json.load(open("osv-results.json", encoding="utf-8"))
          vulns=0
          for result in data.get("results") or []:
              for pkg in result.get("packages") or []:
                  vulns += len(pkg.get("vulnerabilities") or [])
          print(json.dumps({"vulnerabilities": vulns}))
          PY
          )"
          TOTAL="$(python3 - <<'PY'
          import json
          data=json.load(open("osv-results.json", encoding="utf-8"))
          vulns=0
          for result in data.get("results") or []:
              for pkg in result.get("packages") or []:
                  vulns += len(pkg.get("vulnerabilities") or [])
          print(vulns)
          PY
          )"
          if [ "$TOTAL" -gt 0 ]; then VERDICT="FINDINGS_REPORTED"; else VERDICT="NO_FINDINGS"; fi
          export FINDING_COUNTS="${COUNTS}"
          export REPORT_ONLY_VERDICT="${VERDICT}"
          node security/scripts/write-security-summary.js

      - name: Upload OSV artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-report-${{ github.run_number }}
          path: |
            osv-results.json
            osv-results.txt
            osv-summary.md
          if-no-files-found: error
          retention-days: 30

  trivy:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy FS scan (JSON, report-only findings)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          exit-code: "0"
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,.git,coverage,dist,build,.expo,ios/Pods,android/.gradle,android/app/build,security/reports

      - name: Run Trivy FS scan (table text)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-results.txt
          exit-code: "0"
          scanners: vuln,secret,misconfig
          skip-dirs: node_modules,.git,coverage,dist,build,.expo,ios/Pods,android/.gradle,android/app/build,security/reports

      - name: Validate Trivy reports
        id: trivy_validate
        run: |
          set -euo pipefail
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "start_time=${START_TIME}" >> "$GITHUB_OUTPUT"
          if [ ! -f trivy-results.json ] || [ ! -f trivy-results.txt ]; then
            echo "Operational failure: expected Trivy reports missing"
            echo "A vulnerability-database outage may require rerunning this workflow."
            exit 2
          fi
          python3 - <<'PY'
          import json
          data=json.load(open("trivy-results.json", encoding="utf-8"))
          assert data is not None
          print("trivy-results.json: valid JSON")
          PY
          END_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "end_time=${END_TIME}" >> "$GITHUB_OUTPUT"
          VERSION="$(trivy --version 2>/dev/null | head -n 1 || echo unknown)"
          echo "scanner_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Summarize Trivy findings
        if: always() && hashFiles('trivy-results.json') != ''
        env:
          SCANNER_NAME: Trivy
          SCANNER_VERSION: ${{ steps.trivy_validate.outputs.scanner_version }}
          START_TIME: ${{ steps.trivy_validate.outputs.start_time }}
          END_TIME: ${{ steps.trivy_validate.outputs.end_time }}
          SUMMARY_FILE: trivy-summary.md
          EXTRA_NOTES: |
            Vulnerability-database outages may require rerunning the workflow.
            SARIF upload to GitHub code scanning is intentionally not required.
        run: |
          set -euo pipefail
          COUNTS="$(python3 - <<'PY'
          import json,collections
          data=json.load(open("trivy-results.json", encoding="utf-8"))
          c=collections.Counter()
          for result in data.get("Results") or []:
              for key in ("Vulnerabilities","Misconfigurations","Secrets"):
                  for item in result.get(key) or []:
                      sev=item.get("Severity") or "UNKNOWN"
                      c[str(sev).upper()] += 1
          print(json.dumps(dict(c)))
          PY
          )"
          TOTAL="$(python3 - <<'PY'
          import json
          data=json.load(open("trivy-results.json", encoding="utf-8"))
          total=0
          for result in data.get("Results") or []:
              for key in ("Vulnerabilities","Misconfigurations","Secrets"):
                  total += len(result.get(key) or [])
          print(total)
          PY
          )"
          if [ "$TOTAL" -gt 0 ]; then VERDICT="FINDINGS_REPORTED"; else VERDICT="NO_FINDINGS"; fi
          export FINDING_COUNTS="${COUNTS}"
          export REPORT_ONLY_VERDICT="${VERDICT}"
          node security/scripts/write-security-summary.js

      - name: Upload Trivy artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report-${{ github.run_number }}
          path: |
            trivy-results.json
            trivy-results.txt
            trivy-summary.md
          if-no-files-found: error
          retention-days: 30

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (report-only vulnerability exit)
        id: npm_audit
        run: |
          set -euo pipefail
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "start_time=${START_TIME}" >> "$GITHUB_OUTPUT"
          set +e
          npm audit --json > npm-audit.json 2>npm-audit.stderr
          CODE=$?
          set -e
          END_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "end_time=${END_TIME}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "npm_version=$(npm --version)" >> "$GITHUB_OUTPUT"

          if [ ! -s npm-audit.json ]; then
            echo "Operational failure: npm-audit.json missing or empty"
            cat npm-audit.stderr || true
            exit 2
          fi

          python3 - <<'PY'
          import json,sys
          try:
              data=json.load(open("npm-audit.json", encoding="utf-8"))
          except Exception as e:
              print(f"Operational failure: npm-audit.json is not valid JSON: {e}")
              sys.exit(2)
          if not isinstance(data, dict):
              print("Operational failure: npm-audit.json root must be an object")
              sys.exit(2)
          # Distinguish registry/metadata failures from ordinary vulnerability results.
          if data.get("error"):
              print("Operational failure: npm audit returned an error object")
              print(json.dumps(data.get("error"), indent=2)[:2000])
              sys.exit(3)
          print("npm-audit.json: valid JSON")
          PY

          # npm audit exits nonzero when vulnerabilities exist; keep that report-only.
          if [ "$CODE" -eq 0 ] || [ "$CODE" -eq 1 ]; then
            exit 0
          fi
          echo "Operational failure: npm audit exited with unexpected code ${CODE}"
          cat npm-audit.stderr || true
          exit "$CODE"

      - name: Write npm audit summary
        if: always() && hashFiles('npm-audit.json') != ''
        env:
          SCANNER_NAME: npm audit
          SCANNER_VERSION: ${{ steps.npm_audit.outputs.npm_version }}
          START_TIME: ${{ steps.npm_audit.outputs.start_time }}
          END_TIME: ${{ steps.npm_audit.outputs.end_time }}
          SUMMARY_FILE: npm-audit-summary.md
          EXTRA_NOTES: |
            npm severity does not prove application exploitability.
            Classify later as: MOBILE RUNTIME, BACKEND RUNTIME, BUILD/CI,
            DEVELOPMENT ONLY, TEST ONLY, FALSE POSITIVE, or UNVERIFIED.
            Do not run npm audit fix or npm audit fix --force in this pipeline.
        run: |
          set -euo pipefail
          COUNTS="$(python3 - <<'PY'
          import json
          data=json.load(open("npm-audit.json", encoding="utf-8"))
          meta=(data.get("metadata") or {}).get("vulnerabilities") or {}
          print(json.dumps({k: meta.get(k, 0) for k in ["info","low","moderate","high","critical","total"]}))
          PY
          )"
          TOTAL="$(python3 - <<'PY'
          import json
          data=json.load(open("npm-audit.json", encoding="utf-8"))
          meta=(data.get("metadata") or {}).get("vulnerabilities") or {}
          print(int(meta.get("total") or 0))
          PY
          )"
          if [ "$TOTAL" -gt 0 ]; then VERDICT="FINDINGS_REPORTED"; else VERDICT="NO_FINDINGS"; fi
          export FINDING_COUNTS="${COUNTS}"
          export REPORT_ONLY_VERDICT="${VERDICT}"
          node security/scripts/write-security-summary.js

      - name: Upload npm audit artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-report-${{ github.run_number }}
          path: |
            npm-audit.json
            npm-audit-summary.md
          if-no-files-found: error
          retention-days: 30

  security-summary:
    name: Security summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - project-checks
      - gitleaks
      - semgrep
      - osv
      - trivy
      - npm-audit
    steps:
      - name: Write aggregate summary
        env:
          PROJECT_CHECKS: ${{ needs.project-checks.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          OSV: ${{ needs.osv.result }}
          TRIVY: ${{ needs.trivy.result }}
          NPM_AUDIT: ${{ needs.npm-audit.result }}
        run: |
          set -euo pipefail
          {
            echo "## Security - Code and Dependencies (aggregate)"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| project-checks | ${PROJECT_CHECKS} |"
            echo "| gitleaks | ${GITLEAKS} |"
            echo "| semgrep | ${SEMGREP} |"
            echo "| osv | ${OSV} |"
            echo "| trivy | ${TRIVY} |"
            echo "| npm-audit | ${NPM_AUDIT} |"
            echo
            echo "Phase 1: security findings are report-only."
            echo "Operational failures (install/config/missing reports) fail their scanner jobs."
            echo "Existing project tests retain normal failing behavior."
            echo
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo "Run ID: ${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

          FAIL=0
          for RESULT in "$PROJECT_CHECKS" "$GITLEAKS" "$SEMGREP" "$OSV" "$TRIVY" "$NPM_AUDIT"; do
            if [ "$RESULT" != "success" ]; then
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "One or more required jobs did not succeed. Aggregate summary recorded; failing to surface operational/test failures."
            exit 1
          fi
