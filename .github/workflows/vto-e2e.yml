# VTO backend E2E certification harness.
#
# `contract` runs automatically on every push/PR (no live staging mutation).
# `staging-dryrun`, `staging-full-certification` and `cleanup` are
# workflow_dispatch only, target the governed "staging" GitHub environment,
# and never run on a normal PR/push — see scripts/vto-e2e/run.mjs for the
# harness itself.
#
# `defaults.run.shell: bash` below is load-bearing, not stylistic: GitHub
# Actions' UNDECLARED default shell on Linux runners is `bash -e {0}` —
# WITHOUT `-o pipefail`. A step shaped like `node run.mjs | tee report.json`
# then exits with tee's status (near-always 0) instead of node's, so a
# failed certification run can report SUCCESS. Naming `bash` here switches
# every step in this workflow to `bash --noprofile --norc -eo pipefail {0}`,
# which propagates the failure of any piped command. See
# scripts/vto-e2e/lib/workflow-guard.mjs (exercised by
# __tests__/vtoE2eHarnessIntegrity.test.js), which parses this file and
# fails the contract-mode test suite if a certification-critical pipeline
# is ever reintroduced without pipefail-safe shell semantics.

name: VTO Backend E2E

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Harness mode to run
        required: true
        default: contract
        type: choice
        options:
          - contract
          - staging-dryrun
          - staging-full-certification
          - cleanup
      confirm_paid_certification:
        description: Must be YES to run staging-full-certification (the one authorized real-provider paid request)
        required: false
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'
      run_tag:
        description: Run tag to target for cleanup mode recovery (optional — omit for dryrun/full-certification, which generate their own)
        required: false
        default: ''
        type: string
      user_ids:
        description: Comma-separated auth.users UUID(s) for cleanup mode incident targeting (optional — use when a specific orphaned actor id is already known from evidence, e.g. a prior run's crash log, rather than its run tag). Cleanup mode requires run_tag and/or user_ids.
        required: false
        default: ''
        type: string
      commit_sha:
        description: Exact 40-hex commit SHA to fetch the committed garment fixture from (required for staging-full-certification)
        required: false
        default: ''
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # No live staging mutation. Runs on every push/PR, and on a manual dispatch
  # with mode=contract (the default).
  contract:
    name: VTO E2E — contract
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'contract'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run harness contract mode
        run: node scripts/vto-e2e/run.mjs --mode=contract

  # ── The Android half of the native runtime, BUILT AND TESTED ────────────
  #
  # WHY THIS JOB EXISTS. `live-vto-ios-native-catchup.yml` compiles and tests
  # the iOS half of `modules/kscan-live-vto-native/` on every PR that touches
  # it. There was no equivalent for Android at all: the Kotlin runtime -- the
  # geometry stack, the session state machine, the perception session, the
  # camera controller, the tracking-quality contract -- had ZERO continuous
  # integration, so a Kotlin compile error or a broken conformance golden
  # could only be found by someone running Gradle by hand. Mission section 38
  # requires both platforms build-proven; this is the Android side of that.
  #
  # UNIT TESTS, NOT AN INSTALLABLE. `testDebugUnitTest` compiles the WHOLE
  # module (main + test source sets, against the real MediaPipe Tasks Vision
  # and CameraX artifacts) and executes the JVM suite, which is exactly the
  # authority Android's zero-Android-import geometry/tracking stack was
  # designed to be checkable by. Assembling an APK is a separate, much
  # heavier question and is not what this gate answers.
  #
  # THE JUNIT TALLY IS THE EVIDENCE, NOT "BUILD SUCCESSFUL". A wrapper that
  # prints a success line with zero executed tests is a false green -- this
  # program has hit that exact failure mode before -- so the last step reads
  # the JUnit XML and fails on a zero count, on any failure, and on any error,
  # independently of Gradle's own exit status.
  android-native:
    name: VTO Live — Android native module (compile + JVM tests)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Setup JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      # Expo autolinking resolves the module list from node_modules at
      # settings-plugin time, so the JS dependency tree has to exist before
      # Gradle can configure the project at all.
      - name: Install dependencies
        run: npm ci

      - name: Compile and run the module's JVM test suite
        working-directory: android
        run: ./gradlew :kscan-live-vto-native:testDebugUnitTest --console=plain --stacktrace

      - name: Assert the JUnit report is real
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const root = "modules/kscan-live-vto-native/android/build/test-results";
            const files = [];
            (function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.name.startsWith("TEST-") && entry.name.endsWith(".xml")) files.push(full);
              }
            })(root);
            let tests = 0, failures = 0, errors = 0;
            for (const file of files) {
              const head = (fs.readFileSync(file, "utf8").match(/<testsuite[^>]*>/) || [""])[0];
              const num = (key) => Number((head.match(new RegExp(key + "=\"(\\d+)\"")) || [0, 0])[1]);
              tests += num("tests"); failures += num("failures"); errors += num("errors");
            }
            console.log(`JUnit reports=${files.length} tests=${tests} failures=${failures} errors=${errors}`);
            if (files.length === 0) { console.error("::error::no JUnit report was produced -- the suite did not run"); process.exit(1); }
            if (tests === 0) { console.error("::error::the suite reported ZERO executed tests -- that is a false green, not a pass"); process.exit(1); }
            if (failures > 0 || errors > 0) { console.error("::error::the Android native suite failed"); process.exit(1); }
          '

      - name: Upload the JUnit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vto-android-native-test-results-${{ github.run_number }}
          path: modules/kscan-live-vto-native/android/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 14

  # ── The VTO mutation boundary, ENFORCED ─────────────────────────────────
  #
  # This job is the one execution point in the repository that declares
  # itself a VTO lane, and it is deliberately here rather than in a general
  # PR workflow.
  #
  # scripts/check-vto-live-integration-scope.js has two halves. Its STATIC
  # half -- manifest justification, matcher, protected-path refusal -- is a
  # policy control about the whole repository and keeps running on every
  # branch inside 'Project checks' (scripts/run-all-tests.js). Its LIVE half
  # diffs a branch against the VTO integration base and refuses anything the
  # manifest does not authorize, which is only a meaningful question on a
  # lane derived from that base. It used to run everywhere, because it
  # DISCOVERED its base ref by taking the first of three candidates that
  # existed -- and every branch in this repository contains the VTO
  # integration commit, so every unrelated branch was judged against the VTO
  # manifest and failed for its own work.
  #
  # The signal is explicit and fails closed: with KSCAN_VTO_SCOPE_ENFORCE=1
  # set, KSCAN_VTO_SCOPE_BASE_REF is mandatory and a missing, empty or
  # unresolvable base is an ERROR, never a skip and never a pass.
  # __tests__/vtoScopeGuardEnforcementMode.test.js asserts that this job
  # still declares both variables and still runs the guard, so the wiring
  # cannot be quietly deleted.
  #
  # Lane membership is not left to a branch name alone. The applicability
  # step below also enforces on any pull request whose OWN diff touches a
  # VTO-owned path, so a VTO change cannot escape the boundary by being
  # committed on a branch that is not called one.
  #
  # PULL REQUESTS ONLY, and that is a correctness requirement rather than a
  # cost saving. The base authority of a change is the branch it is proposed
  # INTO, and that only exists on a pull request. A push is proposed into
  # nothing, so any base picked for it is a guess -- which is the whole defect
  # being repaired. This job's first revision did exactly that: on push it
  # fell back to the integration branch and failed this very branch for the
  # notifications work it had legitimately inherited from its real base.
  # Enforcement therefore lives on the pull request, which is also the point
  # where merging is gated.
  scope-guard:
    name: VTO scope guard (enforced)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The live diff needs the base commit itself, not a shallow tip.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Decides whether this pull request is a VTO lane. The base authority is
      # always the branch it is proposed into -- never a guess.
      - name: Classify this lane
        id: lane
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          VTO_BASE_AUTHORITY: integration/backend-kplus-complimentary-staging-v1
        run: |
          set -euo pipefail

          BASE="origin/${BASE_REF}"

          LANE=general
          case "$HEAD_REF" in
            *vto*|*VTO*) LANE=vto ;;
          esac
          if [ "$BASE_REF" = "$VTO_BASE_AUTHORITY" ]; then
            LANE=vto
          fi

          # A pull request that mutates a VTO-owned path is a VTO lane no
          # matter what its branch is called.
          #
          # The ownership test is `isVtoOwnedPath` from the guard itself, not a
          # second copy of the prefix list kept here. Two definitions of "VTO
          # path" that can drift apart is exactly how a lane ends up classified
          # by one rule and judged by another.
          #
          # The node filter reads the diff on stdin and prints nothing when
          # there is no match, so an empty VTO_TOUCHES still means "not a VTO
          # lane" -- and unlike `grep -Eq` it cannot SIGPIPE git under
          # `pipefail` and report 141 exactly when a VTO path WAS found.
          if [ "$LANE" = "general" ] && git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then
            VTO_TOUCHES="$(git diff --name-only "${BASE}...HEAD" | node -e '
              const { isVtoOwnedPath } = require("./scripts/check-vto-live-integration-scope.js");
              const input = require("node:fs").readFileSync(0, "utf8");
              const hits = input.split("\n").map((l) => l.trim()).filter(Boolean).filter(isVtoOwnedPath);
              if (hits.length > 0) process.stdout.write(hits.join("\n") + "\n");
            ')"
            if [ -n "$VTO_TOUCHES" ]; then
              LANE=vto
              echo "VTO-owned paths in this diff:"
              echo "$VTO_TOUCHES"
            fi
          fi

          echo "lane=${LANE}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "Lane: ${LANE} (base authority: ${BASE})"

      - name: Enforce the VTO mutation boundary
        if: steps.lane.outputs.lane == 'vto'
        env:
          KSCAN_VTO_SCOPE_ENFORCE: '1'
          KSCAN_VTO_SCOPE_BASE_REF: ${{ steps.lane.outputs.base }}
        run: node scripts/check-vto-live-integration-scope.js

      # The same boundary through the guard's own test file, so the two live
      # assertions are proven to RUN here -- not merely to be skippable
      # everywhere else.
      - name: Enforce the VTO mutation boundary through the guard's tests
        if: steps.lane.outputs.lane == 'vto'
        env:
          KSCAN_VTO_SCOPE_ENFORCE: '1'
          KSCAN_VTO_SCOPE_BASE_REF: ${{ steps.lane.outputs.base }}
        run: node --test __tests__/vtoLiveIntegrationScope.test.js

      - name: Report NOT APPLICABLE
        if: steps.lane.outputs.lane != 'vto'
        run: |
          echo "This ref is not a VTO lane: the live mutation-boundary diff does not apply."
          echo "The static boundary controls still ran in 'Project checks'."

  # Real deployed vto-generate, real auth/entitlement/reservation/release
  # wiring, zero-spend fixture. REAL PROVIDER SUBMIT stays 0. Mandatory
  # before staging-full-certification may run.
  staging-dryrun:
    name: VTO E2E — staging dry run
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'staging-dryrun'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: vto-e2e-certification
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ vars.SUPABASE_STAGING_PROJECT_REF }}" --yes

      - name: Generate run tag
        id: runtag
        run: |
          TAG="vto-dryrun-$(date -u +%Y%m%dT%H%M%SZ)-$(node -e 'process.stdout.write(require("crypto").randomBytes(4).toString("hex"))')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run harness staging-dryrun mode
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: node scripts/vto-e2e/run.mjs --mode=staging-dryrun --run-tag="${{ steps.runtag.outputs.tag }}" | tee vto-e2e-dryrun-report.json

      - name: Validate dry-run report
        env:
          VTO_E2E_EXPECT_RUN_ID: ${{ steps.runtag.outputs.tag }}
          VTO_E2E_EXPECT_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          VTO_E2E_EXPECT_MODE: staging-dryrun
          VTO_E2E_EXPECT_AUTHORITY_SHA: ${{ github.sha }}
        run: node scripts/vto-e2e/validate-report.mjs vto-e2e-dryrun-report.json

      - name: Upload dry-run report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vto-e2e-dryrun-report-${{ github.run_number }}
          path: vto-e2e-dryrun-report.json
          if-no-files-found: warn
          retention-days: 30

  # The ONE authorized real-provider happy path. Requires explicit
  # confirm_paid_certification=YES in addition to mode selection — a single
  # dropdown mistake must not be enough to spend money.
  staging-full-certification:
    name: VTO E2E — staging full certification (paid)
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'staging-full-certification' &&
      github.event.inputs.confirm_paid_certification == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: vto-e2e-certification
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ vars.SUPABASE_STAGING_PROJECT_REF }}" --yes

      - name: Generate run tag
        id: runtag
        run: |
          TAG="vto-fullcert-$(date -u +%Y%m%dT%H%M%SZ)-$(node -e 'process.stdout.write(require("crypto").randomBytes(4).toString("hex"))')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Resolve commit SHA for the committed garment fixture
        id: sha
        run: |
          set -euo pipefail
          SHA="${{ github.event.inputs.commit_sha }}"
          if [ -z "$SHA" ]; then
            SHA="${{ github.sha }}"
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be an exact 40-hex commit SHA, got: $SHA" >&2
            exit 2
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Run harness staging-full-certification mode
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          node scripts/vto-e2e/run.mjs \
            --mode=staging-full-certification \
            --commit-sha="${{ steps.sha.outputs.sha }}" \
            --run-tag="${{ steps.runtag.outputs.tag }}" \
            | tee vto-e2e-fullcert-report.json

      - name: Validate full-certification report
        env:
          VTO_E2E_EXPECT_RUN_ID: ${{ steps.runtag.outputs.tag }}
          VTO_E2E_EXPECT_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          VTO_E2E_EXPECT_MODE: staging-full-certification
          # The workflow's OWN executing commit, not steps.sha.outputs.sha
          # (which names only the commit the garment fixture asset is
          # pinned to, and may legitimately differ if commit_sha was
          # overridden to an older commit while running current code).
          VTO_E2E_EXPECT_AUTHORITY_SHA: ${{ github.sha }}
        run: node scripts/vto-e2e/validate-report.mjs vto-e2e-fullcert-report.json

      - name: Upload full-certification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vto-e2e-fullcert-report-${{ github.run_number }}
          path: vto-e2e-fullcert-report.json
          if-no-files-found: warn
          retention-days: 30

  cleanup:
    name: VTO E2E — cleanup
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: vto-e2e-certification
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ vars.SUPABASE_STAGING_PROJECT_REF }}" --yes

      - name: Run harness cleanup mode
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: node scripts/vto-e2e/run.mjs --mode=cleanup --run-tag="${{ github.event.inputs.run_tag }}" --user-ids="${{ github.event.inputs.user_ids }}"
