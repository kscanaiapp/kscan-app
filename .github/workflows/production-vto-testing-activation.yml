# Build 34 production VTO live-testing activation.
#
# Manual only. This changes one app_config row after the existing GitHub
# production Environment reviewer gate. It never deploys a function, applies a
# migration, creates a schedule, or enables a background worker.
name: K Scan Build34 Production VTO Testing Activation

on:
  workflow_dispatch:
    inputs:
      confirm_activation:
        description: 'Type exactly: ENABLE BUILD34 VTO LIVE TESTING'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kscan-production-vto-testing-activation
  cancel-in-progress: false

env:
  EXPECTED_PRODUCTION_REF: wyyuqfdxucjksghsmhry
  GOVERNED_BRANCH: rebuild/backend-authority-v2

jobs:
  preflight:
    name: Preflight (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact intent and governed branch tip
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_activation }}" != "ENABLE BUILD34 VTO LIVE TESTING" ]; then
            echo "::error::confirm_activation must exactly match the governed phrase."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "${GOVERNED_BRANCH}" ]; then
            echo "::error::Dispatch must run from ${GOVERNED_BRANCH}, not ${GITHUB_REF_NAME}."
            exit 1
          fi
          git fetch origin "${GOVERNED_BRANCH}" --quiet
          REMOTE_SHA="$(git rev-parse "origin/${GOVERNED_BRANCH}")"
          if [ "${GITHUB_SHA}" != "${REMOTE_SHA}" ]; then
            echo "::error::Dispatch SHA is not the current governed branch tip."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Static governed preflight
        env:
          DEPLOY_FUNCTIONS: vto-generate
          APPROVED_MIGRATION_VERSION: ''
        run: node scripts/production-deploy-preflight.mjs --static --json

      - name: Activation contract tests
        run: node --test __tests__/productionVtoLiveTestingActivation.test.js

  activate:
    name: Activate VTO live testing
    needs: preflight
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Re-verify governed branch tip after approval
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GOVERNED_BRANCH}" --quiet
          REMOTE_SHA="$(git rev-parse "origin/${GOVERNED_BRANCH}")"
          if [ "${GITHUB_SHA}" != "${REMOTE_SHA}" ]; then
            echo "::error::Governed branch advanced while approval was pending; refusing stale config mutation."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate production variables
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PRODUCTION_PROJECT_REF SUPABASE_PRODUCTION_URL SUPABASE_PRODUCTION_ANON_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing required production variable name: ${v}"
              exit 1
            fi
          done
          if [ "${SUPABASE_PRODUCTION_PROJECT_REF}" != "${EXPECTED_PRODUCTION_REF}" ]; then
            echo "::error::Production project ref mismatch."
            exit 1
          fi

      - name: Live production drift preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
          DEPLOY_FUNCTIONS: vto-generate
          APPROVED_MIGRATION_VERSION: ''
        run: node scripts/production-deploy-preflight.mjs --json

      - name: Verify real VTO provider secret name
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          SECRET_LIST_JSON="${RUNNER_TEMP}/production-vto-secret-names.json"
          trap 'rm -f "${SECRET_LIST_JSON}"' EXIT
          supabase --output json secrets list --project-ref "${SUPABASE_PRODUCTION_PROJECT_REF}" > "${SECRET_LIST_JSON}"
          SECRET_LIST_JSON="${SECRET_LIST_JSON}" node <<'NODE'
          const fs = require('fs');
          const parsed = JSON.parse(fs.readFileSync(process.env.SECRET_LIST_JSON, 'utf8'));
          const rows = Array.isArray(parsed)
            ? parsed
            : Array.isArray(parsed?.secrets)
              ? parsed.secrets
              : Array.isArray(parsed?.result)
                ? parsed.result
                : [];
          const names = new Set(
            rows
              .map((row) => row && typeof row === 'object' ? (row.name ?? row.key ?? row.secret_name) : null)
              .filter(Boolean),
          );
          if (!names.has('RAPIDAPI_KEY')) {
            console.error('Missing required production Edge Function secret name: RAPIDAPI_KEY');
            process.exit(1);
          }
          console.log('verified required production secret name: RAPIDAPI_KEY');
          NODE

      - name: Activate governed VTO live-testing config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
          SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
          SUPABASE_PRODUCTION_ANON_KEY: ${{ secrets.SUPABASE_PRODUCTION_PUBLISHABLE_KEY }}
          CONFIRM_VTO_ACTIVATION: ${{ inputs.confirm_activation }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/activate-production-vto-testing.mjs | tee "${RUNNER_TEMP}/vto-activation-result.json"

      - name: Upload activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-vto-testing-activation-${{ github.run_number }}
          path: ${{ runner.temp }}/vto-activation-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Build 34 production VTO live-testing activation"
            echo ""
            echo "- Project: \`${EXPECTED_PRODUCTION_REF}\`"
            echo "- Provider: \`ailabtools_tryon_clothes_pro\`"
            echo "- VTO enabled: \`true\`"
            echo "- Watchlist worker: unchanged / required OFF"
            echo "- Account deletion worker: unchanged / required OFF"
            echo "- Migration ledger: required unchanged"
          } >> "${GITHUB_STEP_SUMMARY}"
