# K Scan Staging Security Gate — serialized staging deployment and dynamic validation.
# Deploys PR merge candidates to staging (yzqjvdfgefveprobvvyw) when staging-impact
# surfaces change. Production (wyyuqfdxucjksghsmhry) is never targeted.

name: K Scan Staging Security Gate

on:
  workflow_call:
    outputs:
      deployment_required:
        value: ${{ jobs.staging-security-gate.outputs.deployment_required }}
      deployed_staging_sha:
        value: ${{ jobs.staging-security-gate.outputs.deployed_staging_sha }}
      migration_result:
        value: ${{ jobs.staging-security-gate.outputs.migration_result }}
      contract_result:
        value: ${{ jobs.staging-security-gate.outputs.contract_result }}
      health_result:
        value: ${{ jobs.staging-security-gate.outputs.health_result }}
      synthetic_result:
        value: ${{ jobs.staging-security-gate.outputs.synthetic_result }}
      release_class:
        value: ${{ jobs.staging-security-gate.outputs.release_class }}
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  # Manual dispatch is a deploy path, so it must carry explicit, validated intent.
  # Without these inputs a dispatch from any branch would satisfy the deploy
  # allow-list purely by being manual.
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: Type DEPLOY-TO-STAGING to authorize a staging write
        required: true
        default: ''
        type: string
      staging_project_ref:
        description: Target project ref (must be the staging project)
        required: true
        default: yzqjvdfgefveprobvvyw
        type: string

permissions:
  contents: read

concurrency:
  group: kscan-staging-deployment
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_STAGING_REF: yzqjvdfgefveprobvvyw
  PRODUCTION_REF: wyyuqfdxucjksghsmhry
  # The governing staging branch. Diffs are classified against this branch, and
  # it is the only line from which staging deployments are authorized.
  STAGING_AUTHORITY_BRANCH: staging/production-parity
  # Legacy testing fork. FROZEN: preserved for historical CI and selective
  # commit recovery only, and never a staging deployment source.
  FROZEN_LEGACY_BRANCH: ios/full-submission-readiness-v2

jobs:
  classify-changes:
    name: Classify changed surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      staging_impact: ${{ steps.classify.outputs.staging_impact }}
      mobile_only: ${{ steps.classify.outputs.mobile_only }}
      classifications: ${{ steps.classify.outputs.classifications }}
      release_class: ${{ steps.classify.outputs.release_class }}
      backend_deployment_required: ${{ steps.classify.outputs.backend_deployment_required }}
      edge_deployment_required: ${{ steps.classify.outputs.edge_deployment_required }}
      migration_validation_required: ${{ steps.classify.outputs.migration_validation_required }}
      mobile_runtime_impact: ${{ steps.classify.outputs.mobile_runtime_impact }}
      enforcement_level: ${{ steps.enforcement.outputs.level }}
    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed surfaces
        id: classify
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${DIFF_BASE_SHA:-}" ] || [ "$DIFF_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            DIFF_BASE_SHA="${DIFF_HEAD_SHA}^"
          fi
          node security/scripts/classify-changed-surfaces.js "$DIFF_BASE_SHA" "$DIFF_HEAD_SHA" > classification.json
          STAGING_IMPACT="$(python3 -c "import json; print(str(json.load(open('classification.json'))['stagingImpact']).lower())")"
          MOBILE_ONLY="$(python3 -c "import json; print(str(json.load(open('classification.json'))['mobileOnly']).lower())")"
          CLASSIFICATIONS="$(python3 -c "import json; print(','.join(json.load(open('classification.json'))['classifications']))")"
          RELEASE_CLASS="$(python3 -c "import json; print(json.load(open('classification.json'))['releaseClass'])")"
          BACKEND_DEPLOYMENT_REQUIRED="$(python3 -c "import json; print(str(json.load(open('classification.json'))['backendDeploymentRequired']).lower())")"
          EDGE_DEPLOYMENT_REQUIRED="$(python3 -c "import json; print(str(json.load(open('classification.json'))['edgeDeploymentRequired']).lower())")"
          MIGRATION_VALIDATION_REQUIRED="$(python3 -c "import json; print(str(json.load(open('classification.json'))['migrationValidationRequired']).lower())")"
          MOBILE_RUNTIME_IMPACT="$(python3 -c "import json; print(str(json.load(open('classification.json'))['mobileRuntimeImpact']).lower())")"
          echo "staging_impact=${STAGING_IMPACT}" >> "$GITHUB_OUTPUT"
          echo "mobile_only=${MOBILE_ONLY}" >> "$GITHUB_OUTPUT"
          echo "classifications=${CLASSIFICATIONS}" >> "$GITHUB_OUTPUT"
          echo "release_class=${RELEASE_CLASS}" >> "$GITHUB_OUTPUT"
          echo "backend_deployment_required=${BACKEND_DEPLOYMENT_REQUIRED}" >> "$GITHUB_OUTPUT"
          echo "edge_deployment_required=${EDGE_DEPLOYMENT_REQUIRED}" >> "$GITHUB_OUTPUT"
          echo "migration_validation_required=${MIGRATION_VALIDATION_REQUIRED}" >> "$GITHUB_OUTPUT"
          echo "mobile_runtime_impact=${MOBILE_RUNTIME_IMPACT}" >> "$GITHUB_OUTPUT"
          cat classification.json >> "$GITHUB_STEP_SUMMARY"

      # Staging Gate V2 Section 3/10: this workflow is invoked both directly
      # (a plain PR - NORMAL_PR) and via workflow_call from
      # staging-release-certification.yml, which only ever fires on a push
      # to staging/production-parity or a dispatch with a candidate SHA
      # (RELEASE_PROMOTION). The enforcement level - not the classification
      # alone - decides whether contract-tests below may skip: a docs-only
      # diff never needs it at NORMAL_PR, but "docs-only" must never excuse
      # it at INTEGRATION/RELEASE_PROMOTION, where every applicable check is
      # required regardless of what changed (Section 10, absolute green).
      - name: Determine enforcement level
        id: enforcement
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          node -e "
            const { determineEnforcementLevel } = require('./security/scripts/lib/enforcement-level');
            const level = determineEnforcementLevel({
              eventName: process.env.EVENT_NAME,
              ref: process.env.REF,
              baseRef: process.env.BASE_REF || undefined,
            });
            console.log('level=' + level);
          " >> "$GITHUB_OUTPUT"

      - name: Upload classification artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: change-classification-${{ github.run_number }}
          path: classification.json
          retention-days: 30

  migration-validation:
    name: Migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: classify-changes
    if: contains(needs.classify-changes.outputs.classifications, 'DATABASE MIGRATION')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Validate migration syntax and destructive operations
        run: |
          set -euo pipefail
          node security/scripts/detect-destructive-migrations.js supabase/migrations > destructive-report.json
          cat destructive-report.json
          for f in supabase/migrations/*.sql; do
            [ -f "$f" ] || continue
            python3 -c "open('$f', encoding='utf-8').read()"
            echo "syntax ok: $f"
          done

      - name: Upload migration validation artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-validation-${{ github.run_number }}
          path: destructive-report.json
          retention-days: 30

  deploy-staging:
    name: Deploy staging candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - classify-changes
      - migration-validation
    # DEPLOY AUTHORITY IS AN ALLOW-LIST, NOT A DENY-LIST.
    #
    # This job is the only one in the workflow that writes to staging. It previously
    # ran for any branch whose diff looked staging-impacting, which meant a
    # preservation or candidate branch could reach the Supabase steps. A push of
    # recovery/staging-production-parity-candidate on 2026-08-04 did start this job
    # and was stopped only by an unrelated hard failure — it must be structurally
    # impossible instead of accidentally safe.
    #
    # Only the governing staging branch, or an explicit manual dispatch, may deploy.
    #
    # Gated on backendDeploymentRequired, not the blanket stagingImpact: this
    # job's own steps below only ever `supabase link`/apply migrations/deploy
    # functions, so it has nothing to do -- and nothing to prove -- on a diff
    # that touches no supabase/functions/** or supabase/migrations/** file.
    # stagingImpact stays true for a mobile-only PR on purpose (see
    # classify-changed-surfaces.js), which previously meant a pure-mobile
    # change still ran the real Supabase link/snapshot/deploy pipeline even
    # though the deploy scripts always no-op once inside.
    if: |
      always() &&
      needs.classify-changes.outputs.backend_deployment_required == 'true' &&
      (needs.migration-validation.result == 'success' || needs.migration-validation.result == 'skipped') &&
      (
        github.ref == 'refs/heads/staging/production-parity' ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.confirm_staging_deploy == 'DEPLOY-TO-STAGING' &&
          inputs.staging_project_ref == 'yzqjvdfgefveprobvvyw'
        )
      )
    environment: staging
    outputs:
      deployed_sha: ${{ steps.record.outputs.deployed_sha }}
      merge_sha: ${{ steps.record.outputs.merge_sha }}
      base_sha: ${{ steps.record.outputs.base_sha }}
    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record candidate SHAs
        id: record
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FALLBACK_BASE_BRANCH: ${{ github.base_ref || 'staging/production-parity' }}
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          MERGE_SHA="$(git rev-parse HEAD)"
          if [ -n "${PR_BASE_SHA:-}" ]; then
            BASE_SHA="${PR_BASE_SHA}"
          else
            # FAIL CLOSED: if the governing base ref cannot be resolved we do not
            # know what this candidate actually changes, so nothing may be
            # deployed. Never fall back to a broader diff or an empty base.
            if ! git fetch origin "${FALLBACK_BASE_BRANCH}" --depth=1 --quiet; then
              echo "::error::Cannot resolve governing base branch '${FALLBACK_BASE_BRANCH}'. Refusing to deploy."
              exit 1
            fi
            if ! BASE_SHA="$(git merge-base "origin/${FALLBACK_BASE_BRANCH}" HEAD)"; then
              echo "::error::No merge base with '${FALLBACK_BASE_BRANCH}'. Refusing to deploy."
              exit 1
            fi
          fi
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "merge_sha=${MERGE_SHA}" >> "$GITHUB_OUTPUT"
          echo "deployed_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Candidate head SHA: ${HEAD_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate base SHA: ${BASE_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Merge tree SHA: ${MERGE_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate required staging secrets and variables
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_STAGING_PROJECT_REF SUPABASE_STAGING_URL SUPABASE_STAGING_PUBLISHABLE_KEY; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required staging variables:"
            printf -- '- %s\n' "${missing[@]}"
            echo "Refusing to deploy before preflight secrets are present."
            exit 1
          fi
          if [ "${SUPABASE_STAGING_PROJECT_REF}" = "wyyuqfdxucjksghsmhry" ]; then
            echo "Refusing production project reference"
            exit 1
          fi
          case "${SUPABASE_STAGING_URL}" in
            *wyyuqfdxucjksghsmhry*) echo "Refusing production URL"; exit 1 ;;
          esac

      - name: Verify staging project reference
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
        run: |
          set -euo pipefail
          EXPECTED="${SUPABASE_STAGING_PROJECT_REF:-yzqjvdfgefveprobvvyw}"
          if [ "$EXPECTED" = "wyyuqfdxucjksghsmhry" ]; then
            echo "Refusing production project reference"
            exit 1
          fi
          node security/scripts/verify-staging-project-ref.js "$EXPECTED"

      - name: Setup Supabase CLI
        id: setup_supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Validate Supabase configuration
        run: |
          set -euo pipefail
          if [ -d supabase/functions ]; then
            ls -la supabase/functions
          fi
          if [ -d supabase/migrations ]; then
            ls supabase/migrations/*.sql | tail -5
          fi
          node security/scripts/guard-unsupported-supabase-cli.js .github scripts security/scripts

      - name: Link staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          set -euo pipefail
          REF="${SUPABASE_STAGING_PROJECT_REF:-yzqjvdfgefveprobvvyw}"
          supabase link --project-ref "$REF" --yes

      - name: Snapshot staging state (before)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "${{ vars.SUPABASE_STAGING_PROJECT_REF || 'yzqjvdfgefveprobvvyw' }}" --output-format json > /tmp/staging-functions-before.json
          node security/scripts/snapshot-legitimate-staging-data.js "${{ vars.SUPABASE_STAGING_PROJECT_REF || 'yzqjvdfgefveprobvvyw' }}" > /tmp/legitimate-data-before.json

      - name: Apply candidate migrations only
        id: migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Never a blanket `db push` — this project has known migration-history
          # drift (staging carries migrations whose .sql files are absent from
          # some branches), and `db push` refuses to run at all while that's
          # true. Apply only the migration files this PR actually introduces.
          node security/scripts/apply-candidate-migrations.js \
            "${{ steps.record.outputs.base_sha }}" \
            "${{ steps.record.outputs.deployed_sha }}" \
            "${{ vars.SUPABASE_STAGING_PROJECT_REF || 'yzqjvdfgefveprobvvyw' }}" \
            | tee /tmp/migration-result.json
          OUTCOME="$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/migration-result.json','utf8')).outcome)")"
          echo "outcome=${OUTCOME}" >> "$GITHUB_OUTPUT"
          if [ "$OUTCOME" = "MIGRATION_HISTORY_CONFLICT" ] || [ "$OUTCOME" = "OPERATIONAL_FAILURE" ]; then
            exit 1
          fi

      - name: Deploy changed Edge Functions only
        id: functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Never a loop over every directory in supabase/functions/ — deploy
          # only functions this PR changed, plus any function proven (by real
          # import analysis, not "_shared changed so deploy everything") to
          # import a shared module this PR changed.
          node security/scripts/deploy-changed-functions.js \
            "${{ steps.record.outputs.base_sha }}" \
            "${{ steps.record.outputs.deployed_sha }}" \
            "${{ vars.SUPABASE_STAGING_PROJECT_REF || 'yzqjvdfgefveprobvvyw' }}" \
            | tee /tmp/functions-result.json
          OUTCOME="$(node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/functions-result.json','utf8')); console.log(r.outcome || (r.deployed && r.deployed.length ? 'DEPLOYED' : 'NO_CHANGED_FUNCTIONS'))")"
          echo "outcome=${OUTCOME}" >> "$GITHUB_OUTPUT"

      - name: Snapshot staging state (after) and report side effects
        if: always() && steps.setup_supabase.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "${{ vars.SUPABASE_STAGING_PROJECT_REF || 'yzqjvdfgefveprobvvyw' }}" --output-format json > /tmp/staging-functions-after.json
          node security/scripts/report-staging-inventory-diff.js /tmp/staging-functions-before.json /tmp/staging-functions-after.json | tee /tmp/inventory-diff.json
          node security/scripts/snapshot-legitimate-staging-data.js "${{ vars.SUPABASE_STAGING_PROJECT_REF || 'yzqjvdfgefveprobvvyw' }}" > /tmp/legitimate-data-after.json

      - name: Record deployment state
        if: always()
        env:
          BASE_SHA: ${{ steps.record.outputs.base_sha }}
          HEAD_SHA: ${{ steps.record.outputs.deployed_sha }}
          STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF || 'yzqjvdfgefveprobvvyw' }}
          MIGRATION_RESULT_FILE: /tmp/migration-result.json
          FUNCTION_RESULT_FILE: /tmp/functions-result.json
          INVENTORY_DIFF_FILE: /tmp/inventory-diff.json
          LEGITIMATE_BEFORE_FILE: /tmp/legitimate-data-before.json
          LEGITIMATE_AFTER_FILE: /tmp/legitimate-data-after.json
        run: |
          set -euo pipefail
          node security/scripts/write-staging-deploy-summary.js >> "$GITHUB_STEP_SUMMARY"

  staging-health:
    name: Staging health checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - classify-changes
      - deploy-staging
    # Same rationale as deploy-staging: gated on backendDeploymentRequired, not
    # the blanket stagingImpact, since a mobile-only PR has nothing in staging
    # for this check to validate. In practice deploy-staging.result is already
    # 'skipped' rather than 'success' whenever backendDeploymentRequired is
    # false, so this condition is redundant with that cascade today -- it is
    # kept explicit so this job never depends on deploy-staging's internal
    # gating remaining exactly as it is now.
    if: |
      always() &&
      needs.classify-changes.outputs.backend_deployment_required == 'true' &&
      needs.deploy-staging.result == 'success'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Run staging health checks
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_STAGING_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          npm ci
          npm run test:verify-supabase

  synthetic-tests:
    name: Synthetic auth tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - classify-changes
      - deploy-staging
      - staging-health
    # Same rationale as deploy-staging/staging-health above.
    if: |
      always() &&
      needs.classify-changes.outputs.backend_deployment_required == 'true' &&
      needs.deploy-staging.result == 'success' &&
      (needs.staging-health.result == 'success' || needs.staging-health.result == 'skipped')
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Run synthetic staging tests
        env:
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          STAGING_SYNTHETIC_ACTIVE_EMAIL: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_EMAIL }}
          STAGING_SYNTHETIC_ACTIVE_PASSWORD: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_PASSWORD }}
          STAGING_SYNTHETIC_PENDING_EMAIL: ${{ secrets.STAGING_SYNTHETIC_PENDING_EMAIL }}
          STAGING_SYNTHETIC_PENDING_PASSWORD: ${{ secrets.STAGING_SYNTHETIC_PENDING_PASSWORD }}
          STAGING_SYNTHETIC_LOCKED_EMAIL: ${{ secrets.STAGING_SYNTHETIC_LOCKED_EMAIL }}
          STAGING_SYNTHETIC_LOCKED_PASSWORD: ${{ secrets.STAGING_SYNTHETIC_LOCKED_PASSWORD }}
        run: |
          set -euo pipefail
          # Runtime-authenticated tokens are masked by the script itself
          # (::add-mask:: to stderr) the instant each is received. Only
          # stdout — the final JSON report, no token ever included — is
          # captured into the artifact file.
          node security/scripts/synthetic-staging-tests.js | tee synthetic-report.json
          python3 -c "import json; r=json.load(open('synthetic-report.json')); assert r['ok'], r"

      - name: Record synthetic cleanup evidence
        if: always()
        run: |
          set -euo pipefail
          if [ -f synthetic-report.json ]; then
            python3 - <<'PY'
          import json
          r=json.load(open("synthetic-report.json", encoding="utf-8"))
          c=r.get("cleanupEvidence", {})
          print("Synthetic cleanup tag:", c.get("tag"))
          print("Synthetic users created this run:", c.get("syntheticUsersCreated", 0))
          print("Synthetic users deleted this run:", c.get("syntheticUsersDeleted", 0))
          PY
          fi

      - name: Upload synthetic test artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-staging-tests-${{ github.run_number }}
          path: synthetic-report.json
          if-no-files-found: warn
          retention-days: 30

  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: classify-changes
    # Staging Gate V2 Section 6: a docs-only PR does not need mobile
    # contract/security tests run against it. This job stays a required
    # check either way (it still reports a real `skipped` conclusion on
    # docs-only PRs, not a missing check-run) - see the staging-security-gate
    # aggregation below, which was fixed in the same change to actually
    # tolerate that `skipped` result instead of treating it as a failure.
    #
    # The docs-only exemption applies ONLY at NORMAL_PR level (Section 10):
    # this workflow is also invoked via workflow_call from
    # staging-release-certification.yml on every push to
    # staging/production-parity, where absolute-green means "docs-only"
    # must never excuse skipping it.
    if: >-
      needs.classify-changes.outputs.enforcement_level != 'NORMAL_PR' ||
      needs.classify-changes.outputs.classifications != 'DOCUMENTATION ONLY'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mobile contract and security tests
        run: |
          set -euo pipefail
          npm run test:privacy
          npm run test:auth-privacy
          npm run test:analyze-contract
          npm run test:verify-supabase

  staging-security-gate:
    name: Staging security gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - classify-changes
      - migration-validation
      - deploy-staging
      - staging-health
      - synthetic-tests
      - contract-tests
    outputs:
      deployment_required: ${{ steps.verdict.outputs.deployment_required }}
      deployed_staging_sha: ${{ steps.verdict.outputs.deployed_staging_sha }}
      migration_result: ${{ steps.verdict.outputs.migration_result }}
      contract_result: ${{ steps.verdict.outputs.contract_result }}
      health_result: ${{ steps.verdict.outputs.health_result }}
      synthetic_result: ${{ steps.verdict.outputs.synthetic_result }}
      release_class: ${{ steps.verdict.outputs.release_class }}
    steps:
      - name: Publish staging gate verdict
        id: verdict
        env:
          STAGING_IMPACT: ${{ needs.classify-changes.outputs.staging_impact }}
          MOBILE_ONLY: ${{ needs.classify-changes.outputs.mobile_only }}
          RELEASE_CLASS: ${{ needs.classify-changes.outputs.release_class }}
          MIGRATION: ${{ needs.migration-validation.result }}
          DEPLOY: ${{ needs.deploy-staging.result }}
          HEALTH: ${{ needs.staging-health.result }}
          SYNTHETIC: ${{ needs.synthetic-tests.result }}
          CONTRACT: ${{ needs.contract-tests.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEPLOYED_STAGING_SHA: ${{ needs.deploy-staging.outputs.deployed_sha }}
        run: |
          set -euo pipefail
          VERDICT="PASS"
          FAIL=0

          # A genuine contract-tests failure blocks; a `skipped` result
          # (docs-only PR, per the job's own `if:` above) is exactly as
          # legitimate a non-failure as MIGRATION's own `= "failure"` check
          # below already treats a skip as - this used to compare
          # `!= "success"`, which meant a `skipped` result (docs-only PR,
          # or any other non-run outcome) always read as BLOCKED, the exact
          # "docs-only PR shown security-red" failure class this refactor
          # exists to fix.
          if [ "$CONTRACT" = "failure" ]; then
            VERDICT="BLOCKED"
            FAIL=1
          fi

          if [ "$STAGING_IMPACT" = "true" ]; then
            if [ "$MIGRATION" = "failure" ]; then VERDICT="BLOCKED"; FAIL=1; fi
            if [ "$DEPLOY" = "failure" ]; then VERDICT="OPERATIONAL FAILURE"; FAIL=1; fi
            if [ "$HEALTH" = "failure" ]; then VERDICT="BLOCKED"; FAIL=1; fi
            if [ "$SYNTHETIC" = "failure" ]; then VERDICT="BLOCKED"; FAIL=1; fi
          else
            if [ "$MOBILE_ONLY" = "true" ]; then
              VERDICT="PASS WITH REPORT-ONLY FINDINGS"
            fi
          fi

          if [ "$RELEASE_CLASS" = "RUNTIME_RELEASE" ]; then
            echo "deployment_required=true" >> "$GITHUB_OUTPUT"
            echo "deployed_staging_sha=${DEPLOYED_STAGING_SHA:-}" >> "$GITHUB_OUTPUT"
          else
            echo "deployment_required=false" >> "$GITHUB_OUTPUT"
            echo "deployed_staging_sha=NOT_APPLICABLE" >> "$GITHUB_OUTPUT"
          fi
          echo "migration_result=${MIGRATION}" >> "$GITHUB_OUTPUT"
          echo "contract_result=${CONTRACT}" >> "$GITHUB_OUTPUT"
          echo "health_result=${HEALTH}" >> "$GITHUB_OUTPUT"
          echo "synthetic_result=${SYNTHETIC}" >> "$GITHUB_OUTPUT"
          echo "release_class=${RELEASE_CLASS}" >> "$GITHUB_OUTPUT"

          {
            echo "## Staging security gate"
            echo
            echo "**Verdict:** ${VERDICT}"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Staging impact | ${STAGING_IMPACT} |"
            echo "| Mobile only | ${MOBILE_ONLY} |"
            echo "| Release class | ${RELEASE_CLASS} |"
            echo "| Migration validation | ${MIGRATION} |"
            echo "| Deploy staging | ${DEPLOY} |"
            echo "| Health checks | ${HEALTH} |"
            echo "| Synthetic tests | ${SYNTHETIC} |"
            echo "| Contract tests | ${CONTRACT} |"
            echo "| Candidate SHA | ${HEAD_SHA} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
