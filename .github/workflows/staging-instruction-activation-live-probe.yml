# Bounded Staging live probe for issue #639 (Elise brand voice + Scanner image
# product mission activation). Follows the existing live-probe pattern
# (staging-elise-dominant-garment-live-probe.yml): staging environment, one
# narrow script, sanitized JSON artifact. The push trigger is scoped to this
# probe's own branch so the workflow self-registers for dispatch.
#
# Side effects: one Elise turn, three image-mode scans and one TextScan by the
# governed synthetic ACTIVE account against Staging. Deploys nothing.

name: K Scan Staging Instruction Activation Live Probe

on:
  workflow_dispatch: {}
  push:
    branches:
      - test/instruction-activation-probe-v1

permissions:
  contents: read

concurrency:
  group: kscan-instruction-activation-live-probe
  cancel-in-progress: false

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run the bounded activation proof
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SYNTHETIC_ACTIVE_EMAIL: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_EMAIL }}
          STAGING_SYNTHETIC_ACTIVE_PASSWORD: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_PASSWORD }}
        run: node security/release/run-instruction-activation-live-probe.js

      - name: Print sanitized evidence
        if: always()
        run: test -s instruction-activation-live-probe-report.json && cat instruction-activation-live-probe-report.json

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instruction-activation-live-probe-${{ github.run_id }}
          path: instruction-activation-live-probe-report.json
          if-no-files-found: warn
          retention-days: 30
