name: K Scan Staging Stylist Speech Live Probe (feature)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kscan-build32-speech-control-probe
  cancel-in-progress: false

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Run one bounded Build 32 speech control probe
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SYNTHETIC_ACTIVE_EMAIL: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_EMAIL }}
          STAGING_SYNTHETIC_ACTIVE_PASSWORD: ${{ secrets.STAGING_SYNTHETIC_ACTIVE_PASSWORD }}
        run: node security/release/run-build32-speech-control-probe.js > build32-speech-control.json
      - name: Print sanitized evidence
        if: always()
        run: test -s build32-speech-control.json && cat build32-speech-control.json
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build32-speech-control-${{ github.run_id }}
          path: build32-speech-control.json
          retention-days: 30
