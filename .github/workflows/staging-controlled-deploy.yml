# Controlled staging deployment pipeline.
# Deploys exactly one allow-listed Edge Function (and optionally one approved migration)
# to K Scan AI Staging (yzqjvdfgefveprobvvyw). Production is never targeted.

name: K Scan Staging Controlled Deploy

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: Exactly one Edge Function to deploy
        required: true
        default: staging-health
        type: string
      verify_jwt:
        description: Whether the function expects JWT verification
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      approved_migration_version:
        description: Optional single migration version to apply before deploy (14 digits)
        required: false
        default: ''
        type: string
      approve_migration:
        description: Must be YES to apply the approved migration
        required: false
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'

permissions:
  contents: read

concurrency:
  group: kscan-staging-deployment
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPECTED_STAGING_REF: yzqjvdfgefveprobvvyw
  PRODUCTION_REF: wyyuqfdxucjksghsmhry

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    outputs:
      function_name: ${{ steps.scope.outputs.function_name }}
      verify_jwt: ${{ steps.scope.outputs.verify_jwt }}
      migration_version: ${{ steps.scope.outputs.migration_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Validate required staging variables
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_STAGING_PROJECT_REF SUPABASE_STAGING_URL SUPABASE_STAGING_ANON_KEY; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required staging variables:"
            printf -- '- %s\n' "${missing[@]}"
            exit 1
          fi
          if [ "${SUPABASE_STAGING_PROJECT_REF}" = "wyyuqfdxucjksghsmhry" ]; then
            echo "Production project ref is forbidden"
            exit 1
          fi

      - name: Record deployment scope
        id: scope
        run: |
          set -euo pipefail
          FN="${{ inputs.function_name }}"
          if [ -z "$FN" ] || [ "$FN" = "all" ]; then
            echo "Invalid function_name"
            exit 1
          fi
          echo "function_name=${FN}" >> "$GITHUB_OUTPUT"
          echo "verify_jwt=${{ inputs.verify_jwt }}" >> "$GITHUB_OUTPUT"
          echo "migration_version=${{ inputs.approved_migration_version }}" >> "$GITHUB_OUTPUT"

      - name: Run staging preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF || 'yzqjvdfgefveprobvvyw' }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          DEPLOY_FUNCTIONS: ${{ inputs.function_name }}
          APPROVED_MIGRATION_VERSION: ${{ inputs.approved_migration_version }}
        run: |
          set -euo pipefail
          node scripts/staging-deploy-preflight.mjs --json --allow-dirty | tee preflight.json

      - name: Upload preflight artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-preflight-${{ github.run_number }}
          path: preflight.json
          retention-days: 30

  migration-plan:
    name: Migration plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    environment: staging
    outputs:
      apply: ${{ steps.plan.outputs.apply }}
    steps:
      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          VER="${{ needs.preflight.outputs.migration_version }}"
          APPROVE="${{ inputs.approve_migration }}"
          if [ -n "$VER" ] && [ "$APPROVE" = "YES" ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

  approved-single-migration:
    name: Approved single migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - preflight
      - migration-plan
    if: needs.migration-plan.outputs.apply == 'true'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Apply one approved migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF || 'yzqjvdfgefveprobvvyw' }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          MIGRATION_VERSION: ${{ needs.preflight.outputs.migration_version }}
          APPROVE_STAGING_MIGRATION: YES
        run: |
          set -euo pipefail
          node scripts/apply-staging-migration.mjs | tee migration-result.json

      - name: Upload migration artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-migration-${{ github.run_number }}
          path: |
            migration-result.json
            artifacts/staging-migrations/
          if-no-files-found: warn
          retention-days: 30

  source-validation:
    name: Source validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - preflight
      - migration-plan
      - approved-single-migration
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.approved-single-migration.result == 'success' || needs.approved-single-migration.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate function source exists
        run: |
          set -euo pipefail
          FN="${{ needs.preflight.outputs.function_name }}"
          test -f "supabase/functions/${FN}/index.ts"
          echo "source ok: ${FN}"

      - name: Deno check
        run: |
          set -euo pipefail
          FN="${{ needs.preflight.outputs.function_name }}"
          # --node-modules-dir=none (DEF-B29-SVV-008): this repository has a
          # root package.json, which puts Deno into node_modules resolution
          # mode. The runner never installs npm dependencies, so any function
          # importing an `npm:` specifier — apple-credential-link imports
          # `npm:@supabase/supabase-js@2` — failed with "Could not find
          # ... in a node_modules folder" before its source was ever checked.
          # Resolving npm specifiers from Deno's own cache keeps this job
          # hermetic instead of making it depend on an `npm ci` it does not run.
          if command -v deno >/dev/null 2>&1; then
            deno check --node-modules-dir=none "supabase/functions/${FN}/index.ts"
          else
            curl -fsSL https://deno.land/install.sh | sh
            export DENO_INSTALL="$HOME/.deno"
            export PATH="$DENO_INSTALL/bin:$PATH"
            deno check --node-modules-dir=none "supabase/functions/${FN}/index.ts"
          fi

  deploy-one-function:
    name: Deploy one function
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - preflight
      - source-validation
    if: needs.source-validation.result == 'success'
    environment: staging
    outputs:
      manifest_path: ${{ steps.deploy.outputs.manifest_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Deploy function
        id: deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF || 'yzqjvdfgefveprobvvyw' }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          DEPLOY_FUNCTIONS: ${{ needs.preflight.outputs.function_name }}
          FUNCTION_NAME: ${{ needs.preflight.outputs.function_name }}
          EXPECTED_VERIFY_JWT: ${{ needs.preflight.outputs.verify_jwt }}
          APPROVED_MIGRATION_VERSION: ${{ needs.preflight.outputs.migration_version }}
          SKIP_PREFLIGHT_REMOTE: 'false'
        run: |
          set -euo pipefail
          node scripts/deploy-staging-function.mjs | tee deploy-result.json
          MANIFEST="$(python3 -c "import json; print(json.load(open('deploy-result.json')).get('manifestPath',''))")"
          echo "manifest_path=${MANIFEST}" >> "$GITHUB_OUTPUT"

      - name: Upload deploy artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-deploy-${{ github.run_number }}
          path: |
            deploy-result.json
            artifacts/staging-deployments/
          if-no-files-found: warn
          retention-days: 30

  health-check:
    name: Health check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - preflight
      - deploy-one-function
    environment: staging
    steps:
      - name: Probe deployed function
        env:
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          FUNCTION_NAME: ${{ needs.preflight.outputs.function_name }}
        run: |
          set -euo pipefail
          BASE="${SUPABASE_STAGING_URL%/}"
          FN="${FUNCTION_NAME}"
          if [ "$FN" = "staging-health" ]; then
            CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
              -H "apikey: ${SUPABASE_STAGING_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_STAGING_ANON_KEY}" \
              "${BASE}/functions/v1/staging-health")
            cat /tmp/health.json
            test "$CODE" = "200"
            python3 - <<'PY'
          import json
          body=json.load(open("/tmp/health.json", encoding="utf-8"))
          assert body.get("status") == "healthy", body
          assert body.get("environment") == "staging", body
          text=json.dumps(body).lower()
          for bad in ("service_role", "password", "eyj"):
              assert bad not in text, bad
          PY
          else
            CODE=$(curl -sS -o /tmp/opt.txt -w "%{http_code}" -X OPTIONS \
              -H "apikey: ${SUPABASE_STAGING_ANON_KEY}" \
              "${BASE}/functions/v1/${FN}")
            test "$CODE" != "503"
          fi

      # Health contract v1 (Phase 2B). Probed separately from the legacy root
      # above so the pre-existing gate keeps its exact meaning. Structured
      # results are emitted for release evidence rather than relying on the
      # step's exit code alone.
      - name: Probe health contract v1
        if: ${{ needs.preflight.outputs.function_name == 'staging-health' }}
        env:
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          BASE="${SUPABASE_STAGING_URL%/}/functions/v1/staging-health"
          probe() {
            curl -sS -o "$2" -w "%{http_code}" \
              -H "apikey: ${SUPABASE_STAGING_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_STAGING_ANON_KEY}" \
              "${BASE}$1"
          }
          LIVE_CODE=$(probe "/health/live" /tmp/live.json)
          READY_CODE=$(probe "/health/ready" /tmp/ready.json)
          VERSION_CODE=$(probe "/version" /tmp/version.json)
          echo "live=${LIVE_CODE} ready=${READY_CODE} version=${VERSION_CODE}"
          cat /tmp/live.json; echo; cat /tmp/ready.json; echo; cat /tmp/version.json; echo
          python3 - <<'PY'
          import json, os
          live = json.load(open("/tmp/live.json", encoding="utf-8"))
          ready = json.load(open("/tmp/ready.json", encoding="utf-8"))
          version = json.load(open("/tmp/version.json", encoding="utf-8"))

          assert live.get("status") == "alive", live
          assert live.get("environment") == "staging", live
          assert ready.get("environment") == "staging", ready
          assert version.get("environment") == "staging", version

          # The public surface must never echo credential material.
          for body in (live, ready, version):
              text = json.dumps(body).lower()
              for bad in ("service_role", "password", "eyj", "sbp_"):
                  assert bad not in text, (bad, body)

          # Release identity is corroborating evidence. Reported, not asserted
          # here: activation wires the deployment metadata, and the exact
          # candidate verifier is what compares it against the frozen manifest.
          state = version.get("releaseIdentityState")
          print(f"releaseIdentityState={state}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"- health contract: live/ready/version probed, releaseIdentityState={state}\n")
          PY

      - name: Upload health contract evidence
        if: ${{ always() && needs.preflight.outputs.function_name == 'staging-health' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-release-health-${{ github.run_id }}
          path: |
            /tmp/live.json
            /tmp/ready.json
            /tmp/version.json
          if-no-files-found: warn
          retention-days: 30

  synthetic-tests:
    name: Synthetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - preflight
      - health-check
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Run staging deployment smoke tests
        run: |
          set -euo pipefail
          node --test __tests__/staging/stagingDeployPipeline.test.js

  rollback-on-failure:
    name: Rollback on failure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - preflight
      - deploy-one-function
      - health-check
      - synthetic-tests
    if: |
      always() &&
      needs.deploy-one-function.result == 'success' &&
      (needs.health-check.result == 'failure' || needs.synthetic-tests.result == 'failure')
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Download deployment manifest
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: staging-deploy-${{ github.run_number }}
          path: .

      - name: Resolve manifest path
        id: manifest
        run: |
          set -euo pipefail
          MANIFEST="${{ needs.deploy-one-function.outputs.manifest_path }}"
          if [ -z "$MANIFEST" ] || [ ! -f "$MANIFEST" ]; then
            MANIFEST="$(find artifacts/staging-deployments -name '*.json' -type f 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$MANIFEST" ] || [ ! -f "$MANIFEST" ]; then
            echo "No deployment manifest available for rollback"
            exit 1
          fi
          echo "path=${MANIFEST}" >> "$GITHUB_OUTPUT"
          echo "Using manifest: ${MANIFEST}"

      - name: Roll back deployed function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF || 'yzqjvdfgefveprobvvyw' }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/rollback-staging-function.mjs --manifest "${{ steps.manifest.outputs.path }}" | tee rollback-result.json

      - name: Upload rollback artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-rollback-${{ github.run_number }}
          path: |
            rollback-result.json
            artifacts/staging-rollbacks/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail workflow after rollback attempt
        run: |
          set -euo pipefail
          echo "Post-deployment validation failed; rollback attempted."
          exit 1

  publish-deployment-artifact:
    name: Publish deployment artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - preflight
      - deploy-one-function
      - health-check
      - synthetic-tests
      - rollback-on-failure
    if: always()
    steps:
      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "## Controlled staging deployment"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Function | ${{ needs.preflight.outputs.function_name }} |"
            echo "| Deploy | ${{ needs.deploy-one-function.result }} |"
            echo "| Health | ${{ needs.health-check.result }} |"
            echo "| Synthetic | ${{ needs.synthetic-tests.result }} |"
            echo "| Rollback | ${{ needs.rollback-on-failure.result }} |"
            echo "| Manifest | ${{ needs.deploy-one-function.outputs.manifest_path }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.deploy-one-function.result }}" != "success" ]; then
            echo "Deploy failed"
            exit 1
          fi
          if [ "${{ needs.health-check.result }}" != "success" ] || [ "${{ needs.synthetic-tests.result }}" != "success" ]; then
            echo "Post-deployment validation failed"
            if [ "${{ needs.rollback-on-failure.result }}" != "success" ]; then
              echo "Rollback did not succeed — workflow failed"
            fi
            exit 1
          fi
