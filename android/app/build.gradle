apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = []

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Governed certification selectors (Build 34 Android staging certification).
 *
 * Both default to FALSE. They are set in exactly one governed place -- the
 * `staging-certification` profile's env in eas.json -- and nowhere else. An
 * ordinary production/staging/preview build, and any local gradle
 * invocation, leaves them unset and gets the unchanged release behaviour.
 *
 * They are deliberately read as an explicit string comparison against
 * "true": a missing, empty, false, or malformed value all fail closed.
 */
def isCertificationSelectorEnabled(Object gradleProperty, String environmentValue) {
    def resolved = gradleProperty != null ? gradleProperty.toString() : environmentValue
    return resolved != null && resolved.trim().equalsIgnoreCase('true')
}

// Voice Scan certification: re-grants RECORD_AUDIO for the certification AAB
// only. See android/app/src/certification/AndroidManifest.xml for the full
// rationale and the invariants that file must hold.
def kscanVoiceCertification = isCertificationSelectorEnabled(
    findProperty('kscan.voiceCertification'),
    System.getenv('KSCAN_VOICE_CERTIFICATION')
)
println "kscan: voiceCertification=${kscanVoiceCertification}"

// ANDROID-VOICE-01: generalized native Voice capability (non-public,
// build-time only). Distinct from kscanVoiceCertification above on purpose --
// that selector's own name and the guards below hard-lock it to the
// staging-certification profile ONLY, and that meaning must not be silently
// reinterpreted to also cover production. A release operator reading
// KSCAN_VOICE_CERTIFICATION=true would reasonably understand it to mean
// "this artifact is the staging-certification build"; having the same
// variable also mean "production has Voice" would make that reading false.
// This is a second, generic selector for the identical native effect
// (RECORD_AUDIO + the already-compiled-in Voice bridge), usable by any
// profile the guards below approve. Today that is staging-certification
// (still reached only via kscanVoiceCertification above) and production
// (reached only once a release operator explicitly sets this selector out of
// band -- eas.json commits it to NO profile, production included; see
// docs/build34-android-voice-production-readiness-runbook.md). Same
// fail-closed reading convention as every other governed selector here.
def kscanVoiceNativeCapability = isCertificationSelectorEnabled(
    findProperty('kscan.voiceNativeCapability'),
    System.getenv('KSCAN_VOICE_NATIVE_CAPABILITY')
)
println "kscan: voiceNativeCapability=${kscanVoiceNativeCapability}"

// The single derived signal that actually gates native materialization
// (the manifest swap further down): true when EITHER the legacy
// certification-only selector or the generalized capability selector
// resolves true. Guards below still police each raw selector separately --
// this derived value never grants an artifact its OWN authority.
def voiceNativeCapabilityMaterialized = kscanVoiceCertification || kscanVoiceNativeCapability
println "kscan: voiceNativeCapabilityMaterialized=${voiceNativeCapabilityMaterialized}"

/**
 * Build 34 certification build-guards (fail closed).
 *
 * A supplied Build 34 Android artifact was independently audited and found
 * to carry a stale native version code, with the Voice + Watchlist matrix
 * enabled in eas.json but RECORD_AUDIO and Firebase resources absent from the merged
 * artifact -- a build that looked configured and could not certify. These
 * guards make that shape impossible to produce silently: any resolved
 * mismatch between what the certification profile claims and what the
 * native build actually wires throws a GradleException and stops the
 * build, rather than shipping an artifact that only *looks* right.
 *
 * `EAS_BUILD_PROFILE` is exported by EAS Build for every build (native
 * Gradle execution included, not just Metro/JS bundling); a local
 * `./gradlew` invocation simply leaves it unset.
 */
def CERTIFICATION_PROFILE = 'staging-certification'
// ANDROID-VOICE-01: the one other profile the generalized native Voice
// capability selector (kscanVoiceNativeCapability) may activate under. The
// legacy kscanVoiceCertification selector is NOT affected by this constant --
// its own guard below still names CERTIFICATION_PROFILE exclusively.
def PRODUCTION_PROFILE = 'production'
def STAGING_SUPABASE_PROJECT_REF = 'yzqjvdfgefveprobvvyw'
def PRODUCTION_SUPABASE_PROJECT_REF = 'wyyuqfdxucjksghsmhry'

def easBuildProfile = System.getenv('EAS_BUILD_PROFILE')
println "kscan: EAS_BUILD_PROFILE=${easBuildProfile}"

// Objective A -- Voice invariant. EXPO_PUBLIC_VOICESCAN_ENABLED (the client
// flag that renders the Voice affordance) and KSCAN_VOICE_CERTIFICATION (the
// native selector that grants RECORD_AUDIO) are a governed pair: eas.json
// sets both together for `staging-certification` and neither anywhere else
// (__tests__/easConfigIntegrity.test.js enforces that at the config level).
// This is the same invariant enforced again at the point the native build
// actually consumes it, so a future profile cannot set one without the
// other and still produce an artifact.
def voiceScanEnabled = isCertificationSelectorEnabled(
    findProperty('expo.public.voicescanEnabled'),
    System.getenv('EXPO_PUBLIC_VOICESCAN_ENABLED')
)
println "kscan: voicescanEnabled=${voiceScanEnabled}"

if (voiceScanEnabled != voiceNativeCapabilityMaterialized) {
    throw new GradleException(
        "kscan: Voice invariant violated -- EXPO_PUBLIC_VOICESCAN_ENABLED resolved " +
        "${voiceScanEnabled} but native Voice capability resolved ${voiceNativeCapabilityMaterialized} " +
        "(KSCAN_VOICE_CERTIFICATION=${kscanVoiceCertification}, " +
        "KSCAN_VOICE_NATIVE_CAPABILITY=${kscanVoiceNativeCapability}). " +
        "The two must resolve identically: Voice client code/UI rendering without a native " +
        "manifest granting RECORD_AUDIO (or such a manifest granting RECORD_AUDIO with no " +
        "client affordance to use it) is exactly the invalid state this guard exists to make " +
        "impossible. Refusing to build."
    )
}

// certification-only native selectors must never be active outside the
// certification profile -- the eas.json-level leak controls already prove
// no OTHER profile sets these keys, but this repeats the check against
// whatever the native build actually resolved at execution time, so a
// selector supplied out-of-band (a stray `-Pkscan.voiceCertification=true`,
// a misconfigured CI secret) fails the same way a leaked eas.json key would.
if (easBuildProfile != null && easBuildProfile != CERTIFICATION_PROFILE && kscanVoiceCertification) {
    throw new GradleException(
        "kscan: KSCAN_VOICE_CERTIFICATION resolved true under EAS_BUILD_PROFILE=" +
        "${easBuildProfile}. The certification-only Voice native selector must be active " +
        "under ${CERTIFICATION_PROFILE} only. Refusing to build."
    )
}

if (easBuildProfile == CERTIFICATION_PROFILE && !(voiceScanEnabled && kscanVoiceCertification)) {
    throw new GradleException(
        "kscan: EAS_BUILD_PROFILE=${CERTIFICATION_PROFILE} requires both " +
        "EXPO_PUBLIC_VOICESCAN_ENABLED and KSCAN_VOICE_CERTIFICATION to resolve true " +
        "(got voicescanEnabled=${voiceScanEnabled}, voiceCertification=${kscanVoiceCertification}). " +
        "Refusing to build the governed Build 34 certification artifact without the full Voice matrix."
    )
}

// ANDROID-VOICE-01 -- the generalized native Voice capability selector must
// never be active outside its approved profiles. Same shape as the
// certification-only leak guard above, widened to the profiles a native
// Voice-capable artifact may legitimately come from. Production is approved
// here ONLY because a future, separately authorized release explicitly sets
// KSCAN_VOICE_NATIVE_CAPABILITY out of band -- eas.json's production env does
// not and must not set it (see
// docs/build34-android-voice-production-readiness-runbook.md). Every other
// profile (staging, preview, development, or any future one) stays
// unsupported and fails closed, exactly like the certification-only selector
// leaking into any profile but its own.
def VOICE_NATIVE_CAPABILITY_ALLOWED_PROFILES = [CERTIFICATION_PROFILE, PRODUCTION_PROFILE]
if (easBuildProfile != null && kscanVoiceNativeCapability && !VOICE_NATIVE_CAPABILITY_ALLOWED_PROFILES.contains(easBuildProfile)) {
    throw new GradleException(
        "kscan: KSCAN_VOICE_NATIVE_CAPABILITY resolved true under EAS_BUILD_PROFILE=" +
        "${easBuildProfile}, which is not an approved Voice-capable profile " +
        "(${VOICE_NATIVE_CAPABILITY_ALLOWED_PROFILES.join(', ')}). Refusing to build."
    )
}

/**
 * Firebase Cloud Messaging configuration, materialised from the governed EAS
 * FILE SECRET named GOOGLE_SERVICES_JSON.
 *
 * google-services.json is NEVER committed (see android/app/.gitignore). EAS
 * writes the decrypted file to a temporary path and exports that path as the
 * GOOGLE_SERVICES_JSON environment variable; this block copies it into the
 * app module where the Google Services Gradle plugin expects it. A local
 * developer can do the same by exporting GOOGLE_SERVICES_JSON, or by placing
 * the file at android/app/google-services.json themselves.
 *
 * When the secret is absent the plugin is simply not applied: the build
 * succeeds and produces an artifact with no Firebase configuration, which is
 * the honest state (Android push cannot deliver) rather than a build that
 * looks configured and silently cannot send. Nothing else about the build
 * changes, and no Firebase Analytics/Ads/Crashlytics product is added --
 * only the messaging configuration expo-notifications already needs.
 */
def googleServicesTarget = file('google-services.json')
def googleServicesSecretPath = System.getenv('GOOGLE_SERVICES_JSON')
if (googleServicesSecretPath != null && !googleServicesSecretPath.trim().isEmpty()) {
    def secretFile = file(googleServicesSecretPath.trim())
    if (secretFile.exists() && secretFile.absolutePath != googleServicesTarget.absolutePath) {
        copy {
            from secretFile
            into googleServicesTarget.parentFile
            rename { 'google-services.json' }
        }
    } else if (!secretFile.exists()) {
        logger.warn("kscan: GOOGLE_SERVICES_JSON is set but ${secretFile} does not exist; FCM will NOT be configured.")
    }
}
def googleServicesConfigured = googleServicesTarget.exists()
println "kscan: googleServicesConfigured=${googleServicesConfigured}"

// Objective C -- Watchlist push must fail closed. The conditional
// google-services.json apply above is intentionally lenient (an
// unconfigured build must stay green for every profile that does not need
// push), but a Watchlist-enabled certification artifact with no Firebase
// configuration looks valid and can never deliver Android push -- exactly
// the silent-failure shape this repair exists to close. This does NOT make
// Firebase mandatory for any profile where Smart Watchlist is off, and it
// does not touch production configuration.
def smartWatchlistEnabled = isCertificationSelectorEnabled(
    findProperty('expo.public.smartWatchlistV1'),
    System.getenv('EXPO_PUBLIC_SMART_WATCHLIST_V1')
)
println "kscan: smartWatchlistEnabled=${smartWatchlistEnabled}"

if (smartWatchlistEnabled && !googleServicesConfigured) {
    throw new GradleException(
        "Smart Watchlist is enabled but GOOGLE_SERVICES_JSON did not materialize; " +
        "refusing to build an Android artifact without FCM configuration."
    )
}

// Objective D -- the certification backend must be staging. This is an
// assertion only: it never rewrites EXPO_PUBLIC_SUPABASE_URL and never
// touches production configuration. It exists because `staging-certification`
// inherits its backend via eas.json's `extends: staging` (see
// __tests__/easConfigIntegrity.test.js), and this repeats that guarantee at
// the point the native build actually resolves the environment, so a future
// override or a misconfigured CI secret cannot silently point a
// certification artifact at production, or at no backend at all.
if (easBuildProfile == CERTIFICATION_PROFILE) {
    def supabaseUrl = System.getenv('EXPO_PUBLIC_SUPABASE_URL')
    println "kscan: EXPO_PUBLIC_SUPABASE_URL resolved for certification=${supabaseUrl != null}"
    // Production is checked first and separately so that a certification
    // build accidentally pointed at production gets its own explicit,
    // actionable error instead of being folded into the generic
    // "missing or unrecognised project" case below.
    if (supabaseUrl != null && supabaseUrl.contains(PRODUCTION_SUPABASE_PROJECT_REF)) {
        throw new GradleException(
            "kscan: EAS_BUILD_PROFILE=${CERTIFICATION_PROFILE} resolved " +
            "EXPO_PUBLIC_SUPABASE_URL to the PRODUCTION Supabase project " +
            "(${PRODUCTION_SUPABASE_PROJECT_REF}). Refusing to build a certification " +
            "artifact against production."
        )
    }
    if (supabaseUrl == null || !supabaseUrl.trim().contains(STAGING_SUPABASE_PROJECT_REF)) {
        throw new GradleException(
            "kscan: EAS_BUILD_PROFILE=${CERTIFICATION_PROFILE} requires " +
            "EXPO_PUBLIC_SUPABASE_URL to resolve to the staging Supabase project " +
            "(${STAGING_SUPABASE_PROJECT_REF}), but it was missing or resolved to a " +
            "different project. Refusing to build a certification artifact against an " +
            "unverified backend."
        )
    }
}

// Objective E -- artifact-readable build provenance. The stale audited
// artifact could not prove which source SHA or profile produced it. These
// values are written into the artifact itself (string resources +
// BuildConfig, wired into defaultConfig below) so provenance is
// inspectable directly from the built APK/AAB, survives R8 (resValue
// entries are resource-table strings, not code, and resource shrinking is
// deliberately not enabled by this repair), and is never fabricated: a
// local/non-EAS build honestly reports "local" / "unknown" rather than
// inventing a profile or commit.
def kscanBuildProfile = easBuildProfile ?: 'local'
def kscanSourceCommitRaw = System.getenv('EAS_BUILD_GIT_COMMIT_HASH')
def kscanSourceCommit = (kscanSourceCommitRaw != null && !kscanSourceCommitRaw.trim().isEmpty()) ? kscanSourceCommitRaw.trim() : 'unknown'
println "kscan: buildProfile=${kscanBuildProfile} sourceCommit=${kscanSourceCommit}"

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.kscanai.app'
    defaultConfig {
        applicationId 'com.kscanai.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 23
        versionName "1.0.1"

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""

        // Objective E: artifact-readable provenance. resValue writes real
        // string resources (inspectable via `aapt2 dump strings` / the
        // resource table on the built APK/AAB, not just from source) so
        // provenance survives even if a reader has no BuildConfig to
        // decompile. BuildConfig mirrors them for in-app/debug use, but per
        // the governed requirement is not the only mechanism.
        resValue "string", "kscan_build_profile", kscanBuildProfile
        resValue "string", "kscan_source_commit", kscanSourceCommit
        buildConfigField "String", "KSCAN_BUILD_PROFILE", "\"${kscanBuildProfile}\""
        buildConfigField "String", "KSCAN_SOURCE_COMMIT", "\"${kscanSourceCommit}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Release signing is managed by EAS Build via eas credentials.
            // For local builds, set KSCAN_STORE_FILE, KSCAN_STORE_PASSWORD,
            // KSCAN_KEY_ALIAS, and KSCAN_KEY_PASSWORD in android/local.properties
            // or ~/.gradle/gradle.properties. Do NOT commit any keystore file.
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    sourceSets {
        release {
            // Voice-capable manifest swap. Off by default: the release build
            // type keeps src/release/AndroidManifest.xml, which grants no
            // microphone permission. Fires when EITHER the legacy
            // staging-certification-only selector or the generalized
            // ANDROID-VOICE-01 native capability selector resolves true
            // (voiceNativeCapabilityMaterialized, defined above) -- both
            // select the SAME manifest, since its content (grant
            // RECORD_AUDIO, forbid everything else) is identical either way;
            // only the guards above differ in which EAS profile may set
            // which selector. Build type manifests outrank src/main, so the
            // certification file's tools:node="replace" on RECORD_AUDIO
            // supersedes main's tools:node="remove".
            if (voiceNativeCapabilityMaterialized) {
                manifest.srcFile 'src/certification/AndroidManifest.xml'
            }
        }
    }
}

// Applied only when a real google-services.json is present. Keeping it
// conditional is what lets an unconfigured build stay green instead of
// failing with "File google-services.json is missing" -- and what keeps
// production, which does not carry the secret, byte-identical to today.
if (googleServicesConfigured) {
    apply plugin: 'com.google.gms.google-services'
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
