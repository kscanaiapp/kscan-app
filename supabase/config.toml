# Supabase project configuration.
#
# Declares the JWT posture of every deployed Edge Function so a deploy can never
# silently change it. Without this file the CLI applies its own default, which
# would flip scan-identify from its deployed verify_jwt = false to true and
# break the commerce-only (MODE B) request, which genuinely has no bearer
# token by design.
#
# Changing any verify_jwt value here changes production authentication
# behaviour and is an owner decision, not a deployment side effect.

project_id = "yzqjvdfgefveprobvvyw"

# ── LLM surfaces ─────────────────────────────────────────────────────────────

# Scanner + TextScan. Gateway JWT verification is off because the
# commerce-only (MODE B) request has no bearer token by design. The function
# verifies the JWT itself for text/image identification: paid inference
# requires a verified, non-anonymous user (Build 32 P1-B) and is rejected
# outright otherwise, with no fallback to project-key presence. Authenticated
# callers are then subject to the shared account-active guard before quota or
# any provider call.
[functions.scan-identify]
verify_jwt = false

# Elise. Always authenticated; the function additionally applies the shared
# account-active guard before attachment resolution, quota and the provider.
[functions.stylechat-generate]
verify_jwt = true

# Outfit / private Dressing Room Elise. Always authenticated. Declared explicitly
# so a deploy cannot silently inherit the CLI default and drift from the live
# verify_jwt = true posture that production already enforces.
[functions.style-outfit-generate]
verify_jwt = true

# ── Account lifecycle ────────────────────────────────────────────────────────

[functions.handle-user-deletion]
verify_jwt = true

# Restoration and worker entry points authenticate by signed token or worker
# secret rather than a user JWT.
[functions.restore-account]
verify_jwt = false

[functions.resend-restoration-email]
verify_jwt = false

[functions.process-account-deletions]
verify_jwt = false

# ── Privacy ──────────────────────────────────────────────────────────────────

[functions.privacy-data-export]
verify_jwt = true

[functions.privacy-correction-request]
verify_jwt = true

# ── Commerce and media ───────────────────────────────────────────────────────

[functions.product-search-deals]
verify_jwt = true

[functions.nike-shoe-details]
verify_jwt = true

[functions.kickscrew-sneaker-description]
verify_jwt = true

[functions.search-vinted-secondhand]
verify_jwt = true

[functions.tryon-clothes-pro]
verify_jwt = true

[functions.shared-room-image-url]
verify_jwt = true

[functions.stylist-speech]
verify_jwt = true

# ── K+ Smart Watchlist ───────────────────────────────────────────────────────

# Dual-mode: an x-watchlist-worker-secret header (Tier 2 background sweep) OR
# a normal user Authorization bearer token (Tier 1 create/pause/resume/
# delete/refresh). The function authenticates itself in both cases, the same
# reason scan-identify's MODE B and the deletion worker functions do.
[functions.commerce-watch-refresh]
verify_jwt = false

# ── K+ entitlement boundary ──────────────────────────────────────────────────

# User-facing activation. Always authenticated; identity is re-derived from
# the verified JWT inside the function regardless of this platform-level gate.
[functions.kplus-activate]
verify_jwt = true

# Owner/worker-invoked reconciliation sweep. Authenticates via the
# x-kplus-reconcile-secret header, not a user JWT.
[functions.kplus-reconcile-revenuecat]
verify_jwt = false

# ── Local shadow stack ───────────────────────────────────────────────────────
#
# Explicit non-default ports. Several other K Scan worktrees run their own local
# stacks concurrently; without these the shadow build silently collides with
# whichever stack claimed 54321/54322 first.

[api]
enabled = true
port = 54721
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54722
shadow_port = 54720
major_version = 17

[studio]
enabled = false

[inbucket]
enabled = false

[analytics]
enabled = false

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
