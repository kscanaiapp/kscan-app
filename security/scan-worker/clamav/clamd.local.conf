# Applied on top of clamav/clamav's base clamd.conf. See ../Dockerfile and
# docs/security/malware-scanner-operations.md for context — this file is
# reviewable infrastructure-as-code, not a deployed configuration.

# Bound a single scan to the same ceiling as the largest
# maxCompressedBytes in security/uploads/image-ingestion-policy.json.
StreamMaxLength 10M

# Bound scanner concurrency (Phase 10: concurrent-scan limit). Tune to the
# host's CPU/memory once real deployment sizing is known.
MaxThreads 4

# Bound how long clamd will wait on a slow/stalled INSTREAM sender before
# aborting the scan — belt-and-suspenders alongside the client-side timeout
# in security/ingestion-gate/clamdClient.js.
ReadTimeout 30

# No unauthenticated network exposure beyond the private network this
# container is deployed into — clamd has no built-in auth of its own, so the
# deployment's network boundary (private subnet / firewall / service mesh)
# IS the access control. Never bind this to 0.0.0.0 on a host with a public
# IP without an intermediate firewall.
TCPSocket 3310
TCPAddr 0.0.0.0

# Never let clamd fork per connection unbounded.
MaxConnectionQueueLength 32

# Do not log scanned filenames/paths at elevated verbosity -- keep clamd's
# own operational logging (startup, signature reload, health) only.
LogVerbose false
