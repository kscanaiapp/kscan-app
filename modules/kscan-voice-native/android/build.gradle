apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.kscanvoicenative'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.kscanvoicenative"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ProcessLifecycleOwner, used to release the microphone the moment the
  // app leaves the foreground, independent of any single Activity.
  implementation "androidx.lifecycle:lifecycle-process:2.8.7"
}
