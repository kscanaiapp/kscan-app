apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.kscan.metawearable'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()

static def safeExtGet(project, prop, fallback) {
  return project.rootProject.ext.has(prop) ? project.rootProject.ext.get(prop) : fallback
}

// ---------------------------------------------------------------------------
// Meta Wearables Device Access Toolkit (DAT) wiring.
//
// The DAT artifacts live in a PRIVATE GitHub Packages repository and require a
// personal access token carrying the `read:packages` scope. Without one every
// artifact resolves HTTP 401, which would fail the whole Android build for
// every developer and every CI job — including the ones that have nothing to
// do with the glasses.
//
// So the DAT dependency and the source set that touches it are both opt-in,
// controlled by `kscan.mwdat.enabled`. With the flag off (the default) this
// module still builds and still ships: MetaWearableModule compiles against no
// DAT symbol at all and deterministically reports the adapter as unavailable.
// With the flag on, the `mwdat` source set joins the compilation and the real
// adapter is linked in. Nothing about the JS contract changes between the two.
// ---------------------------------------------------------------------------
// Settable either as a Gradle property (-Pkscan.mwdat.enabled=true, or in
// gradle.properties) or as an environment variable, because EAS/CI build
// profiles can set env vars but cannot easily pass a dotted Gradle property.
def mwdatEnabled = (
  System.getenv('KSCAN_MWDAT_ENABLED') ?: project.findProperty('kscan.mwdat.enabled') ?: 'false'
).toString().toBoolean()
def mwdatVersion = (
  System.getenv('KSCAN_MWDAT_VERSION') ?: project.findProperty('kscan.mwdat.version') ?: '0.9.0'
).toString()
def mwdatToken = System.getenv('GITHUB_TOKEN') ?: project.findProperty('github_token')
def mwdatActor = System.getenv('GITHUB_ACTOR') ?: (project.findProperty('github_actor') ?: 'kscan')

// The credential gate (and the maven repository it guards) is applied AFTER
// the `android {}` block below, not before it. Gradle evaluates a build
// script top to bottom, so a GradleException thrown here would abort the
// script before AGP's `android {}` DSL ever ran — and AGP's own project
// evaluation would then separately fail with an unrelated-looking
// "compileSdk not specified" error, masking the real cause with a confusing
// second one. Ordering it last means AGP configuration always completes
// first, so a missing-token failure is reported exactly once, clearly.

android {
  namespace 'com.kscan.metawearable'
  compileSdk safeExtGet(project, 'compileSdkVersion', 35)

  defaultConfig {
    // DAT requires Android 10+ (API 29), but that is a constraint on the DAT
    // SDK itself (linked only in the `mwdat` source set when the flag is on),
    // not on this module's always-compiled main source set, which calls no
    // API-29-specific symbol. Declaring an artificial minSdk floor of 29 here
    // made the Android manifest merger refuse the WHOLE app (whose real
    // minSdk is lower) even with the flag off, since the merger enforces a
    // library's declared minSdk unconditionally, before any code runs.
    // Below 29, MetaWearableModule's requireSupportedOs() runtime guard is
    // what actually protects DAT calls from ever executing - it is the
    // correct place for that check, not the manifest. If the DAT artifacts'
    // own AARs declare a real minSdk-29 requirement, the manifest merger will
    // enforce that for a genuine reason once the flag is on and they are
    // actually linked in - which is the right point to catch it.
    minSdk safeExtGet(project, 'minSdkVersion', 24) as Integer
    buildConfigField 'boolean', 'MWDAT_ENABLED', "${mwdatEnabled}"
    buildConfigField 'String', 'MWDAT_VERSION', "\"${mwdatVersion}\""
  }

  buildFeatures {
    buildConfig true
  }

  sourceSets {
    main {
      java.srcDirs = ['src/main/java']
    }
  }

  if (mwdatEnabled) {
    sourceSets.main.java.srcDirs += 'src/mwdat/java'
    // The DAT permissions (BLUETOOTH / BLUETOOTH_CONNECT) and the DAM App
    // Model meta-data live in a manifest that is selected ONLY here. This
    // module is autolinked into every K Scan build whether or not the flag is
    // on, so anything left in src/main/AndroidManifest.xml is merged into the
    // shipping app unconditionally — which is how a flag-off build ended up
    // requesting Nearby-devices access for hardware it cannot talk to.
    sourceSets.main.manifest.srcFile 'src/mwdat/AndroidManifest.xml'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
}

if (mwdatEnabled) {
  if (!mwdatToken) {
    throw new GradleException(
      'kscan.mwdat.enabled=true but no GitHub Packages credential was found. ' +
      'Set GITHUB_TOKEN (or github_token in local.properties) to a token with the read:packages scope. ' +
      'Without it com.meta.wearable:mwdat-* resolves HTTP 401.')
  }
  repositories {
    maven {
      url = uri('https://maven.pkg.github.com/facebook/meta-wearables-dat-android')
      credentials {
        username = mwdatActor
        password = mwdatToken
      }
    }
  }
}

dependencies {
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

  if (mwdatEnabled) {
    implementation "com.meta.wearable:mwdat-core:${mwdatVersion}"
    implementation "com.meta.wearable:mwdat-camera:${mwdatVersion}"
    implementation "com.meta.wearable:mwdat-display:${mwdatVersion}"
    // MockDeviceKit ships as a normal dependency (not debug-only) because the
    // hardware-candidate build is the one that exercises it on a host with no
    // physical glasses. It is inert unless MockDeviceKit.enable(...) is called.
    implementation "com.meta.wearable:mwdat-mockdevice:${mwdatVersion}"
  }
}
