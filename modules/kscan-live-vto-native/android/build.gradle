apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.kscanlivevtonative'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.kscanlivevtonative"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests {
      // Left false deliberately. The geometry stack has NO Android
      // dependencies (see LiveVtoVec2.kt / LiveVtoJson.kt), so these tests
      // exercise the real production code, not stubs that quietly return
      // zero. If a future change reintroduces an Android type into the
      // geometry path, these tests fail loudly instead of passing vacuously.
      returnDefaultValues false
      includeAndroidResources false
    }
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'

  // N1-E perception provider. Pinned to an exact version, verified current
  // at integration time (Google Maven metadata, checked 2026-09-06) --
  // NOT copied from an old prompt or a cached memory of an earlier release
  // line. See docs/vto-live-native-n1-perception.md for the full
  // provenance record (framework license, model license, checksum, ABI
  // support, min SDK).
  implementation 'com.google.mediapipe:tasks-vision:1.0.0'

  // N1-F camera input. Pinned to the latest STABLE CameraX release line,
  // verified against Google's own Maven metadata at integration time
  // (2026-09-06) -- 1.6.2 is `<release>`; 1.7.0-alpha/beta/rc lines exist
  // but are deliberately not used here. All four artifacts release in
  // lockstep and must stay on the same version.
  implementation 'androidx.camera:camera-core:1.6.2'
  implementation 'androidx.camera:camera-camera2:1.6.2'
  implementation 'androidx.camera:camera-lifecycle:1.6.2'
  implementation 'androidx.camera:camera-view:1.6.2'
}
