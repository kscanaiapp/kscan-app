# TC-AVATAR-001: Animated avatar Home smoke
# Verifies the Home stylist card renders the greeting, the personalization
# flow opens, and a speech-enabled portrait can be selected.
# Note: Voice playback requires owner-approved voice IDs; without them the
# replay control is present but speech fails closed (silent/no state change).
appId: com.kscanai.app
name: "Smoke — Animated Avatar Home"
tags:
  - smoke
  - avatar
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "YOUR STYLIST"
    timeout: 15000

- assertVisible: "Ask Elise"
- assertVisible:
    id: "home-stylist-greeting"
- takeScreenshot: "avatar-home-default"

# Open personalization to select a speech-enabled portrait.
- tapOn:
    text: "Personalize"

- extendedWaitUntil:
    visible: "PERSONALIZE YOUR STYLIST"
    timeout: 8000

- takeScreenshot: "avatar-personalize-modal"

# stylist_portrait_02 is configured for speech in constants/stylistIdentity.ts.
- tapOn:
    id: "personalize-avatar-stylist_portrait_02"

- tapOn:
    text: "SAVE"

- extendedWaitUntil:
    visible: "YOUR STYLIST"
    timeout: 8000

# The replay control appears for speech-enabled portraits.
- assertVisible:
    id: "home-stylist-card"
- assertVisible:
    id: "home-stylist-greeting"
- assertVisible:
    id: "home-stylist-replay-button"
- takeScreenshot: "avatar-home-portrait"

# Tapping replay should not crash. Without approved voices speech fails closed,
# so the control remains a replay button rather than switching to stop.
- tapOn:
    id: "home-stylist-replay-button"

- extendedWaitUntil:
    visible:
      id: "home-stylist-replay-button"
    timeout: 5000

- takeScreenshot: "avatar-home-replay-fail-closed"
