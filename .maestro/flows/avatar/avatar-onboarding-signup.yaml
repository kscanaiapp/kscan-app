# TC-AVATAR-003: Onboarding sign-up smoke used to reach authenticated Home.
# This flow creates a real account against the configured Supabase project.
# It stops gracefully if email confirmation is required.
appId: com.kscanai.app
name: "Smoke — Avatar Onboarding Sign-up"
tags:
  - smoke
  - avatar
  - onboarding
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "onboarding-get-started-button-v1"
    timeout: 15000
- takeScreenshot: "avatar-onboarding-welcome"

- tapOn:
    id: "onboarding-get-started-button-v1"

- extendedWaitUntil:
    visible:
      id: "onboarding-continue-email-button-v1"
    timeout: 8000

- tapOn:
    id: "onboarding-continue-email-button-v1"

- extendedWaitUntil:
    visible:
      id: "onboarding-create-account-screen"
    timeout: 8000

- tapOn:
    id: "onboarding-full-name-input"
- inputText: "Avatar Smoke"

- tapOn:
    id: "onboarding-create-email-input"
- inputText: "${TEST_EMAIL}"

- tapOn:
    id: "onboarding-create-password-input"
- inputText: "SmokeTest123!"

- tapOn:
    id: "onboarding-create-confirm-password-input"
- inputText: "SmokeTest123!"

- tapOn:
    id: "onboarding-style-nickname-input"
- inputText: "Smoke"

- hideKeyboard

- tapOn:
    id: "onboarding-create-account-submit-button"

# If email confirmation is required, the flow cannot continue. Capture and stop.
- runFlow:
    when:
      visible:
        id: "onboarding-confirm-email-screen"
    commands:
      - takeScreenshot: "avatar-onboarding-confirm-email"
      - stopApp

# Otherwise proceed through terms and permissions.
- extendedWaitUntil:
    visible:
      id: "onboarding-terms-screen"
    timeout: 10000

- tapOn:
    id: "onboarding-terms-checkbox"
- tapOn:
    id: "onboarding-privacy-checkbox"
- tapOn:
    id: "onboarding-age-checkbox"

- takeScreenshot: "avatar-onboarding-terms"

- tapOn:
    id: "onboarding-accept-continue-button"

- extendedWaitUntil:
    visible:
      id: "onboarding-permissions-continue-button-v1"
    timeout: 10000

- tapOn:
    id: "onboarding-permissions-continue-button-v1"

- extendedWaitUntil:
    visible: "YOUR STYLIST"
    timeout: 15000

- takeScreenshot: "avatar-onboarding-home"
