# TC-AVATAR-002: Animated avatar StyleChat smoke
# Verifies rapid Home entry creates one usable StyleChat route with one persisted
# greeting, a compact selected-stylist header, and no replay/feedback controls.
appId: com.kscanai.app
name: "Smoke - Animated Avatar StyleChat"
tags:
  - smoke
  - avatar
---
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "YOUR STYLIST"
    timeout: 30000

# Rapid Start Chat input must still create and navigate to only one session.
- doubleTapOn:
    text: "Start Chat"

- extendedWaitUntil:
    visible:
      id: "style-chat-header"
    timeout: 30000

- assertVisible: "Elise"
- assertVisible:
    id: "style-chat-message-assistant"
- assertNotVisible: "Report Response"
- assertNotVisible:
    id: "home-stylist-replay-button"
- takeScreenshot: "avatar-stylechat-header"

- tapOn:
    text: "Home"

- extendedWaitUntil:
    visible: "YOUR STYLIST"
    timeout: 8000
