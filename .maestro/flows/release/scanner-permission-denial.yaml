# Release flow: scanner.permission_denial
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: scanner.permission_denial
tags:
  - release
  - scanner
  - permissions
  - negative
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- launchApp:
    clearState: true
    permissions:
      camera: deny
- runFlow: ../../subflows/sign-in-nolaunch.yaml
- tapOn:
    id: "home-v2-start-scan"
- extendedWaitUntil:
    visible:
      id: "scan-room-open-camera"
    timeout: 30000
- tapOn:
    id: "scan-room-open-camera"
# Denial must be handled in-app: no crash, no hang.
- extendedWaitUntil:
    visible: "Camera access is currently disabled.*"
    timeout: 20000
- assertVisible: "Grant Access"
- takeScreenshot: "scanner-permission-denied"
