# Release flow: closet.authorized_access_and_isolation
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: closet.authorized_access_and_isolation
tags:
  - release
  - closet
  - authorization
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "home-v2-library-card"
- extendedWaitUntil:
    visible:
      id: "library-section-closet"
    timeout: 30000
- takeScreenshot: "closet-authorized"
# Signing out must drop closet content: no other identity may see it.
- back
- tapOn:
    id: "home-logout-button"
- extendedWaitUntil:
    visible:
      id: "auth-email-input"
    timeout: 30000
- assertNotVisible:
    id: "closet-card"
- takeScreenshot: "closet-isolation-after-logout"
