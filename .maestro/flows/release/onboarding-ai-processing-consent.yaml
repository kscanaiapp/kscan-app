# Release flow: onboarding.ai_processing_consent
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: onboarding.ai_processing_consent
tags:
  - release
  - onboarding
  - consent
  - privacy
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome-screen-v1"
    timeout: 30000
- tapOn:
    id: "onboarding-get-started-button-v1"
- extendedWaitUntil:
    visible:
      id: "onboarding-terms-screen"
    timeout: 20000
# AI image-processing consent must be disclosed before any capture surface.
- assertVisible:
    id: "onboarding-privacy-checkbox"
- tapOn:
    id: "onboarding-privacy-checkbox"
- takeScreenshot: "onboarding-ai-processing-consent"
