# Release flow: resilience.foreground_background
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: resilience.foreground_background
tags:
  - release
  - resilience
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- runFlow: ../../subflows/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: "router-home-screen"
    timeout: 45000
- pressKey: Home
- launchApp:
    clearState: false
# Returning to foreground must restore the signed-in home, not the auth gate.
- extendedWaitUntil:
    visible:
      id: "router-home-screen"
    timeout: 45000
- assertNotVisible:
    id: "auth-email-input"
- takeScreenshot: "resilience-foreground-background"
