# Release flow: scanner.camera_or_photo_entry
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: scanner.camera_or_photo_entry
tags:
  - release
  - scanner
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "home-v2-start-scan"
- extendedWaitUntil:
    visible:
      id: "scan-room-open-camera"
    timeout: 30000
- assertVisible:
    id: "scan-room-upload-image"
- takeScreenshot: "scanner-entry"
