# Release flow: auth.invalid_sign_in
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: auth.invalid_sign_in
tags:
  - release
  - auth
  - negative
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- launchApp:
    clearState: true
- runFlow: ../../subflows/skip-onboarding.yaml
- tapOn:
    id: "onboarding-already-have-account-button-v1"
    optional: true
- extendedWaitUntil:
    visible:
      id: "auth-email-input"
    timeout: 20000
- tapOn:
    id: "auth-email-input"
- inputText: ${QA_EMAIL}
- tapOn:
    id: "auth-password-input"
- inputText: "definitely-not-the-password-000"
- tapOn:
    id: "auth-submit-button"
# The app must stay on the auth screen and must never reach home.
- extendedWaitUntil:
    visible:
      id: "auth-submit-button"
    timeout: 20000
- assertNotVisible:
    id: "router-home-screen"
- takeScreenshot: "auth-invalid-sign-in"
