# Release flow: scanner.successful_scan
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: scanner.successful_scan
tags:
  - release
  - scanner
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- runFlow: ../../subflows/sign-in.yaml
- runFlow: ../../subflows/open-scanner.yaml
- tapOn:
    id: "scan-room-upload-image"
- extendedWaitUntil:
    visible:
      id: "scan-room-analyze"
    timeout: 30000
- tapOn:
    id: "scan-room-analyze"
# scan-identify is a network call; allow a generous ceiling before failing.
- extendedWaitUntil:
    visible:
      id: "scan-result-card"
    timeout: 90000
- assertVisible:
    id: "scan-result-card-title"
- takeScreenshot: "scanner-successful-scan"
