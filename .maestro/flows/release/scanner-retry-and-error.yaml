# Release flow: scanner.retry_and_error
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: scanner.retry_and_error
tags:
  - release
  - scanner
  - negative
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- runFlow: ../../subflows/sign-in.yaml
- runFlow: ../../subflows/open-scanner.yaml
- tapOn:
    id: "scan-room-upload-image"
- extendedWaitUntil:
    visible:
      id: "scan-room-analyze"
    timeout: 30000
# Analyse offline: the app must surface a recoverable error, not crash.
- setAirplaneMode: enabled
- tapOn:
    id: "scan-room-analyze"
- extendedWaitUntil:
    visible: ".*(try again|connection|network|couldn).*"
    timeout: 60000
- takeScreenshot: "scanner-error-state"
- setAirplaneMode: disabled
# Retry must be available and must re-enter the scan surface.
- extendedWaitUntil:
    visible:
      id: "scan-room-analyze"
    timeout: 45000
- takeScreenshot: "scanner-retry-available"
