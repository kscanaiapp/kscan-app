# Release flow: home.load_and_navigation
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: home.load_and_navigation
tags:
  - release
  - home
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- runFlow: ../../subflows/sign-in.yaml
- extendedWaitUntil:
    visible:
      id: "router-home-screen"
    timeout: 45000
- takeScreenshot: "home-loaded"
# Library is reachable and returns home.
- tapOn:
    id: "home-v2-library-card"
- extendedWaitUntil:
    visible:
      id: "library-section-closet"
    timeout: 30000
- back
- extendedWaitUntil:
    visible:
      id: "router-home-screen"
    timeout: 30000
- takeScreenshot: "home-navigation-return"
