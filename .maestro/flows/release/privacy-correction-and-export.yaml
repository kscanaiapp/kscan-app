# Release flow: privacy.correction_and_export
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: privacy.correction_and_export
tags:
  - release
  - privacy
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "home-v2-privacy-button"

# Assert the real data-rights surface from app/privacy.tsx rather than a loose
# substring: the export action and the correction affordance must both exist.
- extendedWaitUntil:
    visible: "Request Data Export"
    timeout: 30000
- assertVisible: "Export or correct your account information"
- takeScreenshot: "privacy-data-rights"

# Non-destructive: the export request is not submitted. Proving the control is
# present and reachable is the release-relevant assertion; actually firing it
# would create real data-subject requests against staging on every run.
- assertVisible: "Request Data Export"
