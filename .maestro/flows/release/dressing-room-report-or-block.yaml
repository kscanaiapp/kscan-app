# Release flow: dressing_room.report_or_block
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: dressing_room.report_or_block
tags:
  - release
  - dressing-room
  - safety
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "home-v2-dressing-rooms-card"
- extendedWaitUntil:
    visible:
      id: "private-dressing-room-entry"
    timeout: 30000
- tapOn:
    id: "private-dressing-room-entry"
- extendedWaitUntil:
    visible:
      id: "room-messages-list"
    timeout: 45000

# The UGC safety control is a per-message Report action
# (components/rooms/RoomMessagesPanel.tsx, testID room-message-report-<id>).
# Asserting the share button here would not exercise reporting at all.
- assertVisible:
    id: "room-message-report-.*"
- takeScreenshot: "dressing-room-report-control"

- tapOn:
    id: "room-message-report-.*"

# "Report & Hide" immediately hides content and filters the sender, so this
# flow proves the control and its disclosure are reachable, then cancels.
# It deliberately does not confirm, so no QA room state is mutated.
- extendedWaitUntil:
    visible: "Report content"
    timeout: 15000
- assertVisible: "Report & Hide.*"
- takeScreenshot: "dressing-room-report-dialog"
- tapOn: "Cancel"
- assertVisible:
    id: "room-messages-list"
