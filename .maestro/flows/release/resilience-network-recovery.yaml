# Release flow: resilience.network_recovery
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: resilience.network_recovery
tags:
  - release
  - resilience
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- runFlow: ../../subflows/sign-in.yaml
- setAirplaneMode: enabled
- tapOn:
    id: "home-v2-library-card"
- extendedWaitUntil:
    visible:
      id: "library-section-closet"
    timeout: 45000
- takeScreenshot: "resilience-offline"
- setAirplaneMode: disabled
- back
# The app must recover without a relaunch.
- extendedWaitUntil:
    visible:
      id: "router-home-screen"
    timeout: 60000
- takeScreenshot: "resilience-network-recovered"
