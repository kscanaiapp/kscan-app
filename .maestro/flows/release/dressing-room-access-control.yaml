# Release flow: dressing_room.access_control
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: dressing_room.access_control
tags:
  - release
  - dressing-room
  - authorization
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "home-v2-dressing-rooms-card"
- extendedWaitUntil:
    visible:
      id: "private-dressing-room-entry"
    timeout: 30000
- takeScreenshot: "dressing-room-authorized"
