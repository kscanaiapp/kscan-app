# Release flow: onboarding.age_privacy_ack
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: onboarding.age_privacy_ack
tags:
  - release
  - onboarding
  - consent
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome-screen-v1"
    timeout: 30000
- tapOn:
    id: "onboarding-get-started-button-v1"
- extendedWaitUntil:
    visible:
      id: "onboarding-age-checkbox"
    timeout: 20000
- tapOn:
    id: "onboarding-age-checkbox"
- tapOn:
    id: "onboarding-terms-checkbox"
- tapOn:
    id: "onboarding-privacy-checkbox"
- tapOn:
    id: "onboarding-accept-continue-button"
# Consent complete: onboarding must advance past the terms screen.
- extendedWaitUntil:
    notVisible:
      id: "onboarding-terms-screen"
    timeout: 20000
- takeScreenshot: "onboarding-age-privacy-ack"
