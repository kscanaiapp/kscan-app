# Release flow: elise.initialization_and_auth
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: elise.initialization_and_auth
tags:
  - release
  - elise
  - stylechat
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "home-v2-stylechat-card"
- extendedWaitUntil:
    visible:
      id: "style-chat-screen"
    timeout: 45000
- assertVisible:
    id: "style-chat-input"
- takeScreenshot: "elise-initialized"
