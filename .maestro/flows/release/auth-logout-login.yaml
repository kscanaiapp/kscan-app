# Release flow: auth.logout_login
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: auth.logout_login
tags:
  - release
  - auth
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "home-logout-button"
- extendedWaitUntil:
    visible:
      id: "auth-email-input"
    timeout: 30000
# Signing back in must work immediately after logout.
- tapOn:
    id: "auth-email-input"
- inputText: ${QA_EMAIL}
- tapOn:
    id: "auth-password-input"
- inputText: ${QA_PASSWORD}
- tapOn:
    id: "auth-submit-button"
- extendedWaitUntil:
    visible:
      id: "router-home-screen"
    timeout: 45000
- takeScreenshot: "auth-logout-login"
