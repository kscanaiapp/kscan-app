# Release flow: privacy.account_deletion_request
# Branch-neutral. Selectors are app testIDs; identities come from QA_EMAIL /
# QA_PASSWORD injected by the release workflow, never hardcoded.
appId: ${APP_ID}
name: privacy.account_deletion_request
tags:
  - release
  - privacy
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "home-v2-privacy-button"

# Assert the real deletion surface from app/privacy.tsx. The title differs when
# a request is already pending, so accept either state rather than assuming a
# clean QA account.
- extendedWaitUntil:
    visible: "Request permanent account closure"
    timeout: 30000
- assertVisible: "Delete Account|Deletion Request Pending"
- takeScreenshot: "privacy-account-deletion-entry"

# Non-destructive by design: the flow stops before confirming. Submitting a real
# deletion would destroy the shared QA identity every other release flow signs
# in with, so the release-relevant assertion is that the control and its
# disclosure are present and reachable.
