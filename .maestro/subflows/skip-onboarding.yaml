# Subflow: skip-onboarding
appId: ${APP_ID}
name: skip-onboarding
tags:
  - subflow
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
# Advance through the consent gate to reach the auth choice screen.
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome-screen-v1"
    timeout: 40000
- tapOn:
    id: "onboarding-get-started-button-v1"
- extendedWaitUntil:
    visible:
      id: "onboarding-terms-checkbox"
    timeout: 20000
- tapOn:
    id: "onboarding-age-checkbox"
- tapOn:
    id: "onboarding-terms-checkbox"
- tapOn:
    id: "onboarding-privacy-checkbox"
- tapOn:
    id: "onboarding-accept-continue-button"
- tapOn:
    id: "onboarding-permissions-not-now-button-v1"
    optional: true
