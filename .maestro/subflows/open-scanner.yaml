# Subflow: open-scanner
appId: ${APP_ID}
name: open-scanner
tags:
  - subflow
env:
  APP_ID: ${APP_ID}
  QA_EMAIL: ${QA_EMAIL}
  QA_PASSWORD: ${QA_PASSWORD}
---
# Reach the scan surface from home.
- extendedWaitUntil:
    visible:
      id: "router-home-screen"
    timeout: 45000
- tapOn:
    id: "home-v2-start-scan"
- extendedWaitUntil:
    visible:
      id: "scan-room-open-camera"
    timeout: 30000
